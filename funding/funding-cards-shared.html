<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../academic-cards/academic-cards.css?v=20261103-apa7">
<script src="../academic-cards/academic-renderer.js?v=20261103-apa7"></script>
<style>
html,body{width:100%;margin:0;padding:0;background:#ffffff;overflow:hidden}
body{color:#333333}
#app.rivers-academic-wrap{width:100%;max-width:none;margin:0;padding:0}
#app .rivers-academic-ref{max-width:none;font-size:18px;line-height:26px}
#app .rivers-project-title{white-space:normal;overflow:visible;text-overflow:clip}
#app .rivers-academic-card{border-radius:10px;padding:18px 20px}
#app .rivers-academic-badge{font-size:11px}
#app .rivers-academic-button,
#app .rivers-academic-search{font-size:13px}
#app .rivers-academic-count,
#app .rivers-academic-label,
#app .rivers-academic-search,
#app .rivers-academic-ref,
#app .rivers-funder,
#app .rivers-academic-button:not(.active):not(:hover){color:#333333}
#app .rivers-academic-search::placeholder{color:#333333}
</style>
</head>
<body>
<div id="app" class="rivers-academic-wrap"></div>
<script>
function extractYenAmount(item) {
  if (item && typeof item === 'object' && Number.isFinite(item.awardAmount)) {
    return item.awardAmount;
  }
  var ref = item && typeof item === 'object' ? item.ref : item;
  var text = String(ref || '');
  var marker = text.indexOf('Award: ¥');
  if (marker < 0) return 0;
  var amount = text.slice(marker + 8).split('.')[0].replace(/,/g, '').trim();
  return Number(amount) || 0;
}

function computeFundingTotals(data) {
  var external = data.filter(function(item) { return item.type === 'External'; }).reduce(function(sum, item) { return sum + extractYenAmount(item); }, 0);
  var internal = data.filter(function(item) { return item.type === 'Internal'; }).reduce(function(sum, item) { return sum + extractYenAmount(item); }, 0);
  var total = external + internal;

  parent.postMessage({
    type: 'fundingTotals',
    source: 'rivers-funding',
    total: total,
    external: external,
    internal: internal
  }, '*');
}

fetch('../data/funding.json?v=20261103-apa7')
  .then(function(response) { return response.json(); })
  .then(function(data) {
    computeFundingTotals(data);
    renderAcademic('app', data, {
      source: 'rivers-funding',
      itemLabel: 'project',
      itemLabelPlural: 'projects',
      searchLabel: 'funding',
      awardInHeader: true,
      fundingLayout: true
    });
  });
</script>
</body>
</html>
