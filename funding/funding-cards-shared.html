<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../academic-cards/academic-cards.css">
<script src="../academic-cards/academic-renderer.js"></script>
</head>
<body>
<div class="rivers-academic-wrap">
  <div id="fundingTotal" class="rivers-funding-total"></div>
</div>
<div id="app" class="rivers-academic-wrap"></div>
<script>
function extractYenAmount(ref) {
  var text = String(ref || '');
  var marker = text.indexOf('Award: ¥');
  if (marker < 0) return 0;
  var amount = text.slice(marker + 8).split('.')[0].replace(/,/g, '').trim();
  return Number(amount) || 0;
}

function formatMillions(value) {
  return '¥' + (value / 1000000).toFixed(1) + ' million';
}

function animateMillions(element, finalValue, duration, delay) {
  var startTime = null;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  element.textContent = formatMillions(0);

  if (reduced) {
    element.textContent = formatMillions(finalValue);
    return;
  }

  function step(timestamp) {
    if (!startTime) startTime = timestamp;
    var progress = Math.min((timestamp - startTime) / duration, 1);
    var eased = progress < 0.5
      ? 4 * progress * progress * progress
      : 1 - Math.pow(-2 * progress + 2, 3) / 2;

    element.textContent = formatMillions(finalValue * eased);

    if (progress < 1) {
      window.requestAnimationFrame(step);
    } else {
      element.textContent = formatMillions(finalValue);
    }
  }

  window.setTimeout(function() {
    window.requestAnimationFrame(step);
  }, delay || 0);
}

function renderFundingTotal(data) {
  var external = data.filter(function(item) { return item.type === 'External'; }).reduce(function(sum, item) { return sum + extractYenAmount(item.ref); }, 0);
  var internal = data.filter(function(item) { return item.type === 'Internal'; }).reduce(function(sum, item) { return sum + extractYenAmount(item.ref); }, 0);
  var total = external + internal;
  var target = document.getElementById('fundingTotal');

  target.innerHTML = 'This research has been supported by approximately <span class="rivers-funding-number" data-value="' + total + '">¥0.0 million</span> in competitive funding (<span class="rivers-funding-number" data-value="' + external + '">¥0.0 million</span> external; <span class="rivers-funding-number" data-value="' + internal + '">¥0.0 million</span> internal), enabling the development of data-driven models and applied research across multiple domains.';

  Array.prototype.forEach.call(target.querySelectorAll('.rivers-funding-number'), function(el, index) {
    animateMillions(el, Number(el.getAttribute('data-value')) || 0, 2200, 450 + index * 180);
  });
}

fetch('../data/funding.json')
  .then(function(response) { return response.json(); })
  .then(function(data) {
    renderAcademic('app', data, {
      source: 'rivers-funding',
      itemLabel: 'project',
      itemLabelPlural: 'projects',
      searchLabel: 'funding',
      awardInHeader: true,
      fundingLayout: true
    });
    renderFundingTotal(data);
  });
</script>
</body>
</html>
