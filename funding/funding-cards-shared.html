<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../academic-cards/academic-cards.css">
<script src="../academic-cards/academic-renderer.js"></script>
</head>
<body>
<div id="app" class="rivers-academic-wrap">
  <div id="fundingTotal" class="rivers-funding-total"></div>
</div>
<script>
function extractYenAmount(ref) {
  var match = String(ref || '').match(/Award:\s*¥([0-9,]+)/i);
  return match ? Number(match[1].replace(/,/g, '')) : 0;
}

function formatMillions(value) {
  return '¥' + (value / 1000000).toFixed(1) + ' million';
}

function animateMillions(element, finalValue, duration) {
  var start = 0;
  var startTime = null;
  var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (prefersReducedMotion) {
    element.textContent = formatMillions(finalValue);
    return;
  }

  function step(timestamp) {
    if (!startTime) startTime = timestamp;
    var progress = Math.min((timestamp - startTime) / duration, 1);
    var eased = 1 - Math.pow(1 - progress, 3);
    var current = start + (finalValue - start) * eased;

    element.textContent = formatMillions(current);

    if (progress < 1) {
      window.requestAnimationFrame(step);
    } else {
      element.textContent = formatMillions(finalValue);
    }
  }

  window.requestAnimationFrame(step);
}

function renderFundingTotal(data) {
  var external = data
    .filter(function(item) { return item.type === 'External'; })
    .reduce(function(sum, item) { return sum + extractYenAmount(item.ref); }, 0);

  var internal = data
    .filter(function(item) { return item.type === 'Internal'; })
    .reduce(function(sum, item) { return sum + extractYenAmount(item.ref); }, 0);

  var total = external + internal;
  var target = document.getElementById('fundingTotal');

  target.innerHTML = 'This research has been supported by approximately <span class="rivers-funding-number" data-value="' + total + '">¥0.0 million</span> in competitive funding (<span class="rivers-funding-number" data-value="' + external + '">¥0.0 million</span> external; <span class="rivers-funding-number" data-value="' + internal + '">¥0.0 million</span> internal), enabling the development of data-driven models and applied research across multiple domains.';

  Array.prototype.forEach.call(target.querySelectorAll('.rivers-funding-number'), function(el, index) {
    var value = Number(el.getAttribute('data-value')) || 0;
    animateMillions(el, value, 900 + index * 120);
  });
}

fetch('../data/funding.json')
  .then(function(response) { return response.json(); })
  .then(function(data) {
    renderFundingTotal(data);
    renderAcademic('app', data, {
      source: 'rivers-funding',
      itemLabel: 'project',
      itemLabelPlural: 'projects',
      searchLabel: 'funding',
      awardInHeader: true,
      fundingLayout: true
    });
  });
</script>
</body>
</html>
