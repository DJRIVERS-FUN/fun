<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../academic-cards/academic-cards.css">
<script src="../academic-cards/academic-renderer.js"></script>
</head>
<body>
<div id="app" class="rivers-academic-wrap">
  <div class="rivers-funding-summary">¥20.8M total (¥16.6M external | ¥4.2M internal)</div>
</div>
<script>
fetch('../data/funding.json')
  .then(r=>r.json())
  .then(data=>renderAcademic('app',data,{
    source:'rivers-funding',
    itemLabel:'project',
    itemLabelPlural:'projects',
    searchLabel:'funding'
  }));
</script>
</body>
</html>
