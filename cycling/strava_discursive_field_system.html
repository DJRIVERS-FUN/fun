<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strava Discursive Field System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1080px;margin:0 auto;padding:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;justify-content:center}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.canvas{height:450px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}.system{display:block;width:100%;height:450px}.node{cursor:pointer}.node ellipse,.node rect,.node circle{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect,.node:hover circle,.node.selected circle{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:12px;font-weight:700}.path{fill:none;stroke:var(--accent);stroke-width:2.35;stroke-linecap:round;stroke-dasharray:7 10;opacity:.50;animation:dash 7s linear infinite}.path.orange{stroke:var(--orange);opacity:.66}.path.grey{stroke:var(--muted);stroke-width:1.4;opacity:.30;stroke-dasharray:4 9}.path.light{stroke-width:1.2;opacity:.16}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.pulse{fill:var(--accent);opacity:.72;animation:pulse 2.8s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.32;animation-delay:1.2s}.glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.86}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.20))}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:12.5px;fill:var(--muted);font-weight:600}.caption{font-family:'DM Mono','Courier New',monospace;font-size:11px;fill:var(--muted)}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:11px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:5px 8px;background:var(--orange)}.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;min-height:150px}.card.soft{background:var(--soft)}.small{font-size:11px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:7px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px;line-height:1.25}.card-text{font-size:14px;line-height:1.42;margin:0;color:var(--text)}.quote{font-size:13.5px;line-height:1.5;border-left:2px solid var(--accent);padding-left:11px;margin:8px 0 0;color:var(--text)}.metric{margin:0 0 9px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin:0 0 5px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;background:#fff;font-family:'DM Mono','Courier New',monospace}@media(max-width:860px){.canvas{height:405px}.system{height:405px}.info-grid{grid-template-columns:1fr}.node text{font-size:11px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap">
<div class="controls"><button id="btn-discourse" class="active" onclick="setMode('discourse')">Discursive field</button><button id="btn-affordance" onclick="setMode('affordance')">Affordances</button><button id="btn-loop" onclick="setMode('loop')">Motivation loop</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1080 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Strava discursive field of practice system">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#520671"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e05c2a"/></marker><marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9a9890"/></marker></defs>
<text class="side-label" x="62" y="50">real-world riding</text><text class="side-label" x="385" y="50">Strava OSFN</text><text class="side-label" x="720" y="50">discursive formations</text>
<path id="p-ride-platform" class="path grey" marker-end="url(#arrowGrey)" d="M210 225 C285 225 330 225 388 225"/>
<path id="p-platform-track" class="path orange" marker-end="url(#arrowOrange)" d="M565 205 C635 132 690 104 758 96"/>
<path id="p-platform-data" class="path" marker-end="url(#arrow)" d="M570 218 C642 190 695 178 758 170"/>
<path id="p-platform-community" class="path" marker-end="url(#arrow)" d="M570 232 C642 258 696 276 758 282"/>
<path id="p-platform-dependency" class="path orange" marker-end="url(#arrowOrange)" d="M565 245 C635 330 690 360 758 360"/>
<path id="p-feedback-ride" class="path light" d="M875 376 C690 430 275 395 130 292"/>
<path id="p-track-data" class="path light" d="M850 118 C885 145 885 168 850 192"/>
<path id="p-data-community" class="path light" d="M850 205 C888 235 888 262 850 286"/>
<path id="p-community-dependency" class="path light" d="M850 305 C880 328 880 348 850 368"/>
<circle class="pulse faint" cx="305" cy="225" r="5"/><circle class="pulse orange" cx="655" cy="132" r="5"/><circle class="pulse" cx="655" cy="202" r="5"/><circle class="pulse" cx="655" cy="270" r="5"/><circle class="pulse orange" cx="655" cy="330" r="5"/>
<g class="node" id="node-ride" onclick="selectNode('ride')"><ellipse cx="122" cy="225" rx="88" ry="58" fill="#fff" stroke="#d9d2dd"/><text x="122" y="215" text-anchor="middle">REAL-WORLD</text><text x="122" y="232" text-anchor="middle">CYCLING</text><text x="122" y="249" text-anchor="middle">ACTIVITY</text></g>
<g class="node selected glow" id="node-platform" onclick="selectNode('platform')"><ellipse cx="480" cy="225" rx="94" ry="72" fill="#fff" stroke="#d9d2dd"/><text x="480" y="206" text-anchor="middle">STRAVA</text><text x="480" y="223" text-anchor="middle">ONLINE SOCIAL</text><text x="480" y="240" text-anchor="middle">FITNESS</text><text x="480" y="257" text-anchor="middle">NETWORK</text></g>
<g class="node" id="node-track" onclick="selectNode('track')"><ellipse cx="850" cy="96" rx="94" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="850" y="92" text-anchor="middle">SELF-TRACKING</text><text x="850" y="109" text-anchor="middle">DISCOURSE</text></g>
<g class="node" id="node-data" onclick="selectNode('data')"><ellipse cx="850" cy="180" rx="94" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="850" y="176" text-anchor="middle">DATA</text><text x="850" y="193" text-anchor="middle">DISCOURSE</text></g>
<g class="node" id="node-community" onclick="selectNode('community')"><ellipse cx="850" cy="282" rx="94" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="850" y="278" text-anchor="middle">COMMUNITY</text><text x="850" y="295" text-anchor="middle">DISCOURSE</text></g>
<g class="node" id="node-dependency" onclick="selectNode('dependency')"><ellipse cx="850" cy="360" rx="94" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="850" y="356" text-anchor="middle">DEPENDENCY</text><text x="850" y="373" text-anchor="middle">DISCOURSE</text></g>
<text class="caption" x="390" y="330">GPS capture + upload + sharing</text><text class="caption" x="740" y="418">motivational affordances circulate back into riding</text>
</svg><div class="legend"><span>click nodes</span><span>orange = motivation</span><span>purple = discourse</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Discursive field</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Strava OSFN</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">Strava</span><span class="tag">affordances</span><span class="tag">cycling motivation</span></div></div></section>
</main>
<script>
const nodeData={ride:{title:'Real-world cycling activity',text:'Cycling begins as embodied, situated activity, but GPS capture and platform upload transform the ride into shareable data and discourse.',quote:'The physical ride becomes a communicative object once it enters the platform.'},platform:{title:'Strava OSFN',text:'Strava operates as an online social fitness network where tracked activities, performance metrics, social comparison and interaction become a discursive field of practice.',quote:'The platform is not only a tool; it is a bounded socio-technical environment for meaning-making.'},track:{title:'Self-tracking discourse',text:'Self-tracking was the dominant motive for registering with Strava: riders track routes, distance, performance, fitness and progress over time.',quote:'Tracking converts cycling into an ongoing reflective account of the self.'},data:{title:'Data discourse',text:'Strava data functions as feedback, challenge, reward and evidence of achievement. Metrics such as segments, time, distance, power and heatmaps become a shared language.',quote:'Data becomes motivational because it is personal, comparable and socially visible.'},community:{title:'Community discourse',text:'Kudos, comments, clubs, followers and comparison with friends transform individual riding into networked participation and social belonging.',quote:'The watching community motivates through support, appraisal and comparison.'},dependency:{title:'Dependency discourse',text:'Some riders described Strava as integral to cycling motivation, with the platform shaping whether a ride feels meaningful, visible or even complete.',quote:'If it is not on Strava, it did not happen becomes a symptom of platform-mediated dependency.'}};
const modeData={discourse:{title:'Discursive field',text:'This view foregrounds the four discursive formations identified in the article: self-tracking, data, community and dependency.',metrics:[['Self-tracking',90],['Data',82],['Community',76],['Dependency',64]],paths:['p-ride-platform','p-platform-track','p-platform-data','p-platform-community','p-platform-dependency']},affordance:{title:'Affordances',text:'This view emphasizes Strava as a motivational affordance system supporting autonomy, achievement, relatedness, feedback and identity representation.',metrics:[['Autonomy / self',80],['Competence / achievement',86],['Relatedness',78],['Affect / emotion',72]],paths:['p-ride-platform','p-platform-track','p-platform-data','p-platform-community','p-track-data','p-data-community']},loop:{title:'Motivation loop',text:'This view highlights the recursive loop: cycling creates data, data creates feedback and social comparison, and feedback reshapes future cycling behavior.',metrics:[['Feedback intensity',88],['Social comparison',82],['Behavioral regulation',80],['Platform dependence',66]],paths:['p-ride-platform','p-platform-data','p-platform-community','p-platform-dependency','p-feedback-ride','p-track-data','p-data-community','p-community-dependency']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
setMode('discourse');selectNode('platform');function sendHeight(){window.parent.postMessage({type:'resize',source:'rivers-strava-discursive-system',height:document.documentElement.scrollHeight},'*')}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);setInterval(sendHeight,1200);
</script>
</body></html>
