<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strava Discursive Field System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden;width:100%}.wrap{width:100%;max-width:none;margin:0;padding:0}.controls{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;justify-content:center}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 11px;border-radius:8px;font-size:12px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.canvas{height:535px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:8px}.system{display:block;width:100%;height:535px}.node{cursor:pointer}.node ellipse,.node rect,.node circle{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect,.node:hover circle,.node.selected circle{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:13px;font-weight:700}.path{fill:none;stroke:var(--accent);stroke-width:2.35;stroke-linecap:round;stroke-dasharray:8 12;opacity:.50;animation:dash 8s linear infinite}.path.orange{stroke:var(--orange);opacity:.66}.path.grey{stroke:var(--muted);stroke-width:1.45;opacity:.30;stroke-dasharray:5 10}.path.light{stroke-width:1.25;opacity:.16}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.pulse{fill:var(--accent);opacity:.72;animation:pulse 3s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.32;animation-delay:1.2s}.glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.86}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.20))}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:14px;fill:#d97706;font-weight:600;letter-spacing:.045em}.layer-rule{stroke:#eee9e5;stroke-width:1}.caption{font-family:'DM Mono','Courier New',monospace;font-size:12px;fill:var(--muted)}.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:10px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:4px 7px;background:var(--orange)}.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;min-height:auto}.card.soft{background:var(--soft)}.small{font-size:10px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:13px;font-weight:700;color:var(--accent);margin:0 0 5px;line-height:1.2}.card-text{font-size:13px;line-height:1.36;margin:0;color:var(--text)}.quote{font-size:12px;line-height:1.38;border-left:2px solid var(--accent);padding-left:9px;margin:6px 0 0;color:var(--text)}.metric{margin:0 0 6px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;margin:0 0 4px;font-family:'DM Mono','Courier New',monospace}.bar{height:5px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 6px;background:#fff;font-family:'DM Mono','Courier New',monospace}@media(max-width:860px){.canvas{height:455px}.system{height:455px}.info-grid{grid-template-columns:1fr}.node text{font-size:12px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap" id="wrap">
<div class="controls"><button id="btn-discourse" class="active" onclick="setMode('discourse')">Discursive field</button><button id="btn-affordance" onclick="setMode('affordance')">Affordances</button><button id="btn-loop" onclick="setMode('loop')">Motivation loop</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1440 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Strava discursive field of practice system">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#520671"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e05c2a"/></marker><marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9a9890"/></marker></defs>
<text class="side-label" x="80" y="38">REAL-WORLD RIDING</text><line class="layer-rule" x1="80" y1="52" x2="330" y2="52"/><text class="side-label" x="535" y="38">STRAVA OSFN</text><line class="layer-rule" x1="535" y1="52" x2="755" y2="52"/><text class="side-label" x="1010" y="38">DISCURSIVE FORMATIONS</text><line class="layer-rule" x1="1010" y1="52" x2="1340" y2="52"/>
<path id="p-ride-platform" class="path grey" marker-end="url(#arrowGrey)" d="M255 280 C375 280 455 280 548 280"/>
<path id="p-platform-track" class="path orange" marker-end="url(#arrowOrange)" d="M820 250 C910 128 995 98 1080 92"/>
<path id="p-platform-data" class="path" marker-end="url(#arrow)" d="M825 266 C916 206 998 180 1080 178"/>
<path id="p-platform-community" class="path" marker-end="url(#arrow)" d="M825 292 C916 318 998 330 1080 332"/>
<path id="p-platform-dependency" class="path orange" marker-end="url(#arrowOrange)" d="M815 315 C904 420 994 455 1080 456"/>
<path id="p-feedback-ride" class="path light" d="M1210 488 C880 540 345 502 150 366"/>
<path id="p-track-data" class="path light" d="M1220 124 C1270 150 1270 168 1220 206"/>
<path id="p-data-community" class="path light" d="M1220 212 C1272 260 1272 302 1220 330"/>
<path id="p-community-dependency" class="path light" d="M1220 358 C1265 388 1265 424 1220 456"/>
<circle class="pulse faint" cx="390" cy="280" r="5"/><circle class="pulse orange" cx="940" cy="128" r="5"/><circle class="pulse" cx="940" cy="215" r="5"/><circle class="pulse" cx="940" cy="315" r="5"/><circle class="pulse orange" cx="940" cy="420" r="5"/>
<g class="node" id="node-ride" onclick="selectNode('ride')"><ellipse cx="145" cy="280" rx="112" ry="72" fill="#fff" stroke="#d9d2dd"/><text x="145" y="264" text-anchor="middle">REAL-WORLD</text><text x="145" y="282" text-anchor="middle">CYCLING</text><text x="145" y="300" text-anchor="middle">ACTIVITY</text></g>
<g class="node selected glow" id="node-platform" onclick="selectNode('platform')"><ellipse cx="680" cy="280" rx="142" ry="86" fill="#fff" stroke="#d9d2dd"/><text x="680" y="250" text-anchor="middle">STRAVA</text><text x="680" y="268" text-anchor="middle">ONLINE SOCIAL</text><text x="680" y="286" text-anchor="middle">FITNESS</text><text x="680" y="304" text-anchor="middle">NETWORK</text><text x="680" y="322" text-anchor="middle">OSFN</text></g>
<g class="node" id="node-track" onclick="selectNode('track')"><ellipse cx="1220" cy="92" rx="140" ry="48" fill="#fff" stroke="#d9d2dd"/><text x="1220" y="88" text-anchor="middle">SELF-TRACKING</text><text x="1220" y="106" text-anchor="middle">DISCOURSE</text></g>
<g class="node" id="node-data" onclick="selectNode('data')"><ellipse cx="1220" cy="190" rx="140" ry="48" fill="#fff" stroke="#d9d2dd"/><text x="1220" y="186" text-anchor="middle">DATA</text><text x="1220" y="204" text-anchor="middle">DISCOURSE</text></g>
<g class="node" id="node-community" onclick="selectNode('community')"><ellipse cx="1220" cy="332" rx="140" ry="48" fill="#fff" stroke="#d9d2dd"/><text x="1220" y="328" text-anchor="middle">COMMUNITY</text><text x="1220" y="346" text-anchor="middle">DISCOURSE</text></g>
<g class="node" id="node-dependency" onclick="selectNode('dependency')"><ellipse cx="1220" cy="456" rx="140" ry="48" fill="#fff" stroke="#d9d2dd"/><text x="1220" y="452" text-anchor="middle">DEPENDENCY</text><text x="1220" y="470" text-anchor="middle">DISCOURSE</text></g>
<text class="caption" x="535" y="405">GPS capture + upload + sharing</text><text class="caption" x="1005" y="522">motivational affordances circulate back into riding</text>
</svg><div class="legend"><span>click nodes</span><span>orange = motivation</span><span>purple = discourse</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Discursive field</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Strava OSFN</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">Strava</span><span class="tag">affordances</span><span class="tag">cycling motivation</span></div></div></section>
</main>
<script>
const nodeData={ride:{title:'Real-world cycling activity',text:'Cycling begins as embodied, situated activity, but GPS capture and platform upload transform the ride into shareable data and discourse.',quote:'The physical ride becomes a communicative object once it enters the platform.'},platform:{title:'Strava OSFN',text:'Strava operates as an online social fitness network where tracked activities, performance metrics, social comparison and interaction become a discursive field of practice.',quote:'The platform is not only a tool; it is a bounded socio-technical environment for meaning-making.'},track:{title:'Self-tracking discourse',text:'Self-tracking was the dominant motive for registering with Strava: riders track routes, distance, performance, fitness and progress over time.',quote:'Tracking converts cycling into an ongoing reflective account of the self.'},data:{title:'Data discourse',text:'Strava data functions as feedback, challenge, reward and evidence of achievement. Metrics such as segments, time, distance, power and heatmaps become a shared language.',quote:'Data becomes motivational because it is personal, comparable and socially visible.'},community:{title:'Community discourse',text:'Kudos, comments, clubs, followers and comparison with friends transform individual riding into networked participation and social belonging.',quote:'The watching community motivates through support, appraisal and comparison.'},dependency:{title:'Dependency discourse',text:'Some riders described Strava as integral to cycling motivation, with the platform shaping whether a ride feels meaningful, visible or even complete.',quote:'If it is not on Strava, it did not happen becomes a symptom of platform-mediated dependency.'}};
const modeData={discourse:{title:'Discursive field',text:'This view foregrounds the four discursive formations identified in the article: self-tracking, data, community and dependency.',metrics:[['Self-tracking',90],['Data',82],['Community',76],['Dependency',64]],paths:['p-ride-platform','p-platform-track','p-platform-data','p-platform-community','p-platform-dependency']},affordance:{title:'Affordances',text:'This view emphasizes Strava as a motivational affordance system supporting autonomy, achievement, relatedness, feedback and identity representation.',metrics:[['Autonomy / self',80],['Competence / achievement',86],['Relatedness',78],['Affect / emotion',72]],paths:['p-ride-platform','p-platform-track','p-platform-data','p-platform-community','p-track-data','p-data-community']},loop:{title:'Motivation loop',text:'This view highlights the recursive loop: cycling creates data, data creates feedback and social comparison, and feedback reshapes future cycling behavior.',metrics:[['Feedback intensity',88],['Social comparison',82],['Behavioral regulation',80],['Platform dependence',66]],paths:['p-ride-platform','p-platform-data','p-platform-community','p-platform-dependency','p-feedback-ride','p-track-data','p-data-community','p-community-dependency']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
function sendHeight(){const wrap=document.getElementById('wrap');if(!wrap||!window.parent)return;window.parent.postMessage({type:'resize',source:'rivers-strava-discursive-system',height:Math.ceil(wrap.getBoundingClientRect().height)+2},'*')}
function queueHeight(){requestAnimationFrame(()=>requestAnimationFrame(sendHeight))}
setMode('discourse');selectNode('platform');window.addEventListener('load',queueHeight);window.addEventListener('resize',queueHeight);if('ResizeObserver'in window){new ResizeObserver(queueHeight).observe(document.getElementById('wrap'))}queueHeight();
</script>
</body></html>
