<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<title>Rivers Lab Research Framework / 研究フレームワーク</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;width:100%;
  background:#fff;overflow:hidden;
  font-family:'Roboto','Noto Sans JP',Arial,sans-serif;
}
.wrap{
  width:100%;height:500px;margin:0;
  position:relative;background:#fff;padding:6px 0;
}
canvas{width:100%;height:100%;display:block}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
@media(max-width:900px){.wrap{height:500px}}
@media(max-width:640px){.wrap{height:500px}}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="pulse" role="img"
    aria-label="Rivers Lab research framework showing three research domains linked through constraint, interpretation, action and evaluation."></canvas>
  <div class="sr-only">
    Rivers Lab research framework / Rivers Lab研究フレームワーク.
    Learning and Metacognition / 学習とメタ認知.
    Digital Discourse and Platform Culture / デジタル談話とプラットフォーム文化.
    Human–Technology Interaction / 人間–テクノロジー相互作用.
    Constraint / 制約. Interpretation / 解釈. Action / 行動. Evaluation / 評価.
  </div>
</div>

<script>
const canvas=document.getElementById("pulse");
const ctx=canvas.getContext("2d");
let W,H;

const palette={
  purple:"#520671",
  orange:"#d97706"
};

function resize(){
  const r=canvas.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=canvas.width=Math.round(r.width*dpr);
  H=canvas.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener("resize",resize);

const nodes=[
  {type:"domain",en:"Learning &\nMetacognition",ja:"学習とメタ認知",
   x:.50,y:.20,r:.092,fill:"#fff",stroke:"#520671",text:"#520671",halo:"#520671"},
  {type:"domain",en:"Digital Discourse &\nPlatform Culture",ja:"デジタル談話と\nプラットフォーム文化",
   x:.18,y:.67,r:.092,fill:"#fff",stroke:"#520671",text:"#520671",halo:"#520671"},
  {type:"domain",en:"Human–Technology\nInteraction",ja:"人間–テクノロジー\n相互作用",
   x:.82,y:.67,r:.092,fill:"#fff",stroke:"#520671",text:"#520671",halo:"#520671"},

  {type:"concept",en:"Constraint",ja:"制約",
   x:.29,y:.39,r:.054,fill:"#fff7ed",stroke:"#d97706",text:"#8a4b08",halo:"#d97706"},
  {type:"concept",en:"Interpretation",ja:"解釈",
   x:.43,y:.57,r:.054,fill:"#fff7ed",stroke:"#d97706",text:"#8a4b08",halo:"#d97706"},
  {type:"concept",en:"Action",ja:"行動",
   x:.57,y:.57,r:.054,fill:"#fff7ed",stroke:"#d97706",text:"#8a4b08",halo:"#d97706"},
  {type:"concept",en:"Evaluation",ja:"評価",
   x:.71,y:.39,r:.054,fill:"#fff7ed",stroke:"#d97706",text:"#8a4b08",halo:"#d97706"}
];

const flowLinks=[[3,4],[4,5],[5,6]];
const domainLinks=[
  [0,3],[0,4],[0,5],[0,6],
  [1,3],[1,4],[1,5],[1,6],
  [2,3],[2,4],[2,5],[2,6]
];

let t=0;

function rgba(hex,a){
  const h=hex.replace("#","");
  return `rgba(${parseInt(h.substr(0,2),16)},${parseInt(h.substr(2,2),16)},${parseInt(h.substr(4,2),16)},${a})`;
}

function nodeRadius(n,w,h){
  const base=Math.min(w,h);
  return Math.max(
    n.type==="domain"?82:50,
    Math.min(n.type==="domain"?112:68,base*n.r)
  );
}

function fontSizes(n,w,h){
  const base=Math.min(w,h);
  return n.type==="domain"
    ? {en:Math.max(12.5,Math.min(15.5,base*.028)),ja:Math.max(11.2,Math.min(13,base*.024))}
    : {en:Math.max(10.5,Math.min(12.5,base*.023)),ja:Math.max(10.3,Math.min(11.3,base*.021))};
}

function drawBilingualText(n,w,h){
  const fs=fontSizes(n,w,h);
  const enLines=n.en.split("\n");
  const jaLines=n.ja.split("\n");
  const enLine=fs.en*1.18;
  const jaLine=fs.ja*1.25;
  const gap=n.type==="domain"?6:4;
  const total=enLines.length*enLine+gap+jaLines.length*jaLine;

  let y=n.py-total/2+enLine/2;
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle=n.text;

  ctx.font=n.type==="domain"
    ? `500 ${fs.en}px Roboto,Arial,sans-serif`
    : `500 ${fs.en}px "DM Mono",monospace`;

  enLines.forEach(line=>{
    ctx.fillText(line,n.px,y,n.r*1.66);
    y+=enLine;
  });

  y+=gap;

  ctx.font=`500 ${fs.ja}px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif`;
  jaLines.forEach(line=>{
    ctx.fillText(line,n.px,y,n.r*1.68);
    y+=jaLine;
  });
}

function drawArrow(A,B,col,a,w,p){
  const ang=Math.atan2(B.py-A.py,B.px-A.px);
  const sx=A.px+Math.cos(ang)*(A.r+6);
  const sy=A.py+Math.sin(ang)*(A.r+6);
  const ex=B.px-Math.cos(ang)*(B.r+10);
  const ey=B.py-Math.sin(ang)*(B.r+10);

  ctx.strokeStyle=rgba(col,a);
  ctx.lineWidth=w;
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(ex,ey);
  ctx.stroke();

  const pulse=(Math.sin(t*.04+p)+1)/2;
  const px=sx+(ex-sx)*pulse;
  const py=sy+(ey-sy)*pulse;

  ctx.fillStyle=rgba(col,a+.22);
  ctx.beginPath();
  ctx.arc(px,py,3.2,0,Math.PI*2);
  ctx.fill();
}

function drawSoft(A,B,a,p){
  const linkPulse=(Math.sin(t*.03+p)+1)/2;
  ctx.strokeStyle=rgba(palette.purple,a+linkPulse*.03);
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(A.px,A.py);
  ctx.lineTo(B.px,B.py);
  ctx.stroke();

  const travel=(t*.006+p*.13)%1;
  const px=A.px+(B.px-A.px)*travel;
  const py=A.py+(B.py-A.py)*travel;
  const glow=(Math.sin(t*.05+p)+1)/2;

  ctx.fillStyle=rgba(palette.purple,.09+glow*.07);
  ctx.beginPath();
  ctx.arc(px,py,5.2,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle=rgba(palette.orange,.24+glow*.14);
  ctx.beginPath();
  ctx.arc(px,py,2.3,0,Math.PI*2);
  ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,W,H);

  const w=canvas.clientWidth;
  const h=canvas.clientHeight;

  const mapped=nodes.map(n=>({
    ...n,
    r:nodeRadius(n,w,h),
    px:n.x*w+Math.sin(t*.006+n.x*10)*(n.type==="domain"?6:4),
    py:n.y*h+Math.cos(t*.008+n.y*10)*(n.type==="domain"?6:4)
  }));

  domainLinks.forEach(([a,b],i)=>drawSoft(mapped[a],mapped[b],.065,i));
  flowLinks.forEach(([a,b],i)=>drawArrow(mapped[a],mapped[b],palette.orange,.48,2.1,i));

  mapped.forEach((n,i)=>{
    const g=(Math.sin(t*.026+i)+1)/2;

    ctx.fillStyle=rgba(
      n.halo,
      n.type==="domain"?.03+g*.025:.028+g*.025
    );
    ctx.beginPath();
    ctx.arc(
      n.px,n.py,
      n.r+(n.type==="domain"?15:11)+g*5,
      0,Math.PI*2
    );
    ctx.fill();

    ctx.fillStyle=n.fill;
    ctx.strokeStyle=n.stroke;
    ctx.lineWidth=n.type==="domain"?2.1:1.8;
    ctx.beginPath();
    ctx.arc(n.px,n.py,n.r,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    drawBilingualText(n,w,h);
  });

  t++;
  requestAnimationFrame(draw);
}

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(draw);
}else{
  draw();
}
</script>
</body>
</html>
