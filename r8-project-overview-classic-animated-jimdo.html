<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{
    margin:0;
    background:#fff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}
svg{
    width:100%;
    height:580px;
    display:block;
}
.box{
    fill:white;
    stroke:#222;
    stroke-width:2;
}
.label{
    font-size:16px;
    font-weight:bold;
    text-anchor:middle;
}
.small{
    font-size:12px;
    fill:#666;
    text-anchor:middle;
}
.rq{
    fill:#f3f4f6;
    stroke:#999;
}
</style>
</head>

<body>

<svg viewBox="0 0 1200 620">

<defs>

<marker
    id="arrow"
    markerWidth="10"
    markerHeight="10"
    refX="8"
    refY="3"
    orient="auto">

    <path d="M0,0 L0,6 L9,3 z" fill="#777"/>
</marker>

</defs>

<!-- TOP ROW -->

<rect class="box" x="40" y="40" width="180" height="90" rx="16"/>
<text class="label" x="130" y="80">Rider + Bicycle</text>
<text class="small" x="130" y="105">Human–Machine System</text>

<rect class="box" x="300" y="40" width="180" height="90" rx="16"/>
<text class="label" x="390" y="80">GPS Segments</text>
<text class="small" x="390" y="105">Ecological Field Course</text>

<rect class="box" x="560" y="40" width="180" height="90" rx="16"/>
<text class="label" x="650" y="80">Telemetry</text>
<text class="small" x="650" y="105">Power • GPS • HR</text>

<rect class="box" x="820" y="40" width="180" height="90" rx="16"/>
<text class="label" x="910" y="80">Shift Events</text>
<text class="small" x="910" y="105">Di2 / AXS</text>

<!-- CONNECTORS -->

<line
    x1="220"
    y1="85"
    x2="300"
    y2="85"
    stroke="#777"
    stroke-width="3"
    marker-end="url(#arrow)"/>

<line
    x1="480"
    y1="85"
    x2="560"
    y2="85"
    stroke="#777"
    stroke-width="3"
    marker-end="url(#arrow)"/>

<line
    x1="740"
    y1="85"
    x2="820"
    y2="85"
    stroke="#777"
    stroke-width="3"
    marker-end="url(#arrow)"/>

<!-- DATABASE -->

<rect class="box" x="430" y="220" width="340" height="110" rx="16"/>

<text class="label" x="600" y="270">
Integrated Ride Database
</text>

<text class="small" x="600" y="295">
Strava API + FIT + GPX + Di2Stats
</text>

<line
    x1="650"
    y1="130"
    x2="650"
    y2="220"
    stroke="#777"
    stroke-width="3"
    marker-end="url(#arrow)"/>

<line
    x1="910"
    y1="130"
    x2="700"
    y2="220"
    stroke="#777"
    stroke-width="3"
    marker-end="url(#arrow)"/>

<!-- MODELLING -->

<rect class="box" x="430" y="390" width="340" height="110" rx="16"/>

<text class="label" x="600" y="440">
Behavioural Modelling Engine
</text>

<text class="small" x="600" y="465">
Feature Extraction • Classification • Modelling
</text>

<line
    x1="600"
    y1="330"
    x2="600"
    y2="390"
    stroke="#777"
    stroke-width="3"
    marker-end="url(#arrow)"/>

<!-- OUTPUTS -->

<rect class="rq" x="40" y="540" width="250" height="50" rx="12"/>
<text class="label" x="165" y="572">
Cadence Regulation
</text>

<rect class="rq" x="320" y="540" width="250" height="50" rx="12"/>
<text class="label" x="445" y="572">
Shift Behaviour
</text>

<rect class="rq" x="600" y="540" width="250" height="50" rx="12"/>
<text class="label" x="725" y="572">
Gearing &amp; Effort
</text>

<rect class="rq" x="880" y="540" width="250" height="50" rx="12"/>
<text class="label" x="1005" y="572">
Behavioural Models
</text>

</svg>

</body>
</html>
