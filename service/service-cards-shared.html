<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../academic-cards/academic-cards.css">
<script src="../academic-cards/academic-renderer.js?v=20261030-service"></script>
<style>
html,body{width:100%;margin:0;padding:0;background:#ffffff;overflow:hidden}
body{color:#333333}
#app.rivers-academic-wrap{width:100%;max-width:none;margin:0;padding:0}
#app .rivers-academic-ref{max-width:none}
#app .rivers-academic-card{border-radius:10px}
#app .rivers-academic-count,
#app .rivers-academic-label,
#app .rivers-academic-search,
#app .rivers-academic-ref,
#app .rivers-academic-button:not(.active):not(:hover){color:#333333}
#app .rivers-academic-search::placeholder{color:#333333}
</style>
</head>
<body>
<div id="app" class="rivers-academic-wrap"></div>
<script>
fetch('../data/service.json?v=20261030', { cache: 'no-cache' })
  .then(function(response) { return response.json(); })
  .then(function(data) {
    renderAcademic('app', data, {
      source: 'rivers-service',
      itemLabel: 'service entry',
      itemLabelPlural: 'service entries',
      searchLabel: 'service',
      serviceLayout: true
    });
  });
</script>
</body>
</html>
