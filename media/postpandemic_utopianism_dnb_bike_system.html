<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post-pandemic Utopianism DnB Bike System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden;width:100%}
.wrap{width:100%;max-width:none;margin:0;padding:0}.controls{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;justify-content:center}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 11px;border-radius:8px;font-size:12px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}
.canvas{height:535px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:8px}.system{display:block;width:100%;height:535px}
.node{cursor:pointer}.node ellipse,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.05))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:13px;font-weight:700;letter-spacing:.01em}
.layer-label,.caption,.legend{font-family:'DM Mono','Courier New',monospace}.layer-label{font-size:14px;fill:#d97706;letter-spacing:.055em}.layer-rule{stroke:#eee9e5;stroke-width:1}.path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:8 12;opacity:.52;animation:dash 9s linear infinite}.path.orange{stroke:var(--orange);opacity:.68}.path.grey{stroke:#9a9890;stroke-width:1.5;opacity:.28;stroke-dasharray:5 10;animation:dash 11s linear infinite}.path.light{stroke:#d8d2dc;stroke-width:1.25;opacity:.18}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.pulse{fill:var(--accent);opacity:.70;animation:pulse 3.2s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.30;animation-delay:1.2s}.glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.84}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.18))}}
.caption{font-size:12px;fill:var(--muted);font-weight:600}.label-bg{fill:#fff;stroke:#eee9e5;stroke-width:1;rx:8;ry:8;opacity:.94}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:4px 7px;background:var(--orange)}
.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;min-height:auto}.card.soft{background:var(--soft)}.small{font-size:10px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:13px;font-weight:700;color:var(--accent);margin:0 0 5px;line-height:1.2}.card-text{font-size:13px;line-height:1.36;margin:0;color:var(--text)}.quote{font-size:12px;line-height:1.38;border-left:2px solid var(--accent);padding-left:9px;margin:6px 0 0;color:var(--text)}.metric{margin:0 0 6px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;margin:0 0 4px;font-family:'DM Mono','Courier New',monospace}.bar{height:5px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 6px;background:#fff;font-family:'DM Mono','Courier New',monospace}
@media(max-width:860px){.canvas{height:455px}.system{height:455px}.info-grid{grid-template-columns:1fr}.node text{font-size:12px}.controls{justify-content:flex-start}}
@media(max-width:560px){.canvas{height:410px}.system{height:410px}.controls button{font-size:11px;padding:7px 9px}.node text{font-size:11px}}
</style>
</head>
<body>
<main class="wrap" id="wrap">
<div class="controls"><button id="btn-gestalts" class="active" onclick="setMode('gestalts')">Three gestalts</button><button id="btn-urban" onclick="setMode('urban')">Urban space</button><button id="btn-community" onclick="setMode('community')">Collective vibe</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1440 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Drum and bass on the bike post-pandemic utopianism system">
<text class="layer-label" x="80" y="38">POST-LOCKDOWN CONDITION</text><line class="layer-rule" x1="80" y1="52" x2="385" y2="52"/>
<text class="layer-label" x="520" y="38">MOVING SOUND SYSTEM</text><line class="layer-rule" x1="520" y1="52" x2="825" y2="52"/>
<text class="layer-label" x="970" y="38">POST-PANDEMIC SOCIAL DREAMING</text><line class="layer-rule" x1="970" y1="52" x2="1370" y2="52"/>

<path id="p-damage-core" class="path grey" d="M288 280 C382 280 455 280 535 280"/>
<path id="p-core-driver" class="path orange" d="M795 255 C885 172 955 130 1038 120"/>
<path id="p-core-space" class="path" d="M805 280 C890 280 958 280 1038 280"/>
<path id="p-core-diversity" class="path" d="M795 305 C885 388 955 425 1038 430"/>
<path id="p-utopia-loop" class="path light" d="M1185 488 C900 548 420 510 160 355"/>

<circle class="pulse faint" cx="398" cy="280" r="5"/><circle class="pulse orange" cx="900" cy="175" r="5"/><circle class="pulse" cx="912" cy="280" r="5"/><circle class="pulse" cx="900" cy="385" r="5"/>

<g><rect class="label-bg" x="405" y="258" width="96" height="25"/><text class="caption" x="416" y="276">repair</text></g>
<g><rect class="label-bg" x="865" y="150" width="112" height="25"/><text class="caption" x="876" y="168">horn as call</text></g>
<g><rect class="label-bg" x="880" y="258" width="100" height="25"/><text class="caption" x="891" y="276">road claim</text></g>
<g><rect class="label-bg" x="852" y="390" width="122" height="25"/><text class="caption" x="863" y="408">plural cycling</text></g>

<g class="node" id="node-damage" onclick="selectNode('damage')"><ellipse cx="150" cy="280" rx="138" ry="70" fill="#fff" stroke="#d9d2dd"/><text x="150" y="261" text-anchor="middle">PANDEMIC</text><text x="150" y="279" text-anchor="middle">DAMAGE</text><text x="150" y="297" text-anchor="middle">ISOLATION</text></g>
<g class="node selected glow" id="node-core" onclick="selectNode('core')"><ellipse cx="670" cy="280" rx="142" ry="82" fill="#fff" stroke="#d9d2dd"/><text x="670" y="252" text-anchor="middle">DRUM &amp; BASS</text><text x="670" y="270" text-anchor="middle">ON THE BIKE</text><text x="670" y="288" text-anchor="middle">SOUND + RIDE</text><text x="670" y="306" text-anchor="middle">+ LIVESTREAM</text></g>
<g class="node" id="node-driver" onclick="selectNode('driver')"><ellipse cx="1180" cy="120" rx="142" ry="56" fill="#fff" stroke="#d9d2dd"/><text x="1180" y="111" text-anchor="middle">DRIVER-CYCLIST</text><text x="1180" y="129" text-anchor="middle">RELATIONS</text></g>
<g class="node" id="node-space" onclick="selectNode('space')"><ellipse cx="1180" cy="280" rx="142" ry="56" fill="#fff" stroke="#d9d2dd"/><text x="1180" y="271" text-anchor="middle">URBAN ROAD</text><text x="1180" y="289" text-anchor="middle">SPACE</text></g>
<g class="node" id="node-diversity" onclick="selectNode('diversity')"><ellipse cx="1180" cy="430" rx="142" ry="56" fill="#fff" stroke="#d9d2dd"/><text x="1180" y="421" text-anchor="middle">DIVERSITY IN</text><text x="1180" y="439" text-anchor="middle">CYCLING</text></g>
<text class="caption" x="548" y="390">Dom Whiting as harmonic navigator</text><text class="caption" x="1060" y="510">three multimodal gestalts</text>
</svg><div class="legend"><span>click nodes</span><span>orange = sonic energy</span><span>purple = social reformation</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Three gestalts</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Drum &amp; bass on the bike</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">multimodality</span><span class="tag">urban cycling</span><span class="tag">utopianism</span></div></div></section>
</main>
<script>
const nodeData={damage:{title:'Pandemic damage and isolation',text:'The system begins from lockdown damage: curtailed mobility, social fragmentation and the loss of face-to-face collective life.',quote:'The rides respond to a damaged social environment through sound, movement and shared outdoor presence.'},core:{title:'Drum & bass on the bike',text:'The central event combines Dom Whiting as DJ/cyclist, drum and bass music, moving urban cycling and livestreamed social participation.',quote:'A moving sound system turns the city into a temporary space of collective repair and social dreaming.'},driver:{title:'Driver-cyclist relations',text:'The horn is re-signified from aggression into participation. Drivers are invited into the event and rewarded as members of the “horning crew”.',quote:'A common symbol of road conflict becomes an emblem of inclusion.'},space:{title:'Urban road space',text:'Riders occupy and reconfigure urban road space, transforming streets into a collective soundscape, procession and temporary dancefloor.',quote:'Critical mass riding becomes a performative claim to the city.'},diversity:{title:'Diversity in cycling',text:'The rides display varied riders, vehicles, bodies, ages, fashions and participation styles, challenging narrow images of organized cycling.',quote:'The cycling event becomes non-judgmental, inclusive and visibly plural.'}};
const modeData={gestalts:{title:'Three gestalts',text:'This view foregrounds the three multimodal gestalts extracted in the article: driver-cyclist reform, road-space reform and diversity reform.',metrics:[['Driver-cyclist reform',86],['Road-space reform',90],['Diversity reform',82],['Utopian appeal',88]],paths:['p-damage-core','p-core-driver','p-core-space','p-core-diversity']},urban:{title:'Urban space',text:'This view emphasizes cycling as outdoor dynamic freedom and the road as a contested urban space reformed through critical mass and sound.',metrics:[['Cycling mobility',88],['Road occupation',86],['Mobile dancefloor',78],['Critical mass energy',84]],paths:['p-damage-core','p-core-space','p-utopia-loop']},community:{title:'Collective vibe',text:'This view highlights the social formation of the ride through drum and bass, shout-outs, slogans, horn interactions and networked participation.',metrics:[['Shared vibe',92],['Social media circulation',80],['Shout-out community',76],['Collective solidarity',88]],paths:['p-damage-core','p-core-driver','p-core-diversity','p-utopia-loop']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
function sendHeight(){var wrap=document.getElementById('wrap');if(!wrap||!window.parent){return}var h=Math.ceil(wrap.getBoundingClientRect().height)+2;window.parent.postMessage({type:'resize',source:'rivers-dnb-bike-utopianism-system',height:h},'*')}
function queueHeight(){requestAnimationFrame(function(){requestAnimationFrame(sendHeight)})}
setMode('gestalts');selectNode('core');window.addEventListener('load',queueHeight);window.addEventListener('resize',queueHeight);if('ResizeObserver' in window){new ResizeObserver(queueHeight).observe(document.getElementById('wrap'))}queueHeight();
</script>
</body></html>
