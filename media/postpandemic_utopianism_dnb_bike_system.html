<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post-pandemic Utopianism DnB Bike System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1080px;margin:0 auto;padding:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;justify-content:center}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.canvas{height:430px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}.system{display:block;width:100%;height:430px}.node{cursor:pointer}.node ellipse,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:12px;font-weight:700}.path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:8 11;opacity:.52;animation:dash 7s linear infinite}.path.orange{stroke:var(--orange);opacity:.68}.path.grey{stroke:var(--muted);stroke-width:1.5;opacity:.25;stroke-dasharray:4 10}.path.light{stroke-width:1.2;opacity:.16}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.pulse{fill:var(--accent);opacity:.72;animation:pulse 2.8s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.32;animation-delay:1.2s}.glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.86}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.20))}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:12.5px;fill:var(--muted);font-weight:600}.caption{font-family:'DM Mono','Courier New',monospace;font-size:11px;fill:var(--muted)}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:11px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:5px 8px;background:var(--orange)}.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;min-height:150px}.card.soft{background:var(--soft)}.small{font-size:11px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:7px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px;line-height:1.25}.card-text{font-size:14px;line-height:1.42;margin:0;color:var(--text)}.quote{font-size:13.5px;line-height:1.5;border-left:2px solid var(--accent);padding-left:11px;margin:8px 0 0;color:var(--text)}.metric{margin:0 0 9px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin:0 0 5px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;background:#fff;font-family:'DM Mono','Courier New',monospace}@media(max-width:860px){.canvas{height:390px}.system{height:390px}.info-grid{grid-template-columns:1fr}.node text{font-size:11px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap">
<div class="controls"><button id="btn-gestalts" class="active" onclick="setMode('gestalts')">Three gestalts</button><button id="btn-urban" onclick="setMode('urban')">Urban space</button><button id="btn-community" onclick="setMode('community')">Collective vibe</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1080 430" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Drum and bass on the bike post-pandemic utopianism system">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#520671"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e05c2a"/></marker><marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9a9890"/></marker></defs>
<text class="side-label" x="70" y="50">post-lockdown condition</text><text class="side-label" x="405" y="50">moving sound system</text><text class="side-label" x="735" y="50">post-pandemic social dreaming</text>
<path id="p-damage-core" class="path grey" marker-end="url(#arrowGrey)" d="M220 215 C292 215 330 215 390 215"/>
<path id="p-core-driver" class="path orange" marker-end="url(#arrowOrange)" d="M570 200 C640 150 690 125 760 118"/>
<path id="p-core-space" class="path" marker-end="url(#arrow)" d="M575 215 C650 215 696 215 760 215"/>
<path id="p-core-diversity" class="path" marker-end="url(#arrow)" d="M570 230 C640 280 690 305 760 312"/>
<path id="p-utopia-loop" class="path light" d="M875 338 C705 402 310 390 145 280"/>
<circle class="pulse faint" cx="300" cy="215" r="5"/><circle class="pulse orange" cx="655" cy="152" r="5"/><circle class="pulse" cx="660" cy="215" r="5"/><circle class="pulse" cx="655" cy="278" r="5"/>
<g class="node" id="node-damage" onclick="selectNode('damage')"><ellipse cx="130" cy="215" rx="90" ry="60" fill="#fff" stroke="#d9d2dd"/><text x="130" y="205" text-anchor="middle">PANDEMIC</text><text x="130" y="222" text-anchor="middle">DAMAGE</text><text x="130" y="239" text-anchor="middle">ISOLATION</text></g>
<g class="node selected glow" id="node-core" onclick="selectNode('core')"><ellipse cx="480" cy="215" rx="95" ry="72" fill="#fff" stroke="#d9d2dd"/><text x="480" y="196" text-anchor="middle">DRUM &amp; BASS</text><text x="480" y="213" text-anchor="middle">ON THE BIKE</text><text x="480" y="230" text-anchor="middle">SOUND + RIDE</text><text x="480" y="247" text-anchor="middle">+ LIVESTREAM</text></g>
<g class="node" id="node-driver" onclick="selectNode('driver')"><ellipse cx="850" cy="118" rx="94" ry="44" fill="#fff" stroke="#d9d2dd"/><text x="850" y="108" text-anchor="middle">DRIVER-CYCLIST</text><text x="850" y="125" text-anchor="middle">RELATIONS</text></g>
<g class="node" id="node-space" onclick="selectNode('space')"><ellipse cx="850" cy="215" rx="94" ry="44" fill="#fff" stroke="#d9d2dd"/><text x="850" y="205" text-anchor="middle">URBAN ROAD</text><text x="850" y="222" text-anchor="middle">SPACE</text></g>
<g class="node" id="node-diversity" onclick="selectNode('diversity')"><ellipse cx="850" cy="312" rx="94" ry="44" fill="#fff" stroke="#d9d2dd"/><text x="850" y="302" text-anchor="middle">DIVERSITY IN</text><text x="850" y="319" text-anchor="middle">CYCLING</text></g>
<text class="caption" x="395" y="320">Dom Whiting as harmonic navigator</text><text class="caption" x="755" y="374">three multimodal gestalts</text>
</svg><div class="legend"><span>click nodes</span><span>orange = sonic energy</span><span>purple = social reformation</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Three gestalts</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Drum &amp; bass on the bike</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">multimodality</span><span class="tag">urban cycling</span><span class="tag">utopianism</span></div></div></section>
</main>
<script>
const nodeData={damage:{title:'Pandemic damage and isolation',text:'The system begins from lockdown damage: curtailed mobility, social fragmentation and the loss of face-to-face collective life.',quote:'The rides respond to a damaged social environment through sound, movement and shared outdoor presence.'},core:{title:'Drum & bass on the bike',text:'The central event combines Dom Whiting as DJ/cyclist, drum and bass music, moving urban cycling and livestreamed social participation.',quote:'A moving sound system turns the city into a temporary space of collective repair and social dreaming.'},driver:{title:'Driver-cyclist relations',text:'The horn is re-signified from aggression into participation. Drivers are invited into the event and rewarded as members of the “horning crew”.',quote:'A common symbol of road conflict becomes an emblem of inclusion.'},space:{title:'Urban road space',text:'Riders occupy and reconfigure urban road space, transforming streets into a collective soundscape, procession and temporary dancefloor.',quote:'Critical mass riding becomes a performative claim to the city.'},diversity:{title:'Diversity in cycling',text:'The rides display varied riders, vehicles, bodies, ages, fashions and participation styles, challenging narrow images of organized cycling.',quote:'The cycling event becomes non-judgmental, inclusive and visibly plural.'}};
const modeData={gestalts:{title:'Three gestalts',text:'This view foregrounds the three multimodal gestalts extracted in the article: driver-cyclist reform, road-space reform and diversity reform.',metrics:[['Driver-cyclist reform',86],['Road-space reform',90],['Diversity reform',82],['Utopian appeal',88]],paths:['p-damage-core','p-core-driver','p-core-space','p-core-diversity']},urban:{title:'Urban space',text:'This view emphasizes cycling as outdoor dynamic freedom and the road as a contested urban space reformed through critical mass and sound.',metrics:[['Cycling mobility',88],['Road occupation',86],['Mobile dancefloor',78],['Critical mass energy',84]],paths:['p-damage-core','p-core-space','p-utopia-loop']},community:{title:'Collective vibe',text:'This view highlights the social formation of the ride through drum and bass, shout-outs, slogans, horn interactions and networked participation.',metrics:[['Shared vibe',92],['Social media circulation',80],['Shout-out community',76],['Collective solidarity',88]],paths:['p-damage-core','p-core-driver','p-core-diversity','p-utopia-loop']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
setMode('gestalts');selectNode('core');function sendHeight(){window.parent.postMessage({type:'resize',source:'rivers-dnb-bike-utopianism-system',height:document.documentElement.scrollHeight},'*')}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);setInterval(sendHeight,1200);
</script>
</body></html>
