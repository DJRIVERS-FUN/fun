<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post-pandemic Utopianism DnB Bike System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1080px;margin:0 auto;padding:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;justify-content:center}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.canvas{height:500px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}.system{display:block;width:100%;height:500px}.node{cursor:pointer}.node ellipse,.node rect,.node circle{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect,.node:hover circle,.node.selected circle{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:11.5px;font-weight:700}.path{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linecap:round;stroke-dasharray:7 10;opacity:.48;animation:dash 7s linear infinite}.path.orange{stroke:var(--orange);opacity:.64}.path.grey{stroke:var(--muted);stroke-width:1.4;opacity:.32;stroke-dasharray:4 9}.path.light{stroke-width:1.2;opacity:.18}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.pulse{fill:var(--accent);opacity:.72;animation:pulse 2.8s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.32;animation-delay:1.2s}.glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.86}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.20))}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:12.5px;fill:var(--muted);font-weight:600}.beta{font-family:'DM Mono','Courier New',monospace;font-size:11px;fill:var(--muted)}.beta.em{fill:var(--accent);font-weight:700}.beta.risk{fill:var(--orange);font-weight:700}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:11px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:5px 8px;background:var(--orange)}.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;min-height:150px}.card.soft{background:var(--soft)}.small{font-size:11px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:7px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px;line-height:1.25}.card-text{font-size:14px;line-height:1.42;margin:0;color:var(--text)}.quote{font-size:13.5px;line-height:1.5;border-left:2px solid var(--accent);padding-left:11px;margin:8px 0 0;color:var(--text)}.metric{margin:0 0 9px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin:0 0 5px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;background:#fff;font-family:'DM Mono','Courier New',monospace}@media(max-width:860px){.canvas{height:460px}.system{height:460px}.info-grid{grid-template-columns:1fr}.node text{font-size:10.5px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap">
<div class="controls"><button id="btn-gestalts" class="active" onclick="setMode('gestalts')">Multimodal gestalts</button><button id="btn-urban" onclick="setMode('urban')">Urban reformation</button><button id="btn-community" onclick="setMode('community')">Collective vibe</button><button id="btn-full" onclick="setMode('full')">Full system</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1080 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Drum and bass on the bike post-pandemic utopianism system">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#520671"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e05c2a"/></marker><marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9a9890"/></marker></defs>
<text class="side-label" x="58" y="48">pandemic damage</text><text class="side-label" x="340" y="48">harmonic navigator</text><text class="side-label" x="624" y="48">multimodal gestalts</text><text class="side-label" x="820" y="444">post-pandemic utopianism</text>
<path id="p-damage-dom" class="path grey" marker-end="url(#arrowGrey)" d="M190 146 C250 132 292 128 344 138"/><path id="p-lockdown-dom" class="path grey" marker-end="url(#arrowGrey)" d="M190 228 C250 214 292 196 344 172"/>
<path id="p-dom-dnb" class="path orange" marker-end="url(#arrowOrange)" d="M490 156 C542 122 580 110 622 106"/><path id="p-dom-bike" class="path" marker-end="url(#arrow)" d="M490 156 C548 166 580 178 622 198"/><path id="p-dom-social" class="path" marker-end="url(#arrow)" d="M490 156 C548 226 582 280 622 314"/>
<path id="p-dnb-driver" class="path orange" marker-end="url(#arrowOrange)" d="M746 106 C812 126 850 152 884 192"/><path id="p-bike-space" class="path" marker-end="url(#arrow)" d="M746 198 C812 206 850 220 884 238"/><path id="p-social-diversity" class="path" marker-end="url(#arrow)" d="M746 314 C812 300 850 276 884 256"/>
<path id="p-driver-utopia" class="path orange" marker-end="url(#arrowOrange)" d="M972 202 C1016 210 1014 342 930 386"/><path id="p-space-utopia" class="path" marker-end="url(#arrow)" d="M972 238 C1016 250 1014 346 930 398"/><path id="p-diversity-utopia" class="path" marker-end="url(#arrow)" d="M972 278 C1010 302 1000 366 930 410"/>
<path id="p-vibe-loop" class="path light" d="M920 420 C660 470 230 410 128 260"/>
<circle class="pulse orange" cx="554" cy="122" r="5"/><circle class="pulse" cx="560" cy="178" r="5"/><circle class="pulse" cx="822" cy="206" r="5"/><circle class="pulse orange" cx="822" cy="142" r="5"/><circle class="pulse faint" cx="810" cy="298" r="5"/>
<g class="node" id="node-damage" onclick="selectNode('damage')"><ellipse cx="112" cy="146" rx="78" ry="46" fill="#fff" stroke="#d9d2dd"/><text x="112" y="137" text-anchor="middle">LOCKDOWN</text><text x="112" y="154" text-anchor="middle">DAMAGE</text></g>
<g class="node" id="node-isolation" onclick="selectNode('isolation')"><ellipse cx="112" cy="228" rx="78" ry="46" fill="#fff" stroke="#d9d2dd"/><text x="112" y="219" text-anchor="middle">SOCIAL</text><text x="112" y="236" text-anchor="middle">ISOLATION</text></g>
<g class="node selected glow" id="node-dom" onclick="selectNode('dom')"><ellipse cx="420" cy="156" rx="78" ry="58" fill="#fff" stroke="#d9d2dd"/><text x="420" y="143" text-anchor="middle">DOM WHITING</text><text x="420" y="160" text-anchor="middle">HARMONIC</text><text x="420" y="177" text-anchor="middle">NAVIGATOR</text></g>
<g class="node" id="node-dnb" onclick="selectNode('dnb')"><ellipse cx="684" cy="106" rx="66" ry="40" fill="#fff" stroke="#d9d2dd"/><text x="684" y="102" text-anchor="middle">DRUM &amp;</text><text x="684" y="119" text-anchor="middle">BASS VIBE</text></g>
<g class="node" id="node-bike" onclick="selectNode('bike')"><ellipse cx="684" cy="198" rx="72" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="684" y="189" text-anchor="middle">CYCLING</text><text x="684" y="206" text-anchor="middle">COLLECTIVE</text><text x="684" y="223" text-anchor="middle">MOBILITY</text></g>
<g class="node" id="node-social" onclick="selectNode('social')"><ellipse cx="684" cy="314" rx="78" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="684" y="305" text-anchor="middle">SOCIAL MEDIA</text><text x="684" y="322" text-anchor="middle">SHOUT-OUTS</text><text x="684" y="339" text-anchor="middle">YES, YES</text></g>
<g class="node" id="node-driver" onclick="selectNode('driver')"><ellipse cx="928" cy="202" rx="72" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="928" y="193" text-anchor="middle">DRIVER /</text><text x="928" y="210" text-anchor="middle">CYCLIST</text><text x="928" y="227" text-anchor="middle">REFORM</text></g>
<g class="node" id="node-space" onclick="selectNode('space')"><ellipse cx="928" cy="250" rx="76" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="928" y="241" text-anchor="middle">URBAN ROAD</text><text x="928" y="258" text-anchor="middle">SPACE USE</text></g>
<g class="node" id="node-diversity" onclick="selectNode('diversity')"><ellipse cx="928" cy="306" rx="76" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="928" y="297" text-anchor="middle">DIVERSITY IN</text><text x="928" y="314" text-anchor="middle">CYCLING</text></g>
<g class="node glow" id="node-utopia" onclick="selectNode('utopia')"><rect x="785" y="384" width="170" height="58" rx="13" fill="#fff" stroke="#d9d2dd"/><text x="870" y="405" text-anchor="middle">POST-PANDEMIC</text><text x="870" y="422" text-anchor="middle">UTOPIANISM</text></g>
<text class="beta risk" x="520" y="98">soundtrack as social dreaming</text><text class="beta em" x="520" y="214">road as mobile dancefloor</text><text class="beta em" x="736" y="332">community circulation</text>
</svg><div class="legend"><span>click nodes</span><span>orange = sonic energy</span><span>purple = social reformation</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Multimodal gestalts</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Dom Whiting as harmonic navigator</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">multimodality</span><span class="tag">urban cycling</span><span class="tag">utopianism</span></div></div></section>
</main>
<script>
const nodeData={damage:{title:'Lockdown damage',text:'The model begins with a society affected by pandemic restrictions, fear discourse, social fragmentation and curtailed movement.',quote:'Post-pandemic utopianism emerges as an answer to social damage and restricted collective life.'},isolation:{title:'Social isolation',text:'Isolation marks the loss of face-to-face connection and community participation that the rides reconfigure through collective movement and shared sound.',quote:'The bodies of others are transformed from perceived risk into sources of rhythm, solidarity and social repair.'},dom:{title:'Dom Whiting as harmonic navigator',text:'Dom functions as the central anchor of the system: DJ, cyclist, broadcaster and guide through the urban landscape.',quote:'The DJ becomes a navigator of change, reforming the city through sound, movement and collective participation.'},dnb:{title:'Drum and bass vibe',text:'Drum and bass provides the temporal sensory aesthetic: fast, euphoric, urban and collective. It turns the ride into a moving sound system.',quote:'The soundtrack designs the not-here, not-now and not-yet of the post-pandemic urban future.'},bike:{title:'Cycling collective mobility',text:'Cycling provides outdoor dynamic freedom after lockdown. The group ride turns individual mobility into critical mass and shared urban presence.',quote:'The road becomes a mobile social space rather than a corridor reserved for motor vehicles.'},social:{title:'Social media shout-outs',text:'Livestream comments, shout-outs and the repeated slogan “yes, yes” circulate belonging between riders and remote viewers.',quote:'Community is formed both in the street and across the networked social media audience.'},driver:{title:'Driver / cyclist reform',text:'The horn is re-signified from aggression into participation. Drivers are invited into the event and rewarded as members of the “horning crew”.',quote:'A common symbol of road conflict becomes an emblem of inclusion.'},space:{title:'Urban road space use',text:'Riders occupy and reconfigure urban road space, transforming streets into a collective soundscape, procession and temporary dancefloor.',quote:'Critical mass riding becomes a performative claim to the city.'},diversity:{title:'Diversity in cycling',text:'The rides display varied riders, vehicles, bodies, ages, fashions and participation styles, challenging narrow images of organized cycling.',quote:'The cycling event becomes non-judgmental, inclusive and visibly plural.'},utopia:{title:'Post-pandemic utopianism',text:'The three gestalts converge as a signpost toward a more tolerant, inclusive and unified post-pandemic urban social space.',quote:'The initiative communicates social dreaming through music, movement, road space and collective joy.'}};
const modeData={gestalts:{title:'Multimodal gestalts',text:'This view foregrounds the three gestalts extracted in the article: driver/cyclist reform, road-space reform and diversity reform.',metrics:[['Driver/cyclist reform',86],['Road-space reform',90],['Diversity reform',82],['Utopian appeal',88]],paths:['p-dom-dnb','p-dom-bike','p-dom-social','p-dnb-driver','p-bike-space','p-social-diversity','p-driver-utopia','p-space-utopia','p-diversity-utopia']},urban:{title:'Urban reformation',text:'This view emphasizes cycling as outdoor dynamic freedom and the road as a contested urban space reformed through critical mass and sound.',metrics:[['Cycling mobility',88],['Road occupation',86],['Mobile dancefloor',78],['Critical mass energy',84]],paths:['p-lockdown-dom','p-dom-bike','p-bike-space','p-space-utopia','p-vibe-loop']},community:{title:'Collective vibe',text:'This view highlights the social formation of the ride through drum and bass, shout-outs, slogans, horn interactions and networked participation.',metrics:[['Shared vibe',92],['Social media circulation',80],['Shout-out community',76],['Collective solidarity',88]],paths:['p-damage-dom','p-dom-dnb','p-dom-social','p-dnb-driver','p-social-diversity','p-driver-utopia','p-diversity-utopia','p-vibe-loop']},full:{title:'Full system',text:'This view presents the initiative as a multimodal ecology linking pandemic damage, music, cycling, social media and post-pandemic social dreaming.',metrics:[['Multimodal integration',92],['Urban transformation',88],['Community repair',86],['Inclusive participation',84]],paths:['p-damage-dom','p-lockdown-dom','p-dom-dnb','p-dom-bike','p-dom-social','p-dnb-driver','p-bike-space','p-social-diversity','p-driver-utopia','p-space-utopia','p-diversity-utopia','p-vibe-loop']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');if(mode!=='full')p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
setMode('gestalts');selectNode('dom');function sendHeight(){window.parent.postMessage({type:'resize',source:'rivers-dnb-bike-utopianism-system',height:document.documentElement.scrollHeight},'*')}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);setInterval(sendHeight,1200);
</script>
</body></html>
