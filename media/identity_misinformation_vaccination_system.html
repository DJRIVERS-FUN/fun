<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Identity Misinformation Vaccination System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden;width:100%}
.wrap{width:100%;max-width:none;margin:0;padding:0}.controls{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;justify-content:center}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 11px;border-radius:8px;font-size:12px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}
.canvas{height:575px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:8px}.system{display:block;width:100%;height:575px}
.node{cursor:pointer}.node ellipse,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.05))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:13px;font-weight:700;letter-spacing:.01em}
.layer-label,.beta,.legend{font-family:'DM Mono','Courier New',monospace}.layer-label{font-size:14px;fill:#d97706;letter-spacing:.055em}.layer-rule{stroke:#eee9e5;stroke-width:1}.path{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linecap:round;stroke-dasharray:8 12;opacity:.48;animation:dash 9s linear infinite}.path.orange{stroke:var(--orange);opacity:.65}.path.protect{stroke:var(--accent);opacity:.62}.path.context{stroke:#9a9890;stroke-width:1.45;opacity:.32;stroke-dasharray:5 10;animation:dash 11s linear infinite}.path.light{stroke:#d8d2dc;stroke-width:1.25;opacity:.18}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.pulse{fill:var(--accent);opacity:.70;animation:pulse 3.2s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.30;animation-delay:1.2s}.outcome-glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.84}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.18))}}
.beta{font-size:12px;fill:var(--muted);font-weight:600}.beta.em{fill:var(--accent);font-weight:700}.beta.risk{fill:var(--orange);font-weight:700}.label-bg{fill:#fff;stroke:#eee9e5;stroke-width:1;rx:8;ry:8;opacity:.94}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:4px 7px;background:var(--orange)}
.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;min-height:auto}.card.soft{background:var(--soft)}.small{font-size:10px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:13px;font-weight:700;color:var(--accent);margin:0 0 5px;line-height:1.2}.card-text{font-size:13px;line-height:1.36;margin:0;color:var(--text)}.quote{font-size:12px;line-height:1.38;border-left:2px solid var(--accent);padding-left:9px;margin:6px 0 0;color:var(--text)}.metric{margin:0 0 6px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;margin:0 0 4px;font-family:'DM Mono','Courier New',monospace}.bar{height:5px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 6px;background:#fff;font-family:'DM Mono','Courier New',monospace}
@media(max-width:860px){.canvas{height:485px}.system{height:485px}.info-grid{grid-template-columns:1fr}.node text{font-size:12px}.controls{justify-content:flex-start}}
@media(max-width:560px){.canvas{height:440px}.system{height:440px}.controls button{font-size:11px;padding:7px 9px}.node text{font-size:11px}}
</style>
</head>
<body>
<main class="wrap" id="wrap">
<div class="controls"><button id="btn-identity" class="active" onclick="setMode('identity')">Identity pathways</button><button id="btn-misinfo" onclick="setMode('misinfo')">Misinformation ecology</button><button id="btn-resilience" onclick="setMode('resilience')">Public health resilience</button><button id="btn-full" onclick="setMode('full')">Full system</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1440 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Identity misinformation and vaccination system">
<text class="layer-label" x="70" y="38">PERSONALITY TRAITS</text><line class="layer-rule" x1="70" y1="52" x2="330" y2="52"/>
<text class="layer-label" x="430" y="38">NATIONAL IDENTITY FACETS</text><line class="layer-rule" x1="430" y1="52" x2="760" y2="52"/>
<text class="layer-label" x="910" y="38">HEALTH COMMUNICATION OUTCOMES</text><line class="layer-rule" x1="910" y1="52" x2="1340" y2="52"/>
<text class="layer-label" x="625" y="515">CONTEXTUAL CONTROLS</text><line class="layer-rule" x1="625" y1="528" x2="1040" y2="528"/>

<path id="p-ext-nat" class="path orange" d="M250 95 C350 70 430 82 512 112"/><path id="p-con-nat" class="path orange" d="M250 225 C354 174 426 140 512 130"/><path id="p-ext-com" class="path protect" d="M250 95 C360 168 430 206 512 230"/><path id="p-est-com" class="path context" d="M250 290 C354 296 430 270 512 246"/><path id="p-agr-pat" class="path protect" d="M250 160 C382 330 438 382 512 395"/>
<path id="p-nat-mis" class="path orange" d="M700 120 C835 88 950 92 1058 132"/><path id="p-nat-vac" class="path orange" d="M700 140 C844 190 960 266 1058 324"/><path id="p-com-vac" class="path protect" d="M700 242 C846 270 960 298 1058 332"/><path id="p-pat-mis" class="path protect" d="M700 392 C850 324 960 190 1058 150"/><path id="p-pat-vac" class="path protect" d="M700 410 C850 396 960 356 1058 342"/>
<path id="p-pol-nat" class="path context" d="M665 548 C626 420 616 230 632 160"/><path id="p-pol-com" class="path context" d="M665 548 C628 446 622 320 638 270"/><path id="p-pol-pat" class="path context" d="M665 548 C640 488 632 448 644 422"/><path id="p-trust-mis" class="path protect" d="M905 548 C908 392 992 220 1058 160"/><path id="p-trust-vac" class="path protect" d="M905 548 C952 462 1012 382 1058 358"/><path id="p-gender" class="path context" d="M1125 548 C1112 466 1092 410 1080 368"/>
<path id="p-vac-mis" class="path light" d="M1216 186 C1280 226 1284 276 1216 308"/>

<circle class="pulse orange" cx="835" cy="100" r="5"/><circle class="pulse orange" cx="874" cy="238" r="5"/><circle class="pulse" cx="860" cy="370" r="5"/><circle class="pulse" cx="910" cy="280" r="5"/><circle class="pulse faint" cx="632" cy="472" r="5"/>

<g><rect class="label-bg" x="832" y="95" width="82" height="25"/><text class="beta risk" x="842" y="113">β=.39***</text></g><g><rect class="label-bg" x="842" y="232" width="82" height="25"/><text class="beta risk" x="852" y="250">β=.74***</text></g><g><rect class="label-bg" x="832" y="365" width="86" height="25"/><text class="beta em" x="842" y="383">β=-.48***</text></g><g><rect class="label-bg" x="862" y="392" width="86" height="25"/><text class="beta em" x="872" y="410">β=-.30***</text></g><g><rect class="label-bg" x="852" y="288" width="86" height="25"/><text class="beta em" x="862" y="306">β=-.42***</text></g>

<g class="node" id="node-ext" onclick="selectNode('ext')"><ellipse cx="145" cy="95" rx="105" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="145" y="99" text-anchor="middle">EXTRAVERSION</text></g>
<g class="node" id="node-agr" onclick="selectNode('agr')"><ellipse cx="145" cy="160" rx="105" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="145" y="164" text-anchor="middle">AGREEABLE</text></g>
<g class="node" id="node-con" onclick="selectNode('con')"><ellipse cx="145" cy="225" rx="105" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="145" y="229" text-anchor="middle">CONSCIENT.</text></g>
<g class="node" id="node-est" onclick="selectNode('est')"><ellipse cx="145" cy="290" rx="105" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="145" y="294" text-anchor="middle">EMOTIONAL STAB.</text></g>
<g class="node" id="node-ima" onclick="selectNode('ima')"><ellipse cx="145" cy="355" rx="105" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="145" y="359" text-anchor="middle">IMAGINATION</text></g>
<g class="node selected" id="node-nat" onclick="selectNode('nat')"><ellipse cx="610" cy="125" rx="106" ry="54" fill="#fff" stroke="#d9d2dd"/><text x="610" y="121" text-anchor="middle">NATIONALISM</text><text x="610" y="139" text-anchor="middle">NAT</text></g>
<g class="node" id="node-com" onclick="selectNode('com')"><ellipse cx="610" cy="240" rx="112" ry="56" fill="#fff" stroke="#d9d2dd"/><text x="610" y="230" text-anchor="middle">NATIONAL</text><text x="610" y="248" text-anchor="middle">HERITAGE</text><text x="610" y="266" text-anchor="middle">COM</text></g>
<g class="node" id="node-pat" onclick="selectNode('pat')"><ellipse cx="610" cy="402" rx="106" ry="54" fill="#fff" stroke="#d9d2dd"/><text x="610" y="398" text-anchor="middle">PATRIOTISM</text><text x="610" y="416" text-anchor="middle">PAT</text></g>
<g class="node outcome-glow" id="node-mis" onclick="selectNode('mis')"><ellipse cx="1150" cy="145" rx="112" ry="54" fill="#fff" stroke="#d9d2dd"/><text x="1150" y="136" text-anchor="middle">MISINFO.</text><text x="1150" y="154" text-anchor="middle">SUSCEPT.</text><text x="1150" y="172" text-anchor="middle">MIS</text></g>
<g class="node outcome-glow" id="node-vac" onclick="selectNode('vac')"><ellipse cx="1150" cy="340" rx="112" ry="54" fill="#fff" stroke="#d9d2dd"/><text x="1150" y="331" text-anchor="middle">VACCINE</text><text x="1150" y="349" text-anchor="middle">HESITANCY</text><text x="1150" y="367" text-anchor="middle">VAC</text></g>
<g class="node" id="node-pol" onclick="selectNode('pol')"><rect x="592" y="532" width="146" height="48" rx="10" fill="#fff" stroke="#d9d2dd"/><text x="665" y="552" text-anchor="middle">POLITICAL</text><text x="665" y="570" text-anchor="middle">IDEOLOGY</text></g>
<g class="node" id="node-trust" onclick="selectNode('trust')"><rect x="822" y="532" width="166" height="48" rx="10" fill="#fff" stroke="#d9d2dd"/><text x="905" y="552" text-anchor="middle">TRUST IN</text><text x="905" y="570" text-anchor="middle">GOVERNMENT</text></g>
<g class="node" id="node-gender" onclick="selectNode('gender')"><rect x="1084" y="532" width="82" height="48" rx="10" fill="#fff" stroke="#d9d2dd"/><text x="1125" y="561" text-anchor="middle">GENDER</text></g>
</svg><div class="legend"><span>click nodes</span><span>orange = risk pathway</span><span>purple = protective pathway</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Identity pathways</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Nationalism</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">Japanese youth</span><span class="tag">misinformation</span><span class="tag">public health</span></div></div></section>
</main>
<script>
const nodeData={ext:{title:'Extraversion',text:'Extraversion functions as a developmental trait linked to nationalism and commitment to national heritage in the tested model.',quote:'Social orientation and risk-facing tendencies help explain vulnerability within public health communication environments.'},agr:{title:'Agreeableness',text:'Agreeableness is linked to patriotism, reflecting a cooperative orientation compatible with collective responsibility and low-conflict social alignment.',quote:'Agreeable dispositions support identity forms that can sustain cooperative public health behaviour.'},con:{title:'Conscientiousness',text:'Conscientiousness is linked to nationalism in the model, reflecting order, duty and competitive in-group appraisal.',quote:'Order-seeking traits can support national identity attachments, but the public health consequences depend on the identity form activated.'},est:{title:'Emotional stability',text:'Emotional stability shows a weaker negative relationship with commitment to national heritage.',quote:'Some identity attachments may be shaped by uncertainty, anxiety or symbolic tension.'},ima:{title:'Imagination',text:'Imagination was included as one of the five personality traits but did not form a prominent retained pathway in the displayed structural model.',quote:'Not all developmental traits became meaningful communication pathways.'},nat:{title:'Nationalism',text:'Nationalism is the destabilizing identity pathway in the model. It predicts greater vaccine hesitancy and greater susceptibility to SARS-CoV-2 misinformation.',quote:'Nationalistic threat framing can undermine public health discourse when external danger is met with denial, resistance or misinformation acceptance.'},com:{title:'Commitment to national heritage',text:'Commitment to national heritage predicts lower vaccine hesitancy while also overlapping with nationalism and patriotism as a culturally specific identity facet.',quote:'Heritage attachment can operate as a protective pathway when it supports collective responsibility rather than oppositional identity.'},pat:{title:'Patriotism',text:'Patriotism predicts lower vaccine hesitancy and lower susceptibility to SARS-CoV-2 misinformation.',quote:'Patriotic identity appears protective when love of country is expressed through care for the collective in-group.'},mis:{title:'SARS-CoV-2 misinformation susceptibility',text:'Misinformation susceptibility is one of the two public health communication outcomes. The respecified model explained approximately 25% of its observed variance.',quote:'The model treats misinformation vulnerability as a relational outcome shaped by identity, trust and communication context.'},vac:{title:'Vaccine hesitancy',text:'Vaccine hesitancy is the second public health outcome. The respecified model explained approximately 30% of its observed variance.',quote:'Hesitancy is reduced by patriotic/heritage pathways and government trust, but increased by nationalism.'},pol:{title:'Political ideology',text:'Political ideology is a contextual control that links positively to nationalism, commitment to national heritage and patriotism.',quote:'Ideology helps structure how national identity becomes politically meaningful in public health contexts.'},trust:{title:'Trust in government response',text:'Trust in the government SARS-CoV-2 response reduces vaccine hesitancy and misinformation susceptibility while also linking positively to patriotism and nationalism.',quote:'Trust operates as a stabilizing communication condition during crisis management.'},gender:{title:'Gender',text:'Gender was included as a control variable, contributing to differences in national identity and vaccine hesitancy pathways.',quote:'Public health communication is shaped by social position as well as personality and identity.'}};
const modeData={identity:{title:'Identity pathways',text:'This view emphasizes how personality traits shape national identity facets, and how nationalism, heritage commitment and patriotism diverge in their public health consequences.',metrics:[['Nationalism to hesitancy',74],['Nationalism to misinformation',61],['Patriotism misinformation reduction',48],['Heritage hesitancy reduction',42]],paths:['p-ext-nat','p-con-nat','p-ext-com','p-est-com','p-agr-pat','p-nat-mis','p-nat-vac','p-com-vac','p-pat-mis','p-pat-vac']},misinfo:{title:'Misinformation ecology',text:'This view highlights susceptibility to SARS-CoV-2 misinformation as an outcome shaped by nationalism, patriotism and trust in government response.',metrics:[['MIS variance explained',25],['Nationalism risk',61],['Patriotism protection',48],['Government trust protection',12]],paths:['p-nat-mis','p-pat-mis','p-trust-mis','p-vac-mis']},resilience:{title:'Public health resilience',text:'This view highlights protective pathways: patriotism, commitment to national heritage and trust in government reduce misinformation susceptibility and vaccine hesitancy.',metrics:[['VAC variance explained',30],['Government trust reduction',36],['Patriotism hesitancy reduction',30],['Heritage hesitancy reduction',42]],paths:['p-com-vac','p-pat-mis','p-pat-vac','p-trust-mis','p-trust-vac']},full:{title:'Full system',text:'This view shows the public health communication system as a relational ecology linking developmental traits, national identity, ideology, trust and health attitudes.',metrics:[['Vaccine hesitancy variance',30],['Misinformation variance',25],['Initial hesitancy variance',14],['Initial misinformation variance',20]],paths:['p-ext-nat','p-con-nat','p-ext-com','p-est-com','p-agr-pat','p-nat-mis','p-nat-vac','p-com-vac','p-pat-mis','p-pat-vac','p-pol-nat','p-pol-com','p-pol-pat','p-trust-mis','p-trust-vac','p-gender','p-vac-mis']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');if(mode!=='full')p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
function sendHeight(){var wrap=document.getElementById('wrap');if(!wrap||!window.parent){return}var h=Math.ceil(wrap.getBoundingClientRect().height)+2;window.parent.postMessage({type:'resize',source:'rivers-identity-misinformation-system',height:h},'*')}
function queueHeight(){requestAnimationFrame(function(){requestAnimationFrame(sendHeight)})}
setMode('identity');selectNode('nat');window.addEventListener('load',queueHeight);window.addEventListener('resize',queueHeight);if('ResizeObserver' in window){new ResizeObserver(queueHeight).observe(document.getElementById('wrap'))}queueHeight();
</script>
</body></html>
