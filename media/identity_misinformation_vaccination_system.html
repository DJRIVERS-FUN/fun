<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Identity Misinformation Vaccination System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1080px;margin:0 auto;padding:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;justify-content:center}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.canvas{height:500px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}.system{display:block;width:100%;height:500px}.node{cursor:pointer}.node ellipse,.node rect,.node circle{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect,.node:hover circle,.node.selected circle{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:11.5px;font-weight:700}.path{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:7 10;opacity:.45;animation:dash 7s linear infinite}.path.orange{stroke:var(--orange);opacity:.62}.path.protect{stroke:var(--accent);opacity:.60}.path.context{stroke:var(--muted);stroke-width:1.4;opacity:.32;stroke-dasharray:4 9}.path.light{stroke-width:1.2;opacity:.18}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.pulse{fill:var(--accent);opacity:.72;animation:pulse 2.8s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.32;animation-delay:1.2s}.outcome-glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.86}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.20))}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:12.5px;fill:var(--muted);font-weight:600}.beta{font-family:'DM Mono','Courier New',monospace;font-size:11px;fill:var(--muted)}.beta.em{fill:var(--accent);font-weight:700}.beta.risk{fill:var(--orange);font-weight:700}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:11px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:5px 8px;background:var(--orange)}.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;min-height:150px}.card.soft{background:var(--soft)}.small{font-size:11px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:7px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px;line-height:1.25}.card-text{font-size:14px;line-height:1.42;margin:0;color:var(--text)}.quote{font-size:13.5px;line-height:1.5;border-left:2px solid var(--accent);padding-left:11px;margin:8px 0 0;color:var(--text)}.metric{margin:0 0 9px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin:0 0 5px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;background:#fff;font-family:'DM Mono','Courier New',monospace}@media(max-width:860px){.canvas{height:460px}.system{height:460px}.info-grid{grid-template-columns:1fr}.node text{font-size:10.5px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap">
<div class="controls"><button id="btn-identity" class="active" onclick="setMode('identity')">Identity pathways</button><button id="btn-misinfo" onclick="setMode('misinfo')">Misinformation ecology</button><button id="btn-resilience" onclick="setMode('resilience')">Public health resilience</button><button id="btn-full" onclick="setMode('full')">Full system</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1080 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="National identity misinformation and vaccination SEM system">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#520671"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e05c2a"/></marker><marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9a9890"/></marker></defs>
<text class="side-label" x="62" y="48">personality traits</text><text class="side-label" x="382" y="48">national identity</text><text class="side-label" x="760" y="48">health communication outcomes</text><text class="side-label" x="690" y="462">contextual controls</text>
<path id="p-ext-nat" class="path orange" marker-end="url(#arrowOrange)" d="M172 110 C260 72 322 72 390 104"/><path id="p-con-nat" class="path orange" marker-end="url(#arrowOrange)" d="M172 218 C260 170 320 142 390 126"/><path id="p-ext-com" class="path protect" marker-end="url(#arrow)" d="M172 110 C270 168 322 196 390 212"/><path id="p-est-com" class="path context" marker-end="url(#arrowGrey)" d="M172 272 C270 278 320 252 390 230"/><path id="p-agr-pat" class="path protect" marker-end="url(#arrow)" d="M172 164 C290 320 332 354 390 354"/>
<path id="p-nat-mis" class="path orange" marker-end="url(#arrowOrange)" d="M522 112 C640 92 720 92 792 122"/><path id="p-nat-vac" class="path orange" marker-end="url(#arrowOrange)" d="M522 132 C640 168 720 226 792 276"/><path id="p-com-vac" class="path protect" marker-end="url(#arrow)" d="M522 224 C645 244 720 262 792 288"/><path id="p-pat-mis" class="path protect" marker-end="url(#arrow)" d="M522 344 C654 292 724 184 792 142"/><path id="p-pat-vac" class="path protect" marker-end="url(#arrow)" d="M522 364 C645 350 720 318 792 300"/>
<path id="p-pol-nat" class="path context" marker-end="url(#arrowGrey)" d="M678 410 C596 340 548 210 500 148"/><path id="p-pol-com" class="path context" marker-end="url(#arrowGrey)" d="M678 410 C600 356 550 280 504 244"/><path id="p-pol-pat" class="path context" marker-end="url(#arrowGrey)" d="M678 410 C606 410 560 388 514 368"/><path id="p-trust-mis" class="path protect" marker-end="url(#arrow)" d="M888 410 C850 330 828 236 812 156"/><path id="p-trust-vac" class="path protect" marker-end="url(#arrow)" d="M888 410 C850 372 826 340 812 316"/><path id="p-gender" class="path context" marker-end="url(#arrowGrey)" d="M986 410 C940 352 902 328 840 306"/>
<path id="p-vac-mis" class="path light" d="M874 176 C920 204 922 242 874 270"/>
<circle class="pulse orange" cx="650" cy="96" r="5"/><circle class="pulse orange" cx="690" cy="214" r="5"/><circle class="pulse" cx="665" cy="310" r="5"/><circle class="pulse" cx="706" cy="224" r="5"/><circle class="pulse faint" cx="616" cy="382" r="5"/>
<text class="beta risk" x="640" y="98">β=.39***</text><text class="beta risk" x="640" y="208">β=.74***</text><text class="beta em" x="650" y="304">β=-.48***</text><text class="beta em" x="650" y="334">β=-.30***</text><text class="beta em" x="650" y="260">β=-.42***</text>
<g class="node" id="node-ext" onclick="selectNode('ext')"><ellipse cx="110" cy="110" rx="62" ry="30" fill="#fff" stroke="#d9d2dd"/><text x="110" y="114" text-anchor="middle">EXT</text></g>
<g class="node" id="node-agr" onclick="selectNode('agr')"><ellipse cx="110" cy="164" rx="62" ry="30" fill="#fff" stroke="#d9d2dd"/><text x="110" y="168" text-anchor="middle">AGR</text></g>
<g class="node" id="node-con" onclick="selectNode('con')"><ellipse cx="110" cy="218" rx="62" ry="30" fill="#fff" stroke="#d9d2dd"/><text x="110" y="222" text-anchor="middle">CON</text></g>
<g class="node" id="node-est" onclick="selectNode('est')"><ellipse cx="110" cy="272" rx="62" ry="30" fill="#fff" stroke="#d9d2dd"/><text x="110" y="276" text-anchor="middle">EST</text></g>
<g class="node" id="node-ima" onclick="selectNode('ima')"><ellipse cx="110" cy="326" rx="62" ry="30" fill="#fff" stroke="#d9d2dd"/><text x="110" y="330" text-anchor="middle">IMA</text></g>
<g class="node selected" id="node-nat" onclick="selectNode('nat')"><ellipse cx="456" cy="120" rx="66" ry="44" fill="#fff" stroke="#d9d2dd"/><text x="456" y="116" text-anchor="middle">NATIONALISM</text><text x="456" y="133" text-anchor="middle">NAT</text></g>
<g class="node" id="node-com" onclick="selectNode('com')"><ellipse cx="456" cy="224" rx="72" ry="46" fill="#fff" stroke="#d9d2dd"/><text x="456" y="214" text-anchor="middle">NATIONAL</text><text x="456" y="231" text-anchor="middle">HERITAGE</text><text x="456" y="248" text-anchor="middle">COM</text></g>
<g class="node" id="node-pat" onclick="selectNode('pat')"><ellipse cx="456" cy="356" rx="66" ry="44" fill="#fff" stroke="#d9d2dd"/><text x="456" y="352" text-anchor="middle">PATRIOTISM</text><text x="456" y="369" text-anchor="middle">PAT</text></g>
<g class="node outcome-glow" id="node-mis" onclick="selectNode('mis')"><ellipse cx="856" cy="136" rx="64" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="856" y="127" text-anchor="middle">MISINFO.</text><text x="856" y="144" text-anchor="middle">SUSCEPT.</text><text x="856" y="161" text-anchor="middle">MIS</text></g>
<g class="node outcome-glow" id="node-vac" onclick="selectNode('vac')"><ellipse cx="856" cy="294" rx="64" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="856" y="285" text-anchor="middle">VACCINE</text><text x="856" y="302" text-anchor="middle">HESITANCY</text><text x="856" y="319" text-anchor="middle">VAC</text></g>
<g class="node" id="node-pol" onclick="selectNode('pol')"><rect x="610" y="386" width="136" height="48" rx="10" fill="#fff" stroke="#d9d2dd"/><text x="678" y="406" text-anchor="middle">POLITICAL</text><text x="678" y="423" text-anchor="middle">IDEOLOGY</text></g>
<g class="node" id="node-trust" onclick="selectNode('trust')"><rect x="812" y="386" width="152" height="48" rx="10" fill="#fff" stroke="#d9d2dd"/><text x="888" y="406" text-anchor="middle">TRUST IN</text><text x="888" y="423" text-anchor="middle">GOVERNMENT</text></g>
<g class="node" id="node-gender" onclick="selectNode('gender')"><rect x="982" y="386" width="76" height="48" rx="10" fill="#fff" stroke="#d9d2dd"/><text x="1020" y="415" text-anchor="middle">GENDER</text></g>
</svg><div class="legend"><span>click nodes</span><span>orange = risk pathway</span><span>purple = protective pathway</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Identity pathways</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Nationalism</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">Japanese youth</span><span class="tag">misinformation</span><span class="tag">public health</span></div></div></section>
</main>
<script>
const nodeData={ext:{title:'Extraversion',text:'Extraversion functions as a developmental trait linked to nationalism and commitment to national heritage in the tested model.',quote:'Social orientation and risk-facing tendencies help explain vulnerability within public health communication environments.'},agr:{title:'Agreeableness',text:'Agreeableness is linked to patriotism, reflecting a cooperative orientation compatible with collective responsibility and low-conflict social alignment.',quote:'Agreeable dispositions support identity forms that can sustain cooperative public health behaviour.'},con:{title:'Conscientiousness',text:'Conscientiousness is linked to nationalism in the model, reflecting order, duty and competitive in-group appraisal.',quote:'Order-seeking traits can support national identity attachments, but the public health consequences depend on the identity form activated.'},est:{title:'Emotional stability',text:'Emotional stability shows a weaker negative relationship with commitment to national heritage.',quote:'Some identity attachments may be shaped by uncertainty, anxiety or symbolic tension.'},ima:{title:'Imagination',text:'Imagination was included as one of the five personality traits but did not form a prominent retained pathway in the displayed structural model.',quote:'Not all developmental traits became meaningful communication pathways.'},nat:{title:'Nationalism',text:'Nationalism is the destabilizing identity pathway in the model. It predicts greater vaccine hesitancy and greater susceptibility to SARS-CoV-2 misinformation.',quote:'Nationalistic threat framing can undermine public health discourse when external danger is met with denial, resistance or misinformation acceptance.'},com:{title:'Commitment to national heritage',text:'Commitment to national heritage predicts lower vaccine hesitancy while also overlapping with nationalism and patriotism as a culturally specific identity facet.',quote:'Heritage attachment can operate as a protective pathway when it supports collective responsibility rather than oppositional identity.'},pat:{title:'Patriotism',text:'Patriotism predicts lower vaccine hesitancy and lower susceptibility to SARS-CoV-2 misinformation.',quote:'Patriotic identity appears protective when love of country is expressed through care for the collective in-group.'},mis:{title:'SARS-CoV-2 misinformation susceptibility',text:'Misinformation susceptibility is one of the two public health communication outcomes. The respecified model explained approximately 25% of its observed variance.',quote:'The model treats misinformation vulnerability as a relational outcome shaped by identity, trust and communication context.'},vac:{title:'Vaccine hesitancy',text:'Vaccine hesitancy is the second public health outcome. The respecified model explained approximately 30% of its observed variance.',quote:'Hesitancy is reduced by patriotic/heritage pathways and government trust, but increased by nationalism.'},pol:{title:'Political ideology',text:'Political ideology is a contextual control that links positively to nationalism, commitment to national heritage and patriotism.',quote:'Ideology helps structure how national identity becomes politically meaningful in public health contexts.'},trust:{title:'Trust in government response',text:'Trust in the government SARS-CoV-2 response reduces vaccine hesitancy and misinformation susceptibility while also linking positively to patriotism and nationalism.',quote:'Trust operates as a stabilizing communication condition during crisis management.'},gender:{title:'Gender',text:'Gender was included as a control variable, contributing to differences in national identity and vaccine hesitancy pathways.',quote:'Public health communication is shaped by social position as well as personality and identity.'}};
const modeData={identity:{title:'Identity pathways',text:'This view emphasizes how personality traits shape national identity facets, and how nationalism, heritage commitment and patriotism diverge in their public health consequences.',metrics:[['Nationalism → hesitancy',74],['Nationalism → misinformation',61],['Patriotism → misinformation reduction',48],['Heritage → hesitancy reduction',42]],paths:['p-ext-nat','p-con-nat','p-ext-com','p-est-com','p-agr-pat','p-nat-mis','p-nat-vac','p-com-vac','p-pat-mis','p-pat-vac']},misinfo:{title:'Misinformation ecology',text:'This view highlights susceptibility to SARS-CoV-2 misinformation as an outcome shaped by nationalism, patriotism and trust in government response.',metrics:[['MIS variance explained',25],['Nationalism risk',61],['Patriotism protection',48],['Government trust protection',12]],paths:['p-nat-mis','p-pat-mis','p-trust-mis','p-vac-mis']},resilience:{title:'Public health resilience',text:'This view highlights protective pathways: patriotism, commitment to national heritage and trust in government reduce misinformation susceptibility and vaccine hesitancy.',metrics:[['VAC variance explained',30],['Government trust → hesitancy reduction',36],['Patriotism → hesitancy reduction',30],['Heritage → hesitancy reduction',42]],paths:['p-com-vac','p-pat-mis','p-pat-vac','p-trust-mis','p-trust-vac']},full:{title:'Full system',text:'This view shows the public health communication system as a relational ecology linking developmental traits, national identity, ideology, trust and health attitudes.',metrics:[['Vaccine hesitancy variance',30],['Misinformation variance',25],['Initial hesitancy variance',14],['Initial misinformation variance',20]],paths:['p-ext-nat','p-con-nat','p-ext-com','p-est-com','p-agr-pat','p-nat-mis','p-nat-vac','p-com-vac','p-pat-mis','p-pat-vac','p-pol-nat','p-pol-com','p-pol-pat','p-trust-mis','p-trust-vac','p-gender','p-vac-mis']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');if(mode!=='full')p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
setMode('identity');selectNode('nat');function sendHeight(){window.parent.postMessage({type:'resize',source:'rivers-identity-misinformation-system',height:document.documentElement.scrollHeight},'*')}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);setInterval(sendHeight,1200);
</script>
</body></html>
