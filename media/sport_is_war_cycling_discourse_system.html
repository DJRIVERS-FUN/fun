<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sport is War Cycling Discourse System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden;width:100%}
.wrap{width:100%;max-width:none;margin:0;padding:0}.controls{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;justify-content:center}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 11px;border-radius:8px;font-size:12px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}
.canvas{height:555px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:8px}.system{display:block;width:100%;height:555px}
.node{cursor:pointer}.node ellipse,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.05))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:13px;font-weight:700;letter-spacing:.01em}
.layer-label,.caption,.legend{font-family:'DM Mono','Courier New',monospace}.layer-label{font-size:14px;fill:#d97706;letter-spacing:.055em}.layer-rule{stroke:#eee9e5;stroke-width:1}.path{fill:none;stroke:var(--accent);stroke-width:2.35;stroke-linecap:round;stroke-dasharray:8 12;opacity:.50;animation:dash 9s linear infinite}.path.orange{stroke:var(--orange);opacity:.66}.path.grey{stroke:#9a9890;stroke-width:1.45;opacity:.32;stroke-dasharray:5 10;animation:dash 11s linear infinite}.path.light{stroke:#d8d2dc;stroke-width:1.25;opacity:.18}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.pulse{fill:var(--accent);opacity:.70;animation:pulse 3.2s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.30;animation-delay:1.2s}.glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.84}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.18))}}
.caption{font-size:12px;fill:var(--muted);font-weight:600}.label-bg{fill:#fff;stroke:#eee9e5;stroke-width:1;rx:8;ry:8;opacity:.94}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:4px 7px;background:var(--orange)}
.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;min-height:auto}.card.soft{background:var(--soft)}.small{font-size:10px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:13px;font-weight:700;color:var(--accent);margin:0 0 5px;line-height:1.2}.card-text{font-size:13px;line-height:1.36;margin:0;color:var(--text)}.quote{font-size:12px;line-height:1.38;border-left:2px solid var(--accent);padding-left:9px;margin:6px 0 0;color:var(--text)}.metric{margin:0 0 6px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;margin:0 0 4px;font-family:'DM Mono','Courier New',monospace}.bar{height:5px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 6px;background:#fff;font-family:'DM Mono','Courier New',monospace}
@media(max-width:860px){.canvas{height:470px}.system{height:470px}.info-grid{grid-template-columns:1fr}.node text{font-size:12px}.controls{justify-content:flex-start}}
@media(max-width:560px){.canvas{height:425px}.system{height:425px}.controls button{font-size:11px;padding:7px 9px}.node text{font-size:11px}}
</style>
</head>
<body>
<main class="wrap" id="wrap">
<div class="controls"><button id="btn-metaphor" class="active" onclick="setMode('metaphor')">Metaphor mapping</button><button id="btn-categories" onclick="setMode('categories')">Cycling categories</button><button id="btn-commentary" onclick="setMode('commentary')">Commentary system</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1440 580" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sport is war conceptual metaphor in cycling commentary system">
<text class="layer-label" x="80" y="38">SOURCE DOMAIN</text><line class="layer-rule" x1="80" y1="52" x2="350" y2="52"/>
<text class="layer-label" x="520" y="38">COMMENTARY MEDIATION</text><line class="layer-rule" x1="520" y1="52" x2="860" y2="52"/>
<text class="layer-label" x="1040" y="38">CYCLING DISCOURSE CATEGORIES</text><line class="layer-rule" x1="1040" y1="52" x2="1380" y2="52"/>

<path id="p-war-system" class="path orange" d="M292 280 C390 280 460 280 548 280"/>
<path id="p-system-comp" class="path orange" d="M812 250 C910 135 988 100 1070 92"/>
<path id="p-system-strat" class="path" d="M820 264 C914 190 988 170 1070 166"/>
<path id="p-system-power" class="path" d="M824 280 C916 280 988 280 1070 280"/>
<path id="p-system-team" class="path" d="M820 296 C914 360 988 380 1070 388"/>
<path id="p-system-sport" class="path grey" d="M812 310 C910 455 988 486 1070 488"/>
<path id="p-loop" class="path light" d="M1210 520 C900 570 410 520 150 360"/>
<path id="p-comp-strat" class="path light" d="M1210 118 C1260 142 1260 152 1210 186"/>
<path id="p-power-team" class="path light" d="M1210 302 C1260 334 1260 354 1210 408"/>

<circle class="pulse orange" cx="405" cy="280" r="5"/><circle class="pulse orange" cx="915" cy="142" r="5"/><circle class="pulse" cx="920" cy="210" r="5"/><circle class="pulse" cx="920" cy="320" r="5"/><circle class="pulse faint" cx="918" cy="430" r="5"/>

<g><rect class="label-bg" x="380" y="258" width="130" height="25"/><text class="caption" x="391" y="276">conceptual map</text></g>
<g><rect class="label-bg" x="870" y="130" width="112" height="25"/><text class="caption" x="881" y="148">conflict energy</text></g>
<g><rect class="label-bg" x="880" y="258" width="120" height="25"/><text class="caption" x="891" y="276">race reading</text></g>
<g><rect class="label-bg" x="848" y="430" width="138" height="25"/><text class="caption" x="859" y="448">ethical suspension</text></g>

<g class="node" id="node-war" onclick="selectNode('war')"><ellipse cx="150" cy="280" rx="142" ry="72" fill="#fff" stroke="#d9d2dd"/><text x="150" y="252" text-anchor="middle">WAR</text><text x="150" y="270" text-anchor="middle">SOURCE</text><text x="150" y="288" text-anchor="middle">DOMAIN</text><text x="150" y="306" text-anchor="middle">ATTACK / TRUCE</text></g>
<g class="node selected glow" id="node-system" onclick="selectNode('system')"><ellipse cx="680" cy="280" rx="142" ry="82" fill="#fff" stroke="#d9d2dd"/><text x="680" y="252" text-anchor="middle">CYCLING IS</text><text x="680" y="270" text-anchor="middle">WAR</text><text x="680" y="288" text-anchor="middle">COMMENTARY</text><text x="680" y="306" text-anchor="middle">SYSTEM</text></g>
<g class="node" id="node-comp" onclick="selectNode('comp')"><ellipse cx="1210" cy="92" rx="140" ry="44" fill="#fff" stroke="#d9d2dd"/><text x="1210" y="88" text-anchor="middle">COMPETITION</text><text x="1210" y="106" text-anchor="middle">ATTACKS</text></g>
<g class="node" id="node-strat" onclick="selectNode('strat')"><ellipse cx="1210" cy="166" rx="140" ry="44" fill="#fff" stroke="#d9d2dd"/><text x="1210" y="162" text-anchor="middle">STRATEGY</text><text x="1210" y="180" text-anchor="middle">RAIDS / MARKS</text></g>
<g class="node" id="node-power" onclick="selectNode('power')"><ellipse cx="1210" cy="280" rx="140" ry="44" fill="#fff" stroke="#d9d2dd"/><text x="1210" y="276" text-anchor="middle">POWER</text><text x="1210" y="294" text-anchor="middle">FIREPOWER</text></g>
<g class="node" id="node-team" onclick="selectNode('team')"><ellipse cx="1210" cy="388" rx="140" ry="44" fill="#fff" stroke="#d9d2dd"/><text x="1210" y="384" text-anchor="middle">TEAMWORK</text><text x="1210" y="402" text-anchor="middle">SACRIFICE</text></g>
<g class="node" id="node-sport" onclick="selectNode('sport')"><ellipse cx="1210" cy="488" rx="140" ry="44" fill="#fff" stroke="#d9d2dd"/><text x="1210" y="484" text-anchor="middle">SPORTSMANSHIP</text><text x="1210" y="502" text-anchor="middle">TRUCE</text></g>
<text class="caption" x="545" y="390">metaphor turns race events into tactical narrative</text><text class="caption" x="1015" y="548">viewer engagement + technical interpretation + symbolic drama</text>
</svg><div class="legend"><span>click nodes</span><span>orange = conflict energy</span><span>purple = discourse mapping</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Metaphor mapping</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Cycling is war commentary system</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">conceptual metaphor</span><span class="tag">cycling commentary</span><span class="tag">media discourse</span></div></div></section>
</main>
<script>
const nodeData={war:{title:'War source domain',text:'The source domain supplies familiar military concepts such as attack, defence, firepower, bodyguards, cavalry, sacrifice and truce.',quote:'War language provides the conceptual material through which cycling action becomes tactically intelligible.'},system:{title:'Cycling is war commentary system',text:'Cycling commentary maps the war source domain onto race events, transforming tactical movement, rider suffering and team formations into dramatic media narration.',quote:'The metaphor does not merely decorate commentary; it organizes how the race is understood.'},comp:{title:'Competition: attacks',text:'Competition is narrated through attacks, assaults, head-to-head battles and the pursuit of victory.',quote:'An attack in cycling can damage both the attacked rider and the attacker who launches it.'},strat:{title:'Strategy: raids and marked riders',text:'Strategic race movement is framed through raids, marked men, reloads and tactical positioning.',quote:'The metaphor helps audiences interpret when and why riders commit to decisive action.'},power:{title:'Power: firepower',text:'Power is narrated as firepower, referring to individual strength, team resources and the collective capacity to control rivals.',quote:'Firepower can belong to a single rider, a team, or a temporary alliance in a breakaway.'},team:{title:'Teamwork: sacrifice and protection',text:'Teamwork is framed through sacrifice, bodyguards, cavalry and layers of armour protecting the team leader.',quote:'In stage-race cycling, domestiques sacrifice individual glory for the leader and the team.'},sport:{title:'Sportsmanship: truce',text:'Sportsmanship is expressed through truce and cease-fire metaphors, especially when riders temporarily suspend attacks after crashes or mechanical problems.',quote:'The unwritten rules of the peloton become rules of engagement.'}};
const modeData={metaphor:{title:'Metaphor mapping',text:'This view shows how the war source domain is mapped onto cycling commentary, producing the Cycling is War discourse system.',metrics:[['War metaphors in sample',48],['Recorded war metaphors',71],['Total metaphors recorded',149],['Viewer engagement value',86]],paths:['p-war-system','p-system-comp','p-system-strat','p-system-power','p-system-team','p-system-sport']},categories:{title:'Cycling categories',text:'This view foregrounds the five thematic cycling categories identified in the analysis: competition, strategy, power, teamwork and sportsmanship.',metrics:[['Competition',39],['Strategy',21],['Power',16],['Teamwork',14]],paths:['p-system-comp','p-system-strat','p-system-power','p-system-team','p-system-sport','p-comp-strat','p-power-team']},commentary:{title:'Commentary system',text:'This view emphasizes commentary as a meaning-making system that intensifies drama, clarifies tactics and frames riders, teams and nations symbolically.',metrics:[['Tactical explanation',88],['Emotional intensification',84],['Symbolic identity',78],['Sportsmanship framing',70]],paths:['p-war-system','p-system-comp','p-system-strat','p-system-team','p-loop']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
function sendHeight(){var wrap=document.getElementById('wrap');if(!wrap||!window.parent){return}var h=Math.ceil(wrap.getBoundingClientRect().height)+2;window.parent.postMessage({type:'resize',source:'rivers-sport-war-system',height:h},'*')}
function queueHeight(){requestAnimationFrame(function(){requestAnimationFrame(sendHeight)})}
setMode('metaphor');selectNode('system');window.addEventListener('load',queueHeight);window.addEventListener('resize',queueHeight);if('ResizeObserver' in window){new ResizeObserver(queueHeight).observe(document.getElementById('wrap'))}queueHeight();
</script>
</body></html>
