<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sport is War Cycling Discourse System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1080px;margin:0 auto;padding:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;justify-content:center}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.canvas{height:450px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}.system{display:block;width:100%;height:450px}.node{cursor:pointer}.node ellipse,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:11.5px;font-weight:700}.path{fill:none;stroke:var(--accent);stroke-width:2.3;stroke-linecap:round;stroke-dasharray:7 10;opacity:.50;animation:dash 7s linear infinite}.path.orange{stroke:var(--orange);opacity:.66}.path.grey{stroke:var(--muted);stroke-width:1.4;opacity:.30;stroke-dasharray:4 9}.path.light{stroke-width:1.2;opacity:.16}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.pulse{fill:var(--accent);opacity:.72;animation:pulse 2.8s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.32;animation-delay:1.2s}.glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.86}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.20))}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:12.5px;fill:var(--muted);font-weight:600}.caption{font-family:'DM Mono','Courier New',monospace;font-size:11px;fill:var(--muted)}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:11px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:5px 8px;background:var(--orange)}.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;min-height:150px}.card.soft{background:var(--soft)}.small{font-size:11px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:7px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px;line-height:1.25}.card-text{font-size:14px;line-height:1.42;margin:0;color:var(--text)}.quote{font-size:13.5px;line-height:1.5;border-left:2px solid var(--accent);padding-left:11px;margin:8px 0 0;color:var(--text)}.metric{margin:0 0 9px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin:0 0 5px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;background:#fff;font-family:'DM Mono','Courier New',monospace}@media(max-width:860px){.canvas{height:405px}.system{height:405px}.info-grid{grid-template-columns:1fr}.node text{font-size:10.5px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap">
<div class="controls"><button id="btn-metaphor" class="active" onclick="setMode('metaphor')">Metaphor mapping</button><button id="btn-categories" onclick="setMode('categories')">Cycling categories</button><button id="btn-commentary" onclick="setMode('commentary')">Commentary system</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1080 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Sport is war conceptual metaphor in cycling commentary system">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#520671"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e05c2a"/></marker><marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9a9890"/></marker></defs>
<text class="side-label" x="62" y="50">source domain</text><text class="side-label" x="365" y="50">commentary mediation</text><text class="side-label" x="720" y="50">target domain</text>
<path id="p-war-system" class="path orange" marker-end="url(#arrowOrange)" d="M220 220 C292 220 330 220 392 220"/>
<path id="p-system-comp" class="path orange" marker-end="url(#arrowOrange)" d="M572 200 C640 136 690 108 758 100"/>
<path id="p-system-strat" class="path" marker-end="url(#arrow)" d="M578 212 C646 184 696 172 758 168"/>
<path id="p-system-power" class="path" marker-end="url(#arrow)" d="M580 225 C648 225 696 225 758 225"/>
<path id="p-system-team" class="path" marker-end="url(#arrow)" d="M578 238 C646 266 696 278 758 282"/>
<path id="p-system-sport" class="path grey" marker-end="url(#arrowGrey)" d="M572 252 C640 326 690 350 758 350"/>
<path id="p-loop" class="path light" d="M882 365 C690 430 280 395 130 282"/>
<path id="p-comp-strat" class="path light" d="M850 122 C884 145 884 160 850 188"/>
<path id="p-power-team" class="path light" d="M850 246 C884 264 884 272 850 300"/>
<circle class="pulse orange" cx="300" cy="220" r="5"/><circle class="pulse orange" cx="650" cy="137" r="5"/><circle class="pulse" cx="650" cy="195" r="5"/><circle class="pulse" cx="650" cy="250" r="5"/><circle class="pulse faint" cx="650" cy="320" r="5"/>
<g class="node" id="node-war" onclick="selectNode('war')"><ellipse cx="130" cy="220" rx="92" ry="64" fill="#fff" stroke="#d9d2dd"/><text x="130" y="202" text-anchor="middle">WAR</text><text x="130" y="219" text-anchor="middle">SOURCE</text><text x="130" y="236" text-anchor="middle">DOMAIN</text><text x="130" y="253" text-anchor="middle">ATTACK / TRUCE</text></g>
<g class="node selected glow" id="node-system" onclick="selectNode('system')"><ellipse cx="482" cy="225" rx="96" ry="72" fill="#fff" stroke="#d9d2dd"/><text x="482" y="206" text-anchor="middle">CYCLING IS</text><text x="482" y="223" text-anchor="middle">WAR</text><text x="482" y="240" text-anchor="middle">COMMENTARY</text><text x="482" y="257" text-anchor="middle">SYSTEM</text></g>
<g class="node" id="node-comp" onclick="selectNode('comp')"><ellipse cx="850" cy="100" rx="92" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="850" y="96" text-anchor="middle">COMPETITION</text><text x="850" y="113" text-anchor="middle">ATTACKS</text></g>
<g class="node" id="node-strat" onclick="selectNode('strat')"><ellipse cx="850" cy="168" rx="92" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="850" y="164" text-anchor="middle">STRATEGY</text><text x="850" y="181" text-anchor="middle">RAIDS / MARKS</text></g>
<g class="node" id="node-power" onclick="selectNode('power')"><ellipse cx="850" cy="225" rx="92" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="850" y="221" text-anchor="middle">POWER</text><text x="850" y="238" text-anchor="middle">FIREPOWER</text></g>
<g class="node" id="node-team" onclick="selectNode('team')"><ellipse cx="850" cy="282" rx="92" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="850" y="278" text-anchor="middle">TEAMWORK</text><text x="850" y="295" text-anchor="middle">SACRIFICE</text></g>
<g class="node" id="node-sport" onclick="selectNode('sport')"><ellipse cx="850" cy="350" rx="92" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="850" y="346" text-anchor="middle">SPORTSMANSHIP</text><text x="850" y="363" text-anchor="middle">TRUCE</text></g>
<text class="caption" x="370" y="330">metaphor turns race events into tactical narrative</text><text class="caption" x="690" y="402">viewer engagement + technical interpretation</text><text class="caption" x="760" y="418">+ symbolic drama</text>
</svg><div class="legend"><span>click nodes</span><span>orange = conflict energy</span><span>purple = discourse mapping</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Metaphor mapping</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Cycling is war commentary system</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">conceptual metaphor</span><span class="tag">cycling commentary</span><span class="tag">media discourse</span></div></div></section>
</main>
<script>
const nodeData={war:{title:'War source domain',text:'The source domain supplies familiar military concepts such as attack, defence, firepower, bodyguards, cavalry, sacrifice and truce.',quote:'War language provides the conceptual material through which cycling action becomes tactically intelligible.'},system:{title:'Cycling is war commentary system',text:'Cycling commentary maps the war source domain onto race events, transforming tactical movement, rider suffering and team formations into dramatic media narration.',quote:'The metaphor does not merely decorate commentary; it organizes how the race is understood.'},comp:{title:'Competition: attacks',text:'Competition is narrated through attacks, assaults, head-to-head battles and the pursuit of victory.',quote:'An attack in cycling can damage both the attacked rider and the attacker who launches it.'},strat:{title:'Strategy: raids and marked riders',text:'Strategic race movement is framed through raids, marked men, reloads and tactical positioning.',quote:'The metaphor helps audiences interpret when and why riders commit to decisive action.'},power:{title:'Power: firepower',text:'Power is narrated as firepower, referring to individual strength, team resources and the collective capacity to control rivals.',quote:'Firepower can belong to a single rider, a team, or a temporary alliance in a breakaway.'},team:{title:'Teamwork: sacrifice and protection',text:'Teamwork is framed through sacrifice, bodyguards, cavalry and layers of armour protecting the team leader.',quote:'In stage-race cycling, domestiques sacrifice individual glory for the leader and the team.'},sport:{title:'Sportsmanship: truce',text:'Sportsmanship is expressed through truce and cease-fire metaphors, especially when riders temporarily suspend attacks after crashes or mechanical problems.',quote:'The unwritten rules of the peloton become rules of engagement.'}};
const modeData={metaphor:{title:'Metaphor mapping',text:'This view shows how the war source domain is mapped onto cycling commentary, producing the Cycling is War discourse system.',metrics:[['War metaphors in sample',48],['Recorded war metaphors',71],['Total metaphors recorded',149],['Viewer engagement value',86]],paths:['p-war-system','p-system-comp','p-system-strat','p-system-power','p-system-team','p-system-sport']},categories:{title:'Cycling categories',text:'This view foregrounds the five thematic cycling categories identified in the analysis: competition, strategy, power, teamwork and sportsmanship.',metrics:[['Competition',39],['Strategy',21],['Power',16],['Teamwork',14]],paths:['p-system-comp','p-system-strat','p-system-power','p-system-team','p-system-sport','p-comp-strat','p-power-team']},commentary:{title:'Commentary system',text:'This view emphasizes commentary as a meaning-making system that intensifies drama, clarifies tactics and frames riders, teams and nations symbolically.',metrics:[['Tactical explanation',88],['Emotional intensification',84],['Symbolic identity',78],['Sportsmanship framing',70]],paths:['p-war-system','p-system-comp','p-system-strat','p-system-team','p-loop']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
setMode('metaphor');selectNode('system');function sendHeight(){window.parent.postMessage({type:'resize',source:'rivers-sport-war-system',height:document.documentElement.scrollHeight},'*')}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);setInterval(sendHeight,1200);
</script>
</body></html>
