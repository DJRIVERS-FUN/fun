<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Non-Verbal Hybrid Political Interview System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1080px;margin:0 auto;padding:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;justify-content:center}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.canvas{height:500px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}.system{display:block;width:100%;height:500px}.node{cursor:pointer}.node ellipse,.node rect,.node circle{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect,.node:hover circle,.node.selected circle{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:11.5px;font-weight:700}.path{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:7 10;opacity:.45;animation:dash 7s linear infinite}.path.orange{stroke:var(--orange);opacity:.62}.path.grey{stroke:var(--muted);stroke-width:1.4;opacity:.32;stroke-dasharray:4 9}.path.light{stroke-width:1.2;opacity:.18}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.pulse{fill:var(--accent);opacity:.72;animation:pulse 2.8s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.32;animation-delay:1.2s}.outcome-glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.86}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.20))}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:12.5px;fill:var(--muted);font-weight:600}.beta{font-family:'DM Mono','Courier New',monospace;font-size:11px;fill:var(--muted)}.beta.em{fill:var(--accent);font-weight:700}.beta.risk{fill:var(--orange);font-weight:700}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:11px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:5px 8px;background:var(--orange)}.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;min-height:150px}.card.soft{background:var(--soft)}.small{font-size:11px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:7px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px;line-height:1.25}.card-text{font-size:14px;line-height:1.42;margin:0;color:var(--text)}.quote{font-size:13.5px;line-height:1.5;border-left:2px solid var(--accent);padding-left:11px;margin:8px 0 0;color:var(--text)}.metric{margin:0 0 9px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin:0 0 5px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;background:#fff;font-family:'DM Mono','Courier New',monospace}@media(max-width:860px){.canvas{height:460px}.system{height:460px}.info-grid{grid-template-columns:1fr}.node text{font-size:10.5px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap">
<div class="controls"><button id="btn-hybrid" class="active" onclick="setMode('hybrid')">Hybrid interview</button><button id="btn-nonverbal" onclick="setMode('nonverbal')">Non-verbal performance</button><button id="btn-escalation" onclick="setMode('escalation')">Escalation cycle</button><button id="btn-full" onclick="setMode('full')">Full system</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1080 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Integrated non-verbal performance system in the hybrid political interview">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#520671"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e05c2a"/></marker><marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9a9890"/></marker></defs>
<text class="side-label" x="60" y="48">interactional genre</text><text class="side-label" x="360" y="48">verbal confrontation</text><text class="side-label" x="658" y="48">embodied performance</text><text class="side-label" x="820" y="444">second-frame audience</text>
<path id="p-genre-action" class="path" marker-end="url(#arrow)" d="M190 142 C260 132 305 130 350 132"/><path id="p-genre-interview" class="path grey" marker-end="url(#arrowGrey)" d="M190 198 C260 205 305 202 350 186"/>
<path id="p-action-repeat" class="path orange" marker-end="url(#arrowOrange)" d="M500 132 C548 132 580 132 628 132"/><path id="p-action-contrast" class="path orange" marker-end="url(#arrowOrange)" d="M500 132 C552 172 584 204 628 228"/><path id="p-interview-skeptic" class="path" marker-end="url(#arrow)" d="M500 186 C548 186 582 180 628 180"/>
<path id="p-reg-control" class="path orange" marker-end="url(#arrowOrange)" d="M762 132 C820 154 850 188 876 230"/><path id="p-emblem-control" class="path" marker-end="url(#arrow)" d="M762 180 C828 196 850 220 876 248"/><path id="p-expression-control" class="path grey" marker-end="url(#arrowGrey)" d="M762 276 C824 276 852 268 876 260"/><path id="p-illustrator-control" class="path" marker-end="url(#arrow)" d="M762 228 C824 230 852 240 876 252"/>
<path id="p-control-escalate" class="path orange" marker-end="url(#arrowOrange)" d="M960 252 C1018 232 1018 104 520 104"/><path id="p-control-audience" class="path" marker-end="url(#arrow)" d="M960 278 C994 322 1006 356 1008 386"/><path id="p-audience-genre" class="path light" d="M1000 412 C690 482 238 420 110 226"/>
<circle class="pulse orange" cx="542" cy="132" r="5"/><circle class="pulse orange" cx="804" cy="164" r="5"/><circle class="pulse" cx="822" cy="202" r="5"/><circle class="pulse faint" cx="820" cy="276" r="5"/><circle class="pulse" cx="982" cy="332" r="5"/>
<g class="node selected" id="node-hpi" onclick="selectNode('hpi')"><ellipse cx="116" cy="170" rx="78" ry="58" fill="#fff" stroke="#d9d2dd"/><text x="116" y="157" text-anchor="middle">HYBRID</text><text x="116" y="174" text-anchor="middle">POLITICAL</text><text x="116" y="191" text-anchor="middle">INTERVIEW</text></g>
<g class="node" id="node-action" onclick="selectNode('action')"><ellipse cx="424" cy="132" rx="76" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="424" y="123" text-anchor="middle">ACTION-</text><text x="424" y="140" text-anchor="middle">OPPOSITION</text><text x="424" y="157" text-anchor="middle">SEQUENCE</text></g>
<g class="node" id="node-interview" onclick="selectNode('interview')"><ellipse cx="424" cy="210" rx="78" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="424" y="201" text-anchor="middle">INTERVIEW /</text><text x="424" y="218" text-anchor="middle">ARGUMENT</text><text x="424" y="235" text-anchor="middle">SHIFTING</text></g>
<g class="node" id="node-regulators" onclick="selectNode('regulators')"><ellipse cx="696" cy="132" rx="68" ry="40" fill="#fff" stroke="#d9d2dd"/><text x="696" y="128" text-anchor="middle">REGULATORS</text><text x="696" y="145" text-anchor="middle">CONTROL</text></g>
<g class="node" id="node-emblems" onclick="selectNode('emblems')"><ellipse cx="696" cy="180" rx="68" ry="36" fill="#fff" stroke="#d9d2dd"/><text x="696" y="176" text-anchor="middle">EMBLEMS</text><text x="696" y="193" text-anchor="middle">STANCE</text></g>
<g class="node" id="node-illustrators" onclick="selectNode('illustrators')"><ellipse cx="696" cy="228" rx="68" ry="36" fill="#fff" stroke="#d9d2dd"/><text x="696" y="224" text-anchor="middle">ILLUSTRATORS</text><text x="696" y="241" text-anchor="middle">EMPHASIS</text></g>
<g class="node" id="node-expressions" onclick="selectNode('expressions')"><ellipse cx="696" cy="276" rx="74" ry="36" fill="#fff" stroke="#d9d2dd"/><text x="696" y="272" text-anchor="middle">EMOTIONAL</text><text x="696" y="289" text-anchor="middle">EXPRESSIONS</text></g>
<g class="node outcome-glow" id="node-control" onclick="selectNode('control')"><ellipse cx="920" cy="254" rx="76" ry="54" fill="#fff" stroke="#d9d2dd"/><text x="920" y="241" text-anchor="middle">CONTROL</text><text x="920" y="258" text-anchor="middle">STRUGGLE</text><text x="920" y="275" text-anchor="middle">ESCALATION</text></g>
<g class="node" id="node-audience" onclick="selectNode('audience')"><rect x="932" y="386" width="150" height="54" rx="12" fill="#fff" stroke="#d9d2dd"/><text x="1007" y="407" text-anchor="middle">SECOND-FRAME</text><text x="1007" y="424" text-anchor="middle">AUDIENCE</text></g>
<text class="beta risk" x="538" y="120">skeptical rejoinders</text><text class="beta risk" x="528" y="216">contrastives / repetition</text><text class="beta em" x="780" y="150">floor holding</text><text class="beta em" x="804" y="228">gesture + gaze</text><text class="beta" x="782" y="288">leaked affect</text>
</svg><div class="legend"><span>click nodes</span><span>orange = confrontation</span><span>purple = integrated performance</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Hybrid interview</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Hybrid political interview</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">political discourse</span><span class="tag">non-verbal performance</span><span class="tag">HPI</span></div></div></section>
</main>
<script>
const nodeData={hpi:{title:'Hybrid political interview',text:'The hybrid political interview blends news interview conventions with adversarial talk-show confrontation. It packages news as performance for an overhearing public audience.',quote:'The interview moves between information exchange, argument, entertainment and ideological contest.'},action:{title:'Action-opposition sequence',text:'Action-opposition sequences are the engine of the HPI: one challenge invites a counter-challenge, producing escalating turns of disagreement.',quote:'The interview becomes less a neutral exchange and more a cycle of argumentative reaction.'},interview:{title:'Interview / argument shifting',text:'Participants move back and forth between interview roles and argument roles. Questions, answers, repetition and non-resolution become part of a staged confrontation.',quote:'The interactional frame is unstable: interviewer and interviewee compete over footing and control.'},regulators:{title:'Regulators',text:'Regulators are the dominant non-verbal resource in the analysis. Floor holders, calls for information, leaning forward and control gestures manage turn-taking and authority.',quote:'Regulators become embodied attempts to control the floor and direct the confrontation.'},emblems:{title:'Emblems',text:'Emblems are culturally recognizable movements such as defensive shrugs, recoil, eye-rolling and gestures of disgust or disbelief.',quote:'They allow participants to display stance without relying on speech alone.'},illustrators:{title:'Illustrators',text:'Illustrators physically map, point to or emphasize spoken claims. Finger points, spatial gestures and baton-like movements make verbal arguments visually forceful.',quote:'Speech becomes more persuasive when argument is embodied.'},expressions:{title:'Emotional expressions',text:'Emotional expressions reveal or mask affect. Smiles, pained expressions and visible frustration can either soften confrontation or leak hostility.',quote:'The face becomes a site where calmness, sarcasm, frustration and control are negotiated.'},control:{title:'Control struggle and escalation',text:'The interaction escalates as verbal confrontation and non-verbal performance reinforce each other. Shared interactional space becomes contested through gaze, posture and gesture.',quote:'The HPI is not only spoken disagreement; it is an embodied struggle for authority.'},audience:{title:'Second-frame audience',text:'Because the HPI is televised, the performance is designed not only for the immediate participant but also for the viewing public.',quote:'The audience evaluates credibility, aggression, evasion and authority through both words and visible behaviour.'}};
const modeData={hybrid:{title:'Hybrid interview',text:'This view highlights the HPI as an unstable genre that cycles between interview conventions and argument conventions.',metrics:[['Interview structure',70],['Argument pressure',86],['Non-resolution',78],['Audience orientation',82]],paths:['p-genre-action','p-genre-interview','p-action-repeat','p-action-contrast','p-interview-skeptic','p-control-escalate','p-control-audience']},nonverbal:{title:'Non-verbal performance',text:'This view foregrounds the embodied layer of analysis: regulators, emblems, illustrators and emotional expressions operate alongside language.',metrics:[['Regulators',92],['Illustrators',76],['Emblems',68],['Emotional expressions',64]],paths:['p-action-repeat','p-action-contrast','p-interview-skeptic','p-reg-control','p-emblem-control','p-expression-control','p-illustrator-control']},escalation:{title:'Escalation cycle',text:'This view shows how linguistic confrontation and embodied control moves intensify the encounter across action-opposition sequences.',metrics:[['Floor control',88],['Gesture intensity',84],['Shared-space violation',72],['Acrimonious non-resolution',80]],paths:['p-action-repeat','p-action-contrast','p-reg-control','p-emblem-control','p-illustrator-control','p-control-escalate','p-control-audience','p-audience-genre']},full:{title:'Full system',text:'This view presents the HPI as an integrated communication system in which verbal and non-verbal resources jointly construct political confrontation.',metrics:[['Integrated analysis',90],['Verbal confrontation',86],['Embodied stance',82],['Televised performance',88]],paths:['p-genre-action','p-genre-interview','p-action-repeat','p-action-contrast','p-interview-skeptic','p-reg-control','p-emblem-control','p-expression-control','p-illustrator-control','p-control-escalate','p-control-audience','p-audience-genre']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');if(mode!=='full')p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
setMode('hybrid');selectNode('hpi');function sendHeight(){window.parent.postMessage({type:'resize',source:'rivers-nonverbal-hpi-system',height:document.documentElement.scrollHeight},'*')}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);setInterval(sendHeight,1200);
</script>
</body></html>
