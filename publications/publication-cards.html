<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publication Cards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#fff}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#6e6c66}

.rivers-pub-wrap{max-width:1000px;margin:0 auto;padding:4px 0 18px}

.rivers-pub-controls{display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 14px}
.rivers-pub-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rivers-pub-count{font-family:'DM Mono',monospace;font-size:12px;color:#9a9890;margin-right:6px}
.rivers-pub-label{font-family:'DM Mono',monospace;font-size:11px;color:#9a9890;margin-right:2px}

.rivers-pub-button{border:1px solid #e6e2de;background:#fff;color:#6e6c66;border-radius:999px;padding:4px 9px;font-family:'DM Mono',monospace;font-size:12px;cursor:pointer}
.rivers-pub-button.active,.rivers-pub-button:hover{border-color:#520671;color:#520671;background:#f7f3fa}

.rivers-pub-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

@media(min-width:780px){
  .rivers-pub-grid{
    grid-template-columns:1fr 1fr;
    align-items:stretch;
  }
}

.rivers-pub-card{
  border:1px solid #e6e2de;
  border-radius:8px;
  background:#fff;
  padding:15px 17px 14px;
  display:flex;
  flex-direction:column;
  height:100%;
  transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease
}

.rivers-pub-card:hover{
  border-color:#520671;
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(82,6,113,.08)
}

.rivers-pub-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}

.rivers-pub-badge{
  font-family:'DM Mono',monospace;
  font-size:11px;
  color:#520671;
  border:1px solid #e6d9ec;
  background:#fbf8fc;
  border-radius:999px;
  padding:2px 8px
}

.rivers-pub-apa{
  font-size:15px;
  line-height:1.42;
  color:#56534f
}

.rivers-pub-actions{
  margin-top:auto;
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.rivers-pub-link{
  font-family:'DM Mono',monospace;
  font-size:12px;
  color:#520671!important;
  text-decoration:none;
  border-bottom:1px solid transparent
}

.rivers-pub-link:hover{border-bottom:1px solid #520671}

</style>
</head>
<body>
<div class="rivers-pub-wrap">
  <div class="rivers-pub-controls">
    <div class="rivers-pub-row"><span class="rivers-pub-count" id="pubCount"></span></div>
    <div class="rivers-pub-row" id="decadeFilters"><span class="rivers-pub-label">Decade</span></div>
    <div class="rivers-pub-row" id="typeFilters"><span class="rivers-pub-label">Type</span></div>
    <div class="rivers-pub-row" id="domainFilters"><span class="rivers-pub-label">Domain</span></div>
  </div>
  <div class="rivers-pub-grid" id="pubGrid"></div>
</div>

<script>
const publications = [
  {year:'2024',apa:'Rivers, D. J., Unser-Schutz, G., & Rudolph, N. (2024). Vaccine hesitancy and susceptibility to SARS-CoV-2 misinformation in Japanese youth: The contribution of personality traits and national identity. International Journal of Environmental Research and Public Health, 21(1), Article 42.',doi:'10.3390/ijerph21010042',domain:'Health / misinformation',type:'Journal article'},
  {year:'2023',apa:'Rivers, D. J. (2023). The perceived value of remote access online learning: An instrument construction and validation case study. Education Sciences, 13(12), Article 1176.',doi:'10.3390/educsci13121176',domain:'Educational psychology',type:'Journal article'}
];

// enforce sort
publications.sort((a,b)=>{
  const y=Number(b.year)-Number(a.year);
  if(y!==0)return y;
  return (a.apa||"").localeCompare(b.apa||"");
});

const grid=document.getElementById('pubGrid');
const count=document.getElementById('pubCount');

function render(){
  grid.innerHTML='';
  count.textContent=`${publications.length} publications`;

  publications.forEach(p=>{
    const card=document.createElement('article');
    card.className='rivers-pub-card';

    const doi=p.doi?`<a class="rivers-pub-link" href="https://doi.org/${p.doi}" target="_blank">DOI</a>`:'';

    card.innerHTML=`
      <div class="rivers-pub-badges">
        <span class="rivers-pub-badge">${p.year}</span>
        <span class="rivers-pub-badge">${p.type}</span>
        <span class="rivers-pub-badge">${p.domain}</span>
      </div>
      <div class="rivers-pub-apa">${p.apa}</div>
      <div class="rivers-pub-actions">${doi}</div>
    `;

    grid.appendChild(card);
  });
}

render();
</script>
</body>
</html>
