<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publication Cards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&display=swap" rel="stylesheet">
<style>
body { margin:0; background:#ffffff; }
.rivers-pub-wrap { max-width:1000px; margin:20px auto; color:#6e6c66; font-family:system-ui,-apple-system,BlinkMacSystemFont; }
.rivers-pub-grid { display:grid; grid-template-columns:1fr; gap:14px; }
.rivers-pub-card { border:1px solid #e6e2de; border-radius:8px; padding:18px; transition:0.2s; }
.rivers-pub-card:hover { border-color:#520671; transform:translateY(-2px); box-shadow:0 8px 20px rgba(82,6,113,0.08);} 
.rivers-pub-title { color:#520671; font-size:18px; margin-bottom:6px; }
.rivers-pub-citation { font-size:14px; margin-bottom:8px; }
.rivers-pub-summary { font-size:15px; line-height:1.4; }
.rivers-pub-year { font-family:'DM Mono',monospace; font-size:12px; color:#520671; margin-bottom:6px; }
</style>
</head>
<body>
<div class="rivers-pub-wrap">
<div class="rivers-pub-grid" id="pubGrid"></div>
</div>

<script>
const data = [
{
  year: "2024",
  title: "Vaccine hesitancy and susceptibility to SARS-CoV-2 misinformation in Japanese youth",
  citation: "Rivers, D.J. et al. (2024). IJERPH.",
  summary: "Examines how personality traits and national identity shape misinformation susceptibility and vaccine hesitancy."
},
{
  year: "2023",
  title: "The perceived value of remote access online learning",
  citation: "Rivers, D.J. (2023). Education Sciences.",
  summary: "Models how students evaluate online learning environments in relation to self-regulation and institutional support."
},
{
  year: "2022",
  title: "Multimodal gestalts and post-pandemic utopianism",
  citation: "Rivers, D.J. (2022). Frontiers in Communication.",
  summary: "Analyses cycling media performance as a multimodal communicative event emerging from pandemic conditions."
}
];

const grid = document.getElementById('pubGrid');

data.forEach(p => {
  const card = document.createElement('div');
  card.className = 'rivers-pub-card';
  card.innerHTML = `
    <div class="rivers-pub-year">${p.year}</div>
    <div class="rivers-pub-title">${p.title}</div>
    <div class="rivers-pub-citation">${p.citation}</div>
    <div class="rivers-pub-summary">${p.summary}</div>
  `;
  grid.appendChild(card);
});
</script>

</body>
</html>
