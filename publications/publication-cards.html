function decadeOf(y){y=Number(y);return y>=2020?'2020s':y>=2010?'2010s':'2000s'}
function vals(key){return ['All',...Array.from(new Set(publications.map(p=>key==='decade'?decadeOf(p.year):p[key]).filter(Boolean))).sort()]}
function makeFilters(id,key){const el=document.getElementById(id);el.querySelectorAll('button').forEach(b=>b.remove());vals(key).forEach(v=>{const b=document.createElement('button');b.className='rivers-pub-button'+(state[key]===v?' active':'');b.textContent=v;b.onclick=()=>{state[key]=v;renderFilters();render()};el.appendChild(b)})}
function renderFilters(){makeFilters('decadeFilters','decade');makeFilters('typeFilters','type');makeFilters('domainFilters','domain')}
function visible(){return publications.filter(p=>(state.decade==='All'||decadeOf(p.year)===state.decade)&&(state.type==='All'||p.type===state.type)&&(state.domain==='All'||p.domain===state.domain))}
