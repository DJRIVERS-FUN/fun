<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #6e6c66;
  }

  .rivers-pub-wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 4px 0 18px 0;
  }

  .rivers-pub-toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 14px 0;
  }

  .rivers-pub-count {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: #9a9890;
  }

  .rivers-pub-filter {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
  }

  .rivers-pub-button {
    border: 1px solid #e6e2de;
    background: #ffffff;
    color: #6e6c66;
    border-radius: 999px;
    padding: 4px 9px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
  }

  .rivers-pub-button.active,
  .rivers-pub-button:hover {
    border-color: #520671;
    color: #520671;
    background: #f7f3fa;
  }

  .rivers-pub-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .rivers-pub-card {
    position: relative;
    border: 1px solid #e6e2de;
    border-radius: 8px;
    background: #ffffff;
    padding: 15px 17px 14px 17px;
    transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }

  .rivers-pub-card:hover {
    border-color: #520671;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(82, 6, 113, 0.08);
  }

  .rivers-pub-year {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: #520671;
    border: 1px solid #e6d9ec;
    background: #fbf8fc;
    border-radius: 999px;
    padding: 2px 8px;
    margin-bottom: 8px;
  }

  .rivers-pub-apa {
    font-size: 15px;
    line-height: 1.42;
    color: #56534f;
  }

  .rivers-pub-summary {
    margin-top: 10px;
    padding-left: 11px;
    border-left: 3px solid #e6d9ec;
    font-size: 14px;
    line-height: 1.42;
    color: #6e6c66;
  }

  .rivers-pub-summary-label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: #520671;
    margin-bottom: 3px;
  }

  @media (min-width: 780px) {
    .rivers-pub-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

const grid = document.getElementById("pubGrid");
const count = document.getElementById("pubCount");
const filters = document.getElementById("pubFilters");

const filterYears = ["All", "2020s", "2010s", "2000s"];
let activeFilter = "All";

function decadeOf(year) {
  const y = Number(year);
  if (y >= 2020) return "2020s";
  if (y >= 2010) return "2010s";
  return "2000s";
}

function renderFilters() {
  filters.innerHTML = "";
  filterYears.forEach(label => {
    const btn = document.createElement("button");
    btn.className = "rivers-pub-button" + (label === activeFilter ? " active" : "");
    btn.textContent = label;
    btn.addEventListener("click", () => {
      activeFilter = label;
      render();
      renderFilters();
    });
    filters.appendChild(btn);
  });
}

function render() {
  const visible = publications.filter(pub => activeFilter === "All" || decadeOf(pub.year) === activeFilter);
  grid.innerHTML = "";
  count.textContent = `${visible.length} publication${visible.length === 1 ? "" : "s"} shown`;

  visible.forEach(pub => {
    const card = document.createElement("article");
    card.className = "rivers-pub-card";

    const summaryBlock = pub.summary
      ? `<div class="rivers-pub-summary"><span class="rivers-pub-summary-label">Research contribution</span>${pub.summary}</div>`
      : "";

    card.innerHTML = `
      <div class="rivers-pub-year">${pub.year}</div>
      <div class="rivers-pub-apa">${pub.apa}</div>
      ${summaryBlock}
    `;
    grid.appendChild(card);
  });
}

renderFilters();
render();
