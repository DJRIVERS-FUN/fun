<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Self-Regulated Learning System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden;width:100%}
.wrap{width:100%;max-width:none;margin:0;padding:0}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;justify-content:center}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 11px;border-radius:8px;font-size:12px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}
button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}
.canvas{height:535px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:8px}.system{display:block;width:100%;height:535px}
.node{cursor:pointer}.node ellipse,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.05))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:13px;font-weight:700;letter-spacing:.01em}
.layer-label,.path-label,.legend{font-family:'DM Mono','Courier New',monospace}.layer-label{font-size:14px;fill:#d97706;letter-spacing:.055em}.layer-rule{stroke:#eee9e5;stroke-width:1}.path{fill:none;stroke:var(--accent);stroke-width:2.45;stroke-linecap:round;stroke-dasharray:8 12;opacity:.50;animation:dash 9s linear infinite}.path.orange{stroke:var(--orange);opacity:.58}.path.weak{stroke:#d8d2dc;stroke-width:1.45;opacity:.34;stroke-dasharray:5 10;animation:dash 11s linear infinite}.path.feedback{stroke:var(--orange);stroke-width:1.8;opacity:.38;stroke-dasharray:4 9;animation:dash 13s linear infinite}.path-label{font-size:12px;fill:var(--muted);font-weight:600}.label-bg{fill:#fff;stroke:#eee9e5;stroke-width:1;rx:8;ry:8;opacity:.94}@keyframes dash{to{stroke-dashoffset:-180}}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:4px 7px;background:var(--orange)}
.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;min-height:auto}.card.soft{background:var(--soft)}.small{font-size:10px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:13px;font-weight:700;color:var(--accent);margin:0 0 5px;line-height:1.2}.card-text{font-size:13px;line-height:1.36;margin:0;color:var(--text)}.quote{font-size:12px;line-height:1.38;border-left:2px solid var(--accent);padding-left:9px;margin:6px 0 0;color:var(--text)}.metric{margin:0 0 6px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;margin:0 0 4px;font-family:'DM Mono','Courier New',monospace}.bar{height:5px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 6px;background:#fff;font-family:'DM Mono','Courier New',monospace}
@media(max-width:860px){.canvas{height:455px}.system{height:455px}.info-grid{grid-template-columns:1fr}.node text{font-size:12px}.controls{justify-content:flex-start}}
@media(max-width:560px){.canvas{height:410px}.system{height:410px}.controls button{font-size:11px;padding:7px 9px}.node text{font-size:11px}}
</style>
</head>
<body>
<main class="wrap" id="wrap">
<div class="controls"><button id="btn-main" class="active" onclick="setMode('main')">Main pathway</button><button id="btn-mediated" onclick="setMode('mediated')">Mediated effects</button><button id="btn-practice" onclick="setMode('practice')">Practice view</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1440 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Online self-regulated learning pathway diagram">
<text class="layer-label" x="80" y="38">METACOGNITIVE SKILLS</text><line class="layer-rule" x1="80" y1="52" x2="355" y2="52"/>
<text class="layer-label" x="455" y="38">TASK CLARITY</text><line class="layer-rule" x1="455" y1="52" x2="700" y2="52"/>
<text class="layer-label" x="780" y="38">BEHAVIOURAL ACTION</text><line class="layer-rule" x1="780" y1="52" x2="1060" y2="52"/>
<text class="layer-label" x="1170" y="38">ACHIEVEMENT</text><line class="layer-rule" x1="1170" y1="52" x2="1360" y2="52"/>
<path class="path" d="M275 280 C355 280 405 280 488 280"/><path class="path orange" d="M708 280 C770 280 810 280 872 280"/><path class="path orange" d="M1080 280 C1145 280 1190 280 1252 280"/><path class="path weak" d="M705 328 C815 436 1010 432 1252 330"/><path class="path feedback" d="M1252 345 C1040 512 480 512 275 345"/>
<g><rect class="label-bg" x="360" y="257" width="95" height="25"/><text class="path-label" x="371" y="275">define task</text></g><g><rect class="label-bg" x="755" y="257" width="87" height="25"/><text class="path-label" x="766" y="275">persist</text></g><g><rect class="label-bg" x="1110" y="257" width="84" height="25"/><text class="path-label" x="1121" y="275">achieve</text></g><g><rect class="label-bg" x="690" y="458" width="146" height="25"/><text class="path-label" x="701" y="476">indirect pathway</text></g>
<g class="node selected" id="node-mcs" onclick="selectNode('mcs')"><ellipse cx="150" cy="280" rx="126" ry="62" fill="#fff" stroke="#d9d2dd"/><text x="150" y="266" text-anchor="middle">METACOGNITIVE</text><text x="150" y="284" text-anchor="middle">SKILLS</text><text x="150" y="302" text-anchor="middle">MCS</text></g>
<g class="node" id="node-goals" onclick="selectNode('goals')"><rect x="72" y="96" width="156" height="46" rx="10" fill="#fff" stroke="#d9d2dd"/><text x="150" y="124" text-anchor="middle">GOAL SETTING</text></g><g class="node" id="node-planning" onclick="selectNode('planning')"><rect x="72" y="156" width="156" height="46" rx="10" fill="#fff" stroke="#d9d2dd"/><text x="150" y="184" text-anchor="middle">STRATEGIC PLAN</text></g><g class="node" id="node-monitor" onclick="selectNode('monitor')"><rect x="72" y="374" width="156" height="46" rx="10" fill="#fff" stroke="#d9d2dd"/><text x="150" y="402" text-anchor="middle">MONITORING</text></g>
<g class="node" id="node-task" onclick="selectNode('task')"><ellipse cx="600" cy="280" rx="112" ry="58" fill="#fff" stroke="#d9d2dd"/><text x="600" y="275" text-anchor="middle">TASK</text><text x="600" y="293" text-anchor="middle">DEFINITION</text></g><g class="node" id="node-persist" onclick="selectNode('persist')"><ellipse cx="980" cy="280" rx="112" ry="58" fill="#fff" stroke="#d9d2dd"/><text x="980" y="275" text-anchor="middle">PERSISTENCE</text><text x="980" y="293" text-anchor="middle">EFFORT</text></g><g class="node" id="node-help" onclick="selectNode('help')"><ellipse cx="980" cy="410" rx="122" ry="48" fill="#fff" stroke="#d9d2dd"/><text x="980" y="405" text-anchor="middle">HELP-SEEKING</text><text x="980" y="423" text-anchor="middle">WEAK PATHWAY</text></g><g class="node" id="node-achieve" onclick="selectNode('achieve')"><ellipse cx="1320" cy="280" rx="118" ry="60" fill="#fff" stroke="#d9d2dd"/><text x="1320" y="275" text-anchor="middle">ONLINE</text><text x="1320" y="293" text-anchor="middle">ACHIEVEMENT</text></g>
</svg><div class="legend"><span>click nodes</span><span>toggle interpretation</span><span>OSRL pathway</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Main pathway</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Metacognitive skills</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">online learning</span><span class="tag">self-regulation</span><span class="tag">achievement</span></div></div></section>
</main>
<script>
const nodeData={mcs:{title:'Metacognitive skills',text:'Goal setting, strategic planning and comprehension monitoring form a second-order metacognitive skills construct. These skills provide the foundation for online self-regulated learning.',quote:'The central claim is not that metacognition acts alone, but that it must be expressed through applied learning behaviour.'},goals:{title:'Goal setting',text:'Students define short-term and long-term learning aims before or during online study. Goals provide a standard against which progress can be monitored.',quote:'Goals help turn online learning from passive access into directed activity.'},planning:{title:'Strategic planning',text:'Planning refers to choosing ways to approach tasks, connecting weekly activities and making decisions about how to study in the online course.',quote:'Planning links awareness to practical choices.'},monitor:{title:'Comprehension monitoring',text:'Monitoring involves pausing, reviewing and checking whether course goals and task demands have been understood.',quote:'Monitoring makes adjustment possible while learning is still underway.'},task:{title:'Task definition',text:'Task definition captures whether students understand instructor expectations, task instructions and expected outcomes. In the model, it mediates the pathway from metacognitive skills to persistence.',quote:'Clear task definition converts regulatory awareness into course-specific action.'},persist:{title:'Persistence',text:'Persistence is the key behavioural pathway: continuing to work despite dull, difficult or disliked material. It most clearly carries metacognitive skills toward achievement.',quote:'The strongest route to achievement runs through sustained action.'},achieve:{title:'Online achievement',text:'Achievement refers to final course outcomes in the online communications course. The tested models explained approximately 11.1% to 12.6% of achievement variance.',quote:'Achievement is influenced indirectly through regulation, clarity and persistence.'},help:{title:'Help-seeking',text:'Help-seeking was included as an adaptive strategy, but its role was limited in this context. It is shown as a weaker secondary route rather than the core achievement pathway.',quote:'Peer help may support coping, but it was less reliable than persistence as an achievement pathway.'}};
const modeData={main:{title:'Main pathway',text:'This view emphasizes the core OSRL sequence: metacognitive skills support task definition, task definition supports persistence, and persistence supports online achievement.',metrics:[['Persistence pathway',82],['Task definition',69],['Direct MCS effect',12],['Help-seeking route',18]]},mediated:{title:'Mediated effects',text:'The paper argues that metacognitive skills do not directly produce achievement. Their effect is mediated mainly through persistence and serially through task definition followed by persistence.',metrics:[['MCS to persistence to achievement',78],['MCS to task to persistence',68],['MCS to help-seeking',34],['MCS direct to achievement',10]]},practice:{title:'Practice view',text:'For teaching, the model points toward explicit strategy guidance, clear task instructions, consistent expectations and course designs that help students sustain effort online.',metrics:[['Clarify expectations',80],['Scaffold strategy use',72],['Support persistence',86],['Structure help-seeking',44]]}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${value}%"></span></div></div>`).join('');sendHeight()}
function sendHeight(){var wrap=document.getElementById('wrap');if(!wrap||!window.parent){return}var h=Math.ceil(wrap.getBoundingClientRect().height)+2;window.parent.postMessage({type:'resize',source:'rivers-online-srl-system',height:h},'*')}
function queueHeight(){requestAnimationFrame(function(){requestAnimationFrame(sendHeight)})}
setMode('main');selectNode('mcs');window.addEventListener('load',queueHeight);window.addEventListener('resize',queueHeight);if('ResizeObserver' in window){new ResizeObserver(queueHeight).observe(document.getElementById('wrap'))}queueHeight();
</script>
</body></html>
