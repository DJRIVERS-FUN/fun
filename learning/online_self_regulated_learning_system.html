<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Self-Regulated Learning System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1080px;margin:0 auto;padding:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;justify-content:center}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.canvas{height:430px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}.system{display:block;width:100%;height:430px}.node{cursor:pointer}.node circle,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover circle,.node.selected circle,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:12px;font-weight:700}.flow{fill:none;stroke:var(--accent);stroke-width:2.3;stroke-linecap:round;stroke-dasharray:7 10;opacity:.45;animation:dash 7s linear infinite}.flow.orange{stroke:var(--orange);opacity:.55}.flow.weak{stroke:var(--muted);stroke-width:1.5;opacity:.28;stroke-dasharray:4 9}.flow.light{stroke-width:1.4;opacity:.22}@keyframes dash{to{stroke-dashoffset:-180}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:13px;fill:var(--muted);font-weight:600}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:11px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:5px 8px;background:var(--orange)}.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;min-height:150px}.card.soft{background:var(--soft)}.small{font-size:11px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:7px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px;line-height:1.25}.card-text{font-size:14px;line-height:1.42;margin:0;color:var(--text)}.quote{font-size:13.5px;line-height:1.5;border-left:2px solid var(--accent);padding-left:11px;margin:8px 0 0;color:var(--text)}.metric{margin:0 0 9px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin:0 0 5px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;background:#fff;font-family:'DM Mono','Courier New',monospace}@media(max-width:860px){.canvas{height:390px}.system{height:390px}.info-grid{grid-template-columns:1fr}.node text{font-size:11px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap">
<div class="controls"><button id="btn-main" class="active" onclick="setMode('main')">Main pathway</button><button id="btn-mediated" onclick="setMode('mediated')">Mediated effects</button><button id="btn-practice" onclick="setMode('practice')">Practice view</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1040 430" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Online self-regulated learning pathway diagram">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#520671"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e05c2a"/></marker></defs>
<path class="flow" marker-end="url(#arrow)" d="M195 215 C245 215 275 215 318 215"/>
<path class="flow orange" marker-end="url(#arrowOrange)" d="M460 215 C500 215 520 215 558 215"/>
<path class="flow orange" marker-end="url(#arrowOrange)" d="M690 215 C735 215 760 215 803 215"/>
<path class="flow weak" marker-end="url(#arrow)" d="M458 246 C540 325 650 332 804 247"/>
<path class="flow light" d="M860 260 C705 372 334 372 155 260"/>
<text class="side-label" x="72" y="92">latent skills</text><text class="side-label" x="298" y="92">course clarity</text><text class="side-label" x="555" y="92">behavioural action</text><text class="side-label" x="806" y="92">achievement</text><text class="side-label" x="420" y="382">indirect pathway through task definition and persistence</text>
<g class="node selected" id="node-mcs" onclick="selectNode('mcs')"><circle cx="125" cy="215" r="70" fill="#fff" stroke="#d9d2dd"/><text x="125" y="202" text-anchor="middle">METACOGNITIVE</text><text x="125" y="219" text-anchor="middle">SKILLS</text><text x="125" y="236" text-anchor="middle">MCS</text></g>
<g class="node" id="node-goals" onclick="selectNode('goals')"><rect x="56" y="52" width="138" height="42" rx="8" fill="#fff" stroke="#d9d2dd"/><text x="125" y="78" text-anchor="middle">GOAL SETTING</text></g>
<g class="node" id="node-planning" onclick="selectNode('planning')"><rect x="56" y="106" width="138" height="42" rx="8" fill="#fff" stroke="#d9d2dd"/><text x="125" y="132" text-anchor="middle">STRATEGIC PLAN</text></g>
<g class="node" id="node-monitor" onclick="selectNode('monitor')"><rect x="56" y="282" width="138" height="42" rx="8" fill="#fff" stroke="#d9d2dd"/><text x="125" y="308" text-anchor="middle">MONITORING</text></g>
<g class="node" id="node-task" onclick="selectNode('task')"><rect x="318" y="168" width="142" height="94" rx="12" fill="#fff" stroke="#d9d2dd"/><text x="389" y="207" text-anchor="middle">TASK</text><text x="389" y="224" text-anchor="middle">DEFINITION</text></g>
<g class="node" id="node-persist" onclick="selectNode('persist')"><rect x="558" y="168" width="132" height="94" rx="12" fill="#fff" stroke="#d9d2dd"/><text x="624" y="207" text-anchor="middle">PERSISTENCE</text><text x="624" y="224" text-anchor="middle">EFFORT</text></g>
<g class="node" id="node-achieve" onclick="selectNode('achieve')"><rect x="804" y="168" width="150" height="94" rx="12" fill="#fff" stroke="#d9d2dd"/><text x="879" y="207" text-anchor="middle">ONLINE</text><text x="879" y="224" text-anchor="middle">ACHIEVEMENT</text></g>
<g class="node" id="node-help" onclick="selectNode('help')"><rect x="520" y="300" width="164" height="64" rx="12" fill="#fff" stroke="#d9d2dd"/><text x="602" y="326" text-anchor="middle">HELP-SEEKING</text><text x="602" y="343" text-anchor="middle">WEAK PATHWAY</text></g>
</svg><div class="legend"><span>click nodes</span><span>toggle interpretation</span><span>OSRL pathway</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Main pathway</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Metacognitive skills</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">online learning</span><span class="tag">self-regulation</span><span class="tag">achievement</span></div></div></section>
</main>
<script>
const nodeData={mcs:{title:'Metacognitive skills',text:'Goal setting, strategic planning and comprehension monitoring form a second-order metacognitive skills construct. These skills provide the foundation for online self-regulated learning.',quote:'The central claim is not that metacognition acts alone, but that it must be expressed through applied learning behaviour.'},goals:{title:'Goal setting',text:'Students define short-term and long-term learning aims before or during online study. Goals provide a standard against which progress can be monitored.',quote:'Goals help turn online learning from passive access into directed activity.'},planning:{title:'Strategic planning',text:'Planning refers to choosing ways to approach tasks, connecting weekly activities and making decisions about how to study in the online course.',quote:'Planning links awareness to practical choices.'},monitor:{title:'Comprehension monitoring',text:'Monitoring involves pausing, reviewing and checking whether course goals and task demands have been understood.',quote:'Monitoring makes adjustment possible while learning is still underway.'},task:{title:'Task definition',text:'Task definition captures whether students understand instructor expectations, task instructions and expected outcomes. In the model, it mediates the pathway from metacognitive skills to persistence.',quote:'Clear task definition converts regulatory awareness into course-specific action.'},persist:{title:'Persistence',text:'Persistence is the key behavioural pathway: continuing to work despite dull, difficult or disliked material. It most clearly carries metacognitive skills toward achievement.',quote:'The strongest route to achievement runs through sustained action.'},achieve:{title:'Online achievement',text:'Achievement refers to final course outcomes in the online communications course. The tested models explained approximately 11.1% to 12.6% of achievement variance.',quote:'Achievement is influenced indirectly through regulation, clarity and persistence.'},help:{title:'Help-seeking',text:'Help-seeking was included as an adaptive strategy, but its role was limited in this context. It is shown as a weaker secondary route rather than the core achievement pathway.',quote:'Peer help may support coping, but it was less reliable than persistence as an achievement pathway.'}};
const modeData={main:{title:'Main pathway',text:'This view emphasizes the core OSRL sequence: metacognitive skills support task definition, task definition supports persistence, and persistence supports online achievement.',metrics:[['Persistence pathway',82],['Task definition',69],['Direct MCS effect',12],['Help-seeking route',18]]},mediated:{title:'Mediated effects',text:'The paper argues that metacognitive skills do not directly produce achievement. Their effect is mediated mainly through persistence and serially through task definition followed by persistence.',metrics:[['MCS → persistence → achievement',78],['MCS → task → persistence',68],['MCS → help-seeking',34],['MCS direct to achievement',10]]},practice:{title:'Practice view',text:'For teaching, the model points toward explicit strategy guidance, clear task instructions, consistent expectations and course designs that help students sustain effort online.',metrics:[['Clarify expectations',80],['Scaffold strategy use',72],['Support persistence',86],['Structure help-seeking',44]]}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${value}%"></span></div></div>`).join('');sendHeight()}
setMode('main');selectNode('mcs');function sendHeight(){window.parent.postMessage({type:'resize',source:'rivers-online-srl-system',height:document.documentElement.scrollHeight},'*')}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);setInterval(sendHeight,1200);
</script>
</body></html>
