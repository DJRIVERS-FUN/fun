<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adaptive Learning Value System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden;width:100%}
.wrap{width:100%;max-width:none;margin:0;padding:0}.controls{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;justify-content:center}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 11px;border-radius:8px;font-size:12px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}
button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}
.canvas{height:535px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:8px}.system{display:block;width:100%;height:535px}
.node{cursor:pointer}.node ellipse,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.05))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:13px;font-weight:700;letter-spacing:.01em}
.layer-label,.path-label,.legend{font-family:'DM Mono','Courier New',monospace}.layer-label{font-size:14px;fill:#d97706;letter-spacing:.055em}.layer-rule{stroke:#eee9e5;stroke-width:1}.path{fill:none;stroke:var(--accent);stroke-width:2.35;stroke-linecap:round;stroke-dasharray:8 12;opacity:.50;animation:dash 9s linear infinite}.path.orange{stroke:var(--orange);opacity:.62}.path.weak{stroke:#d8d2dc;stroke-width:1.45;opacity:.34;stroke-dasharray:5 10;animation:dash 11s linear infinite}.path.feedback{stroke:var(--orange);stroke-width:1.7;opacity:.30;stroke-dasharray:4 9;animation:dash 13s linear infinite}.path-label{font-size:12px;fill:var(--muted);font-weight:600}.label-bg{fill:#fff;stroke:#eee9e5;stroke-width:1;rx:8;ry:8;opacity:.94}.pulse{fill:var(--accent);opacity:.72;animation:pulse 3.2s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.30;animation-delay:1.1s}.value-glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.84}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.18))}}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:4px 7px;background:var(--orange)}
.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;min-height:auto}.card.soft{background:var(--soft)}.small{font-size:10px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:13px;font-weight:700;color:var(--accent);margin:0 0 5px;line-height:1.2}.card-text{font-size:13px;line-height:1.36;margin:0;color:var(--text)}.quote{font-size:12px;line-height:1.38;border-left:2px solid var(--accent);padding-left:9px;margin:6px 0 0;color:var(--text)}.metric{margin:0 0 6px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;margin:0 0 4px;font-family:'DM Mono','Courier New',monospace}.bar{height:5px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 6px;background:#fff;font-family:'DM Mono','Courier New',monospace}
@media(max-width:860px){.canvas{height:455px}.system{height:455px}.info-grid{grid-template-columns:1fr}.node text{font-size:12px}.controls{justify-content:flex-start}}
@media(max-width:560px){.canvas{height:410px}.system{height:410px}.controls button{font-size:11px;padding:7px 9px}.node text{font-size:11px}}
</style>
</head>
<body>
<main class="wrap" id="wrap">
<div class="controls"><button id="btn-model" class="active" onclick="setMode('model')">Value model</button><button id="btn-paths" onclick="setMode('paths')">Validated pathways</button><button id="btn-practice" onclick="setMode('practice')">Post-pandemic view</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1440 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Adaptive learning value structural model">
<text class="layer-label" x="80" y="38">LEARNER + INSTITUTION</text><line class="layer-rule" x1="80" y1="52" x2="370" y2="52"/>
<text class="layer-label" x="485" y="38">CAREER APPRAISAL</text><line class="layer-rule" x1="485" y1="52" x2="740" y2="52"/>
<text class="layer-label" x="805" y="38">TECHNOLOGY INTERFACE</text><line class="layer-rule" x1="805" y1="52" x2="1080" y2="52"/>
<text class="layer-label" x="1190" y="38">PERCEIVED VALUE</text><line class="layer-rule" x1="1190" y1="52" x2="1380" y2="52"/>

<path class="path" d="M278 185 C360 146 420 132 498 142"/>
<path class="path" d="M278 205 C540 220 980 218 1196 268"/>
<path class="path weak" d="M278 235 C430 332 645 395 820 395"/>
<path class="path orange" d="M278 352 C380 300 420 214 498 162"/>
<path class="path orange" d="M278 372 C555 350 980 304 1196 286"/>
<path class="path orange" d="M278 392 C430 430 655 430 820 405"/>
<path class="path orange" d="M738 150 C875 170 1036 218 1196 270"/>
<path class="path weak" d="M1000 395 C1080 356 1140 318 1196 292"/>
<path class="path feedback" d="M1196 340 C990 510 480 510 278 410"/>

<circle class="pulse" cx="370" cy="150" r="5"/><circle class="pulse" cx="602" cy="214" r="5"/><circle class="pulse orange" cx="388" cy="292" r="5"/><circle class="pulse orange" cx="880" cy="304" r="5"/><circle class="pulse faint" cx="605" cy="378" r="5"/>

<g><rect class="label-bg" x="345" y="130" width="82" height="25"/><text class="path-label" x="356" y="148">career</text></g>
<g><rect class="label-bg" x="705" y="210" width="78" height="25"/><text class="path-label" x="716" y="228">direct</text></g>
<g><rect class="label-bg" x="365" y="302" width="82" height="25"/><text class="path-label" x="376" y="320">support</text></g>
<g><rect class="label-bg" x="1040" y="304" width="104" height="25"/><text class="path-label" x="1051" y="322">value route</text></g>
<g><rect class="label-bg" x="640" y="458" width="170" height="25"/><text class="path-label" x="651" y="476">service-value system</text></g>

<g class="node selected" id="node-asr" onclick="selectNode('asr')"><ellipse cx="150" cy="205" rx="128" ry="62" fill="#fff" stroke="#d9d2dd"/><text x="150" y="191" text-anchor="middle">ABILITY TO</text><text x="150" y="209" text-anchor="middle">SELF-REGULATE</text><text x="150" y="227" text-anchor="middle">ASR</text></g>
<g class="node" id="node-uss" onclick="selectNode('uss')"><ellipse cx="150" cy="372" rx="128" ry="62" fill="#fff" stroke="#d9d2dd"/><text x="150" y="358" text-anchor="middle">UNIVERSITY</text><text x="150" y="376" text-anchor="middle">SUPPORT</text><text x="150" y="394" text-anchor="middle">SERVICES</text></g>
<g class="node" id="node-fci" onclick="selectNode('fci')"><ellipse cx="620" cy="150" rx="124" ry="60" fill="#fff" stroke="#d9d2dd"/><text x="620" y="136" text-anchor="middle">FUTURE</text><text x="620" y="154" text-anchor="middle">CAREER</text><text x="620" y="172" text-anchor="middle">IMPACT</text></g>
<g class="node" id="node-lms" onclick="selectNode('lms')"><ellipse cx="920" cy="400" rx="124" ry="58" fill="#fff" stroke="#d9d2dd"/><text x="920" y="386" text-anchor="middle">LEARNING</text><text x="920" y="404" text-anchor="middle">MANAGEMENT</text><text x="920" y="422" text-anchor="middle">SYSTEM</text></g>
<g class="node value-glow" id="node-pvol" onclick="selectNode('pvol')"><ellipse cx="1320" cy="280" rx="124" ry="70" fill="#fff" stroke="#d9d2dd"/><text x="1320" y="255" text-anchor="middle">PERCEIVED</text><text x="1320" y="273" text-anchor="middle">VALUE OF</text><text x="1320" y="291" text-anchor="middle">REMOTE ACCESS</text><text x="1320" y="309" text-anchor="middle">ONLINE LEARNING</text></g>
</svg><div class="legend"><span>click nodes</span><span>solid = significant</span><span>faded = weaker/non-significant</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Value model</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Ability to self-regulate</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">perceived value</span><span class="tag">remote access learning</span><span class="tag">SEM</span></div></div></section>
</main>
<script>
const nodeData={asr:{title:'Ability to self-regulate',text:'Self-regulation reflects motivation, concentration and the ability to follow a clear study plan during remote access online learning. It directly predicts perceived value and future career impact.',quote:'Learners who could regulate themselves were more able to derive value from the disrupted learning environment.'},uss:{title:'University support services',text:'University support services include administrative, technical and faculty support. Support directly predicts perceived value, future career impact and positive appraisal of the LMS.',quote:'Institutional support becomes part of the value proposition when students are physically distant from campus.'},fci:{title:'Future career impact',text:'Future career impact captures whether online education was perceived as not harming, or potentially enhancing, later employment and career opportunities.',quote:'Career appraisal is a major bridge between pandemic-era learning and perceived educational value.'},lms:{title:'Learning management system',text:'The LMS was appraised as sufficient, easy to use and usable without problem. In the tested model, LMS pathways to perceived value were not significant, isolating technology from the stronger interpersonal and regulatory predictors.',quote:'Technology matters, but in this model it did not carry the main value pathway.'},pvol:{title:'Perceived value of remote access online learning',text:'PVOL is the final criterion: whether remote access online learning was useful, comprehensive and able to satisfy learning needs. The tested model accounted for 73.1% of the variance.',quote:'Perceived value emerges from a give-get relationship between student-as-consumer and university-as-service-provider.'}};
const modeData={model:{title:'Value model',text:'This view models perceived value as an outcome of learner regulation, institutional support and career appraisal. The strongest explanatory structure converges on PVOL as the final value node.',metrics:[['PVOL variance explained',73],['Career impact pathway',40],['Self-regulation direct path',37],['Support services direct path',33]]},paths:{title:'Validated pathways',text:'The solid animated routes represent supported paths: ASR and USS predict both career impact and perceived value; USS predicts LMS; and career impact predicts perceived value. Faded paths mark weaker or non-significant LMS-related routes.',metrics:[['Supported hypotheses',75],['ASR to FCI',41],['USS to FCI',41],['USS to LMS',39]]},practice:{title:'Post-pandemic view',text:'This view emphasizes the practical conclusion: student value in remote access learning depends less on technology alone and more on self-regulation, meaningful support and alignment with future career relevance.',metrics:[['Promote self-regulation',86],['Strengthen support services',82],['Connect learning to careers',78],['Avoid tech-only solutions',64]]}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${value}%"></span></div></div>`).join('');sendHeight()}
function sendHeight(){var wrap=document.getElementById('wrap');if(!wrap||!window.parent){return}var h=Math.ceil(wrap.getBoundingClientRect().height)+2;window.parent.postMessage({type:'resize',source:'rivers-adaptive-learning-value-system',height:h},'*')}
function queueHeight(){requestAnimationFrame(function(){requestAnimationFrame(sendHeight)})}
setMode('model');selectNode('asr');window.addEventListener('load',queueHeight);window.addEventListener('resize',queueHeight);if('ResizeObserver' in window){new ResizeObserver(queueHeight).observe(document.getElementById('wrap'))}queueHeight();
</script>
</body></html>
