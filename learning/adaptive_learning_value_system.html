<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adaptive Learning Value System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1080px;margin:0 auto;padding:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;justify-content:center}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.canvas{height:430px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}.system{display:block;width:100%;height:430px}.node{cursor:pointer}.node circle,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover circle,.node.selected circle,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:12px;font-weight:700}.flow{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:7 10;opacity:.50;animation:dash 7s linear infinite}.flow.orange{stroke:var(--orange);opacity:.58}.flow.weak{stroke:var(--muted);stroke-width:1.4;opacity:.25;stroke-dasharray:4 10}.flow.light{stroke-width:1.4;opacity:.18}.pulse{fill:var(--accent);opacity:.76;animation:pulse 2.8s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.30;animation-delay:1.1s}.value-glow{animation:glow 3.6s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.20}50%{r:7;opacity:.88}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.20))}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:13px;fill:var(--muted);font-weight:600}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:11px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:5px 8px;background:var(--orange)}.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;min-height:150px}.card.soft{background:var(--soft)}.small{font-size:11px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:7px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px;line-height:1.25}.card-text{font-size:14px;line-height:1.42;margin:0;color:var(--text)}.quote{font-size:13.5px;line-height:1.5;border-left:2px solid var(--accent);padding-left:11px;margin:8px 0 0;color:var(--text)}.metric{margin:0 0 9px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin:0 0 5px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;background:#fff;font-family:'DM Mono','Courier New',monospace}@media(max-width:860px){.canvas{height:390px}.system{height:390px}.info-grid{grid-template-columns:1fr}.node text{font-size:11px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap">
<div class="controls"><button id="btn-model" class="active" onclick="setMode('model')">Value model</button><button id="btn-paths" onclick="setMode('paths')">Validated pathways</button><button id="btn-practice" onclick="setMode('practice')">Post-pandemic view</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1040 430" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Adaptive learning value structural model">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#520671"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e05c2a"/></marker><marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9a9890"/></marker></defs>
<text class="side-label" x="82" y="50">learner / institution</text><text class="side-label" x="372" y="50">career appraisal</text><text class="side-label" x="550" y="406">technology interface</text><text class="side-label" x="796" y="50">perceived value</text>
<path class="flow" marker-end="url(#arrow)" d="M206 130 C275 112 314 100 368 112"/>
<path class="flow" marker-end="url(#arrow)" d="M206 148 C380 168 636 182 786 207"/>
<path class="flow weak" marker-end="url(#arrowGrey)" d="M198 174 C296 242 424 312 548 318"/>
<path class="flow orange" marker-end="url(#arrowOrange)" d="M214 285 C300 245 322 184 368 145"/>
<path class="flow orange" marker-end="url(#arrowOrange)" d="M214 304 C370 292 638 252 786 225"/>
<path class="flow orange" marker-end="url(#arrowOrange)" d="M214 322 C306 352 446 346 548 334"/>
<path class="flow orange" marker-end="url(#arrowOrange)" d="M518 136 C610 152 710 172 786 205"/>
<path class="flow weak" marker-end="url(#arrowGrey)" d="M682 324 C728 292 754 258 786 236"/>
<path class="flow light" d="M890 260 C745 370 342 372 130 330"/>
<circle class="pulse" cx="290" cy="116" r="5"/><circle class="pulse" cx="496" cy="168" r="5"/><circle class="pulse orange" cx="308" cy="248" r="5"/><circle class="pulse orange" cx="628" cy="252" r="5"/><circle class="pulse faint" cx="445" cy="296" r="5"/>
<g class="node selected" id="node-asr" onclick="selectNode('asr')"><ellipse cx="130" cy="145" rx="78" ry="54" fill="#fff" stroke="#d9d2dd"/><text x="130" y="132" text-anchor="middle">ABILITY TO</text><text x="130" y="149" text-anchor="middle">SELF-REGULATE</text><text x="130" y="166" text-anchor="middle">ASR</text></g>
<g class="node" id="node-uss" onclick="selectNode('uss')"><ellipse cx="130" cy="310" rx="84" ry="56" fill="#fff" stroke="#d9d2dd"/><text x="130" y="297" text-anchor="middle">UNIVERSITY</text><text x="130" y="314" text-anchor="middle">SUPPORT</text><text x="130" y="331" text-anchor="middle">SERVICES</text></g>
<g class="node" id="node-fci" onclick="selectNode('fci')"><ellipse cx="446" cy="126" rx="78" ry="54" fill="#fff" stroke="#d9d2dd"/><text x="446" y="113" text-anchor="middle">FUTURE</text><text x="446" y="130" text-anchor="middle">CAREER</text><text x="446" y="147" text-anchor="middle">IMPACT</text></g>
<g class="node" id="node-lms" onclick="selectNode('lms')"><ellipse cx="626" cy="326" rx="82" ry="54" fill="#fff" stroke="#d9d2dd"/><text x="626" y="313" text-anchor="middle">LEARNING</text><text x="626" y="330" text-anchor="middle">MANAGEMENT</text><text x="626" y="347" text-anchor="middle">SYSTEM</text></g>
<g class="node value-glow" id="node-pvol" onclick="selectNode('pvol')"><ellipse cx="872" cy="216" rx="94" ry="62" fill="#fff" stroke="#d9d2dd"/><text x="872" y="198" text-anchor="middle">PERCEIVED</text><text x="872" y="215" text-anchor="middle">VALUE OF</text><text x="872" y="232" text-anchor="middle">REMOTE ACCESS</text><text x="872" y="249" text-anchor="middle">ONLINE LEARNING</text></g>
</svg><div class="legend"><span>click nodes</span><span>solid = significant</span><span>faded = non-significant</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Value model</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Ability to self-regulate</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">perceived value</span><span class="tag">remote access learning</span><span class="tag">SEM</span></div></div></section>
</main>
<script>
const nodeData={asr:{title:'Ability to self-regulate',text:'Self-regulation reflects motivation, concentration and the ability to follow a clear study plan during remote access online learning. It directly predicts perceived value and future career impact.',quote:'Learners who could regulate themselves were more able to derive value from the disrupted learning environment.'},uss:{title:'University support services',text:'University support services include administrative, technical and faculty support. Support directly predicts perceived value, future career impact and positive appraisal of the LMS.',quote:'Institutional support becomes part of the value proposition when students are physically distant from campus.'},fci:{title:'Future career impact',text:'Future career impact captures whether online education was perceived as not harming, or potentially enhancing, later employment and career opportunities.',quote:'Career appraisal is a major bridge between pandemic-era learning and perceived educational value.'},lms:{title:'Learning management system',text:'The LMS was appraised as sufficient, easy to use and usable without problem. In the tested model, LMS pathways to perceived value were not significant, isolating technology from the stronger interpersonal and regulatory predictors.',quote:'Technology matters, but in this model it did not carry the main value pathway.'},pvol:{title:'Perceived value of remote access online learning',text:'PVOL is the final criterion: whether remote access online learning was useful, comprehensive and able to satisfy learning needs. The tested model accounted for 73.1% of the variance.',quote:'Perceived value emerges from a give-get relationship between student-as-consumer and university-as-service-provider.'}};
const modeData={model:{title:'Value model',text:'This view models perceived value as an outcome of learner regulation, institutional support and career appraisal. The strongest explanatory structure converges on PVOL as the final value node.',metrics:[['PVOL variance explained',73],['Career impact pathway',40],['Self-regulation direct path',37],['Support services direct path',33]]},paths:{title:'Validated pathways',text:'The solid animated routes represent supported paths: ASR and USS predict both career impact and perceived value; USS predicts LMS; and career impact predicts perceived value. Faded paths mark non-significant LMS-related routes.',metrics:[['Supported hypotheses',75],['ASR → FCI',41],['USS → FCI',41],['USS → LMS',39]]},practice:{title:'Post-pandemic view',text:'This view emphasizes the practical conclusion: student value in remote access learning depends less on technology alone and more on self-regulation, meaningful support and alignment with future career relevance.',metrics:[['Promote self-regulation',86],['Strengthen support services',82],['Connect learning to careers',78],['Avoid tech-only solutions',64]]}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${value}%"></span></div></div>`).join('');sendHeight()}
setMode('model');selectNode('asr');function sendHeight(){window.parent.postMessage({type:'resize',source:'rivers-adaptive-learning-value-system',height:document.documentElement.scrollHeight},'*')}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);setInterval(sendHeight,1200);
</script>
</body></html>
