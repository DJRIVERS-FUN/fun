<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metacognitive Learning System Centered</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden;width:100%}
.wrap{width:100%;max-width:none;margin:0;padding:0}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;justify-content:center}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 11px;border-radius:8px;font-size:12px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}
button.active{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{transform:translateY(-1px);border-color:var(--accent)}
.canvas{height:535px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:8px}
.system{display:block;width:100%;height:535px}
.node{cursor:pointer}
.node ellipse{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.05))}
.node:hover ellipse,.node.selected ellipse{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}
.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:13px;font-weight:700;letter-spacing:.01em}
.layer-label,.path-label,.legend{font-family:'DM Mono','Courier New',monospace}
.layer-label{font-size:14px;fill:#d97706;letter-spacing:.055em}
.layer-rule{stroke:#eee9e5;stroke-width:1}
.path{fill:none;stroke:var(--accent);stroke-width:2.35;stroke-linecap:round;stroke-dasharray:8 12;opacity:.50;animation:dash 9s linear infinite}
.path.light{stroke:#d8d2dc;stroke-width:1.45;opacity:.34;stroke-dasharray:5 10;animation:dash 11s linear infinite}
.path.feedback{stroke:var(--orange);stroke-width:1.9;opacity:.44;stroke-dasharray:4 9;animation:dash 13s linear infinite}
.path-label{font-size:12px;fill:var(--muted);font-weight:600}.label-bg{fill:#fff;stroke:#eee9e5;stroke-width:1;rx:8;ry:8;opacity:.94}
@keyframes dash{to{stroke-dashoffset:-180}}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:4px 7px;background:var(--orange)}
.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;min-height:auto}.card.soft{background:var(--soft)}.small{font-size:10px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:13px;font-weight:700;color:var(--accent);margin:0 0 5px;line-height:1.2}.card-text{font-size:13px;line-height:1.36;margin:0;color:var(--text)}.quote{font-size:12px;line-height:1.38;border-left:2px solid var(--accent);padding-left:9px;margin:6px 0 0;color:var(--text)}.metric{margin:0 0 6px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;margin:0 0 4px;font-family:'DM Mono','Courier New',monospace}.bar{height:5px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 6px;background:#fff;font-family:'DM Mono','Courier New',monospace}
@media(max-width:860px){.canvas{height:455px}.system{height:455px}.info-grid{grid-template-columns:1fr}.node text{font-size:12px}.controls{justify-content:flex-start}}
@media(max-width:560px){.canvas{height:410px}.system{height:410px}.controls button{font-size:11px;padding:7px 9px}.node text{font-size:11px}}
</style>
</head>
<body>
<main class="wrap" id="wrap">
<div class="controls"><button id="btn-effective" class="active" onclick="setMode('effective')">Effective learners</button><button id="btn-ineffective" onclick="setMode('ineffective')">Ineffective learners</button><button id="btn-balanced" onclick="setMode('balanced')">System view</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1440 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Metacognitive learning system diagram">
<text class="layer-label" x="80" y="38">CONDITIONS</text><line class="layer-rule" x1="80" y1="52" x2="350" y2="52"/>
<text class="layer-label" x="475" y="38">SELF-APPRAISAL</text><line class="layer-rule" x1="475" y1="52" x2="740" y2="52"/>
<text class="layer-label" x="790" y="38">REGULATION</text><line class="layer-rule" x1="790" y1="52" x2="1045" y2="52"/>
<text class="layer-label" x="1135" y="38">ADAPTIVE OUTCOMES</text><line class="layer-rule" x1="1135" y1="52" x2="1370" y2="52"/>

<path class="path" d="M260 280 C355 280 415 280 505 280"/>
<path class="path" d="M720 280 C770 280 805 280 860 280"/>
<path class="path" d="M1050 280 C1110 280 1155 280 1218 280"/>
<path class="path light" d="M624 173 C660 205 670 232 672 280"/>
<path class="path light" d="M624 387 C660 355 670 328 672 280"/>
<path class="path light" d="M952 178 C940 214 938 248 948 280"/>
<path class="path feedback" d="M1218 342 C1045 520 388 520 260 342"/>
<path class="path feedback" d="M1218 218 C1045 86 390 86 260 218"/>

<g><rect class="label-bg" x="365" y="257" width="92" height="25"/><text class="path-label" x="376" y="275">interpret</text></g>
<g><rect class="label-bg" x="760" y="257" width="82" height="25"/><text class="path-label" x="771" y="275">regulate</text></g>
<g><rect class="label-bg" x="1090" y="257" width="78" height="25"/><text class="path-label" x="1101" y="275">adapt</text></g>
<g><rect class="label-bg" x="618" y="458" width="152" height="25"/><text class="path-label" x="629" y="476">recursive feedback</text></g>

<g class="node selected" id="node-environment" onclick="selectNode('environment')"><ellipse cx="150" cy="280" rx="112" ry="56" fill="#fff" stroke="#d9d2dd"/><text x="150" y="275" text-anchor="middle">ONLINE</text><text x="150" y="293" text-anchor="middle">CONSTRAINT</text></g>
<g class="node" id="node-meta" onclick="selectNode('meta')"><ellipse cx="612" cy="280" rx="118" ry="58" fill="#fff" stroke="#d9d2dd"/><text x="612" y="275" text-anchor="middle">METACOGNITIVE</text><text x="612" y="293" text-anchor="middle">KNOWLEDGE</text></g>
<g class="node" id="node-self" onclick="selectNode('self')"><ellipse cx="612" cy="145" rx="112" ry="52" fill="#fff" stroke="#d9d2dd"/><text x="612" y="140" text-anchor="middle">ACADEMIC</text><text x="612" y="158" text-anchor="middle">SELF-CONCEPT</text></g>
<g class="node" id="node-formal" onclick="selectNode('formal')"><ellipse cx="612" cy="415" rx="108" ry="50" fill="#fff" stroke="#d9d2dd"/><text x="612" y="410" text-anchor="middle">FORMAL</text><text x="612" y="428" text-anchor="middle">ASSESSMENT</text></g>
<g class="node" id="node-regulation" onclick="selectNode('regulation')"><ellipse cx="958" cy="280" rx="110" ry="56" fill="#fff" stroke="#d9d2dd"/><text x="958" y="275" text-anchor="middle">SELF</text><text x="958" y="293" text-anchor="middle">REGULATION</text></g>
<g class="node" id="node-affect" onclick="selectNode('affect')"><ellipse cx="958" cy="145" rx="104" ry="50" fill="#fff" stroke="#d9d2dd"/><text x="958" y="140" text-anchor="middle">AFFECT</text><text x="958" y="158" text-anchor="middle">EMOTION</text></g>
<g class="node" id="node-transform" onclick="selectNode('transform')"><ellipse cx="958" cy="415" rx="116" ry="50" fill="#fff" stroke="#d9d2dd"/><text x="958" y="410" text-anchor="middle">TRANSFORM.</text><text x="958" y="428" text-anchor="middle">AWARENESS</text></g>
<g class="node" id="node-adaptation" onclick="selectNode('adaptation')"><ellipse cx="1320" cy="280" rx="116" ry="58" fill="#fff" stroke="#d9d2dd"/><text x="1320" y="275" text-anchor="middle">ADAPTIVE</text><text x="1320" y="293" text-anchor="middle">OUTCOMES</text></g>
</svg><div class="legend"><span>click nodes</span><span>toggle learner profile</span><span>recursive feedback model</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Effective learner profile</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Online constraint</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">THEMATIC DISTRIBUTION</div><div id="metrics"></div><div class="tag-row"><span class="tag">thematic analysis</span><span class="tag">VR collaboration</span><span class="tag">academic self-concept</span></div></div></section>
</main>
<script>
const nodeData={environment:{title:'Online constraint',text:'Socially distanced online learning changes the conditions under which learners must organize attention, motivation, time, communication and self-monitoring.',quote:'Learner discourse points to the home environment as both a resource and a source of difficulty.'},meta:{title:'Metacognitive knowledge',text:'Learners hold beliefs about themselves as cognitive processors. These beliefs shape how they interpret learning demands and explain success or difficulty.',quote:'Self-awareness functions as a feedback structure for future learning behaviour.'},self:{title:'Academic self-concept',text:'Academic self-concept refers to learner self-perception within an achievement context. In this system, it is shaped by grades, comparison, effort, emotion and perceived control.',quote:'Learners often explain the self through achievement indicators and personal routines.'},regulation:{title:'Self-regulation',text:'Self-regulation includes planning, goal setting, reviewing, time management, self-control and resource use. It is the most actionable point for pedagogical intervention.',quote:'Effective learning becomes visible as a sequence of managed behaviours.'},adaptation:{title:'Adaptive outcomes',text:'Adaptive outcomes emerge when learners use experience to revise strategies, reinterpret difficulty and act differently in future learning situations.',quote:'The system becomes developmental when reflection changes subsequent behaviour.'},formal:{title:'Formal assessment',text:'Grades, GPA and credits operate as powerful self-appraisal markers. The risk is that formal outcomes may be mistaken for the full meaning of learning.',quote:'Assessment indicators can validate or destabilize learner identity.'},affect:{title:'Affect and emotion',text:'Interest, motivation, fear, stress and mood shape the learner’s ability to sustain effort and regulate behaviour in online conditions.',quote:'Emotional attribution is especially visible when learners describe difficulty.'},transform:{title:'Transformative awareness',text:'Transformative awareness appears when learners recognize the need to change approach based on prior experience, deeper understanding or knowledge transfer.',quote:'Awareness becomes transformative only when it begins to guide action.'}};
const modeData={effective:{title:'Effective learner profile',text:'This state emphasizes structured planning, active monitoring, strategic resource use and the use of learning experience as feedback for future adjustment.',metrics:[['Formal assessment',54],['Self-regulation',30],['Transformative awareness',8],['Affect and emotion',6]]},ineffective:{title:'Ineffective learner profile',text:'This state emphasizes fragile routines, dependence on mood or motivation, difficulty managing time and a tendency to interpret formal outcomes as evidence of learner status.',metrics:[['Formal assessment',35],['Self-regulation',35],['Affect and emotion',17],['Transformative awareness',14]]},balanced:{title:'System view',text:'This view treats learning as a recursive system: self-beliefs shape regulation, regulation shapes behaviour, behaviour generates outcomes and outcomes feed back into self-appraisal.',metrics:[['Self-appraisal cycle',76],['Regulatory pathway',65],['Assessment pressure',52],['Adaptive feedback',44]]}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${value}%"></span></div></div>`).join('');sendHeight()}
function sendHeight(){var wrap=document.getElementById('wrap');if(!wrap||!window.parent){return}var h=Math.ceil(wrap.getBoundingClientRect().height)+2;window.parent.postMessage({type:'resize',source:'rivers-learning-system-centered',height:h},'*')}
function queueHeight(){requestAnimationFrame(function(){requestAnimationFrame(sendHeight)})}
setMode('effective');selectNode('environment');window.addEventListener('load',queueHeight);window.addEventListener('resize',queueHeight);if('ResizeObserver' in window){new ResizeObserver(queueHeight).observe(document.getElementById('wrap'))}queueHeight();
</script>
</body></html>
