<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metacognitive Learning System Centered</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1080px;margin:0 auto;padding:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;justify-content:center}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.canvas{height:430px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}.system{display:block;width:100%;height:430px}.node{cursor:pointer}.node circle{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover circle,.node.selected circle{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:12px;font-weight:700}.flow{fill:none;stroke:var(--accent);stroke-width:2.3;stroke-linecap:round;stroke-dasharray:7 10;opacity:.45;animation:dash 7s linear infinite}.flow.light{stroke-width:1.4;opacity:.22}@keyframes dash{to{stroke-dashoffset:-180}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:11px;fill:var(--muted)}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:11px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:5px 8px;background:var(--orange)}.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;min-height:150px}.card.soft{background:var(--soft)}.small{font-size:11px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:7px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px;line-height:1.25}.card-text{font-size:14px;line-height:1.42;margin:0;color:var(--text)}.quote{font-size:13.5px;line-height:1.5;border-left:2px solid var(--accent);padding-left:11px;margin:8px 0 0;color:var(--text)}.metric{margin:0 0 9px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin:0 0 5px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;background:#fff;font-family:'DM Mono','Courier New',monospace}@media(max-width:860px){.canvas{height:390px}.system{height:390px}.info-grid{grid-template-columns:1fr}.node text{font-size:11px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap">
<div class="controls"><button id="btn-effective" class="active" onclick="setMode('effective')">Effective learners</button><button id="btn-ineffective" onclick="setMode('ineffective')">Ineffective learners</button><button id="btn-balanced" onclick="setMode('balanced')">System view</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1040 430" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Metacognitive learning system diagram">
<path class="flow" d="M178 215 C240 215 265 215 312 215"/><path class="flow" d="M412 215 C455 215 475 215 512 215"/><path class="flow" d="M608 215 C650 215 670 215 712 215"/><path class="flow" d="M808 215 C850 215 870 215 912 215"/>
<path class="flow light" d="M920 245 C770 365 270 365 120 245"/><path class="flow light" d="M120 185 C270 65 770 65 920 185"/>
<text class="side-label" x="124" y="112">constraint</text><text class="side-label" x="333" y="112">self-appraisal</text><text class="side-label" x="535" y="112">regulation</text><text class="side-label" x="748" y="112">adaptation</text><text class="side-label" x="485" y="355">recursive feedback</text>
<g class="node selected" id="node-environment" onclick="selectNode('environment')"><circle cx="120" cy="215" r="56" fill="#fff" stroke="#d9d2dd"/><text x="120" y="209" text-anchor="middle">ONLINE</text><text x="120" y="226" text-anchor="middle">CONSTRAINT</text></g>
<g class="node" id="node-meta" onclick="selectNode('meta')"><circle cx="360" cy="215" r="66" fill="#fff" stroke="#d9d2dd"/><text x="360" y="209" text-anchor="middle">METACOGNITIVE</text><text x="360" y="226" text-anchor="middle">KNOWLEDGE</text></g>
<g class="node" id="node-self" onclick="selectNode('self')"><circle cx="560" cy="215" r="70" fill="#fff" stroke="#d9d2dd"/><text x="560" y="209" text-anchor="middle">ACADEMIC</text><text x="560" y="226" text-anchor="middle">SELF-CONCEPT</text></g>
<g class="node" id="node-regulation" onclick="selectNode('regulation')"><circle cx="760" cy="215" r="66" fill="#fff" stroke="#d9d2dd"/><text x="760" y="209" text-anchor="middle">SELF</text><text x="760" y="226" text-anchor="middle">REGULATION</text></g>
<g class="node" id="node-adaptation" onclick="selectNode('adaptation')"><circle cx="960" cy="215" r="56" fill="#fff" stroke="#d9d2dd"/><text x="960" y="209" text-anchor="middle">ADAPTIVE</text><text x="960" y="226" text-anchor="middle">OUTCOMES</text></g>
<g class="node" id="node-formal" onclick="selectNode('formal')"><circle cx="460" cy="72" r="44" fill="#fff" stroke="#d9d2dd"/><text x="460" y="68" text-anchor="middle">FORMAL</text><text x="460" y="85" text-anchor="middle">ASSESS.</text></g>
<g class="node" id="node-affect" onclick="selectNode('affect')"><circle cx="665" cy="72" r="44" fill="#fff" stroke="#d9d2dd"/><text x="665" y="68" text-anchor="middle">AFFECT</text><text x="665" y="85" text-anchor="middle">EMOTION</text></g>
<g class="node" id="node-transform" onclick="selectNode('transform')"><circle cx="665" cy="355" r="48" fill="#fff" stroke="#d9d2dd"/><text x="665" y="351" text-anchor="middle">TRANSFORM.</text><text x="665" y="368" text-anchor="middle">AWARENESS</text></g>
</svg><div class="legend"><span>click nodes</span><span>toggle learner profile</span><span>recursive feedback model</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Effective learner profile</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Online constraint</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">THEMATIC DISTRIBUTION</div><div id="metrics"></div><div class="tag-row"><span class="tag">thematic analysis</span><span class="tag">VR collaboration</span><span class="tag">academic self-concept</span></div></div></section>
</main>
<script>
const nodeData={environment:{title:'Online constraint',text:'Socially distanced online learning changes the conditions under which learners must organize attention, motivation, time, communication and self-monitoring.',quote:'Learner discourse points to the home environment as both a resource and a source of difficulty.'},meta:{title:'Metacognitive knowledge',text:'Learners hold beliefs about themselves as cognitive processors. These beliefs shape how they interpret learning demands and explain success or difficulty.',quote:'Self-awareness functions as a feedback structure for future learning behaviour.'},self:{title:'Academic self-concept',text:'Academic self-concept refers to learner self-perception within an achievement context. In this system, it is shaped by grades, comparison, effort, emotion and perceived control.',quote:'Learners often explain the self through achievement indicators and personal routines.'},regulation:{title:'Self-regulation',text:'Self-regulation includes planning, goal setting, reviewing, time management, self-control and resource use. It is the most actionable point for pedagogical intervention.',quote:'Effective learning becomes visible as a sequence of managed behaviours.'},adaptation:{title:'Adaptive outcomes',text:'Adaptive outcomes emerge when learners use experience to revise strategies, reinterpret difficulty and act differently in future learning situations.',quote:'The system becomes developmental when reflection changes subsequent behaviour.'},formal:{title:'Formal assessment',text:'Grades, GPA and credits operate as powerful self-appraisal markers. The risk is that formal outcomes may be mistaken for the full meaning of learning.',quote:'Assessment indicators can validate or destabilize learner identity.'},affect:{title:'Affect and emotion',text:'Interest, motivation, fear, stress and mood shape the learner’s ability to sustain effort and regulate behaviour in online conditions.',quote:'Emotional attribution is especially visible when learners describe difficulty.'},transform:{title:'Transformative awareness',text:'Transformative awareness appears when learners recognize the need to change approach based on prior experience, deeper understanding or knowledge transfer.',quote:'Awareness becomes transformative only when it begins to guide action.'}};
const modeData={effective:{title:'Effective learner profile',text:'This state emphasizes structured planning, active monitoring, strategic resource use and the use of learning experience as feedback for future adjustment.',metrics:[['Formal assessment',54],['Self-regulation',30],['Transformative awareness',8],['Affect and emotion',6]]},ineffective:{title:'Ineffective learner profile',text:'This state emphasizes fragile routines, dependence on mood or motivation, difficulty managing time and a tendency to interpret formal outcomes as evidence of learner status.',metrics:[['Formal assessment',35],['Self-regulation',35],['Affect and emotion',17],['Transformative awareness',14]]},balanced:{title:'System view',text:'This view treats learning as a recursive system: self-beliefs shape regulation, regulation shapes behaviour, behaviour generates outcomes and outcomes feed back into self-appraisal.',metrics:[['Self-appraisal cycle',76],['Regulatory pathway',65],['Assessment pressure',52],['Adaptive feedback',44]]}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${value}%"></span></div></div>`).join('');sendHeight()}
setMode('effective');selectNode('environment');function sendHeight(){window.parent.postMessage({type:'resize',source:'rivers-learning-system-centered',height:document.documentElement.scrollHeight},'*')}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);setInterval(sendHeight,1200);
</script>
</body></html>
