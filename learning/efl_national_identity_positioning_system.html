<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EFL National Identity Positioning System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden;width:100%}
.wrap{width:100%;max-width:none;margin:0;padding:0}.controls{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;justify-content:center}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 11px;border-radius:8px;font-size:12px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}
.canvas{height:555px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:8px}.system{display:block;width:100%;height:555px}
.node{cursor:pointer}.node ellipse{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.05))}.node:hover ellipse,.node.selected ellipse{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:13px;font-weight:700;letter-spacing:.01em}
.layer-label,.coef,.legend{font-family:'DM Mono','Courier New',monospace}.layer-label{font-size:14px;fill:#d97706;letter-spacing:.055em}.layer-rule{stroke:#eee9e5;stroke-width:1}.path{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linecap:round;stroke-dasharray:8 12;opacity:.50;animation:dash 9s linear infinite}.path.orange{stroke:var(--orange);opacity:.65}.path.grey{stroke:#9a9890;stroke-width:1.45;opacity:.32;stroke-dasharray:5 10;animation:dash 11s linear infinite}.path.light{stroke:#d8d2dc;stroke-width:1.25;opacity:.18}.negative{stroke:var(--orange);stroke-dasharray:4 9}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.coef{font-size:12px;fill:var(--muted);font-weight:600}.coef.em{fill:var(--accent);font-weight:700}.coef.orange{fill:var(--orange);font-weight:700}.label-bg{fill:#fff;stroke:#eee9e5;stroke-width:1;rx:8;ry:8;opacity:.94}.pulse{fill:var(--accent);opacity:.70;animation:pulse 3.2s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.30;animation-delay:1.2s}.glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.84}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.18))}}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:4px 7px;background:var(--orange)}
.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;min-height:auto}.card.soft{background:var(--soft)}.small{font-size:10px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:13px;font-weight:700;color:var(--accent);margin:0 0 5px;line-height:1.2}.card-text{font-size:13px;line-height:1.36;margin:0;color:var(--text)}.quote{font-size:12px;line-height:1.38;border-left:2px solid var(--accent);padding-left:9px;margin:6px 0 0;color:var(--text)}.metric{margin:0 0 6px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;margin:0 0 4px;font-family:'DM Mono','Courier New',monospace}.bar{height:5px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 6px;background:#fff;font-family:'DM Mono','Courier New',monospace}
@media(max-width:860px){.canvas{height:470px}.system{height:470px}.info-grid{grid-template-columns:1fr}.node text{font-size:12px}.controls{justify-content:flex-start}}
@media(max-width:560px){.canvas{height:425px}.system{height:425px}.controls button{font-size:11px;padding:7px 9px}.node text{font-size:11px}}
</style>
</head>
<body>
<main class="wrap" id="wrap">
<div class="controls"><button id="btn-identity" class="active" onclick="setMode('identity')">Identity pathways</button><button id="btn-emotion" onclick="setMode('emotion')">Language emotion</button><button id="btn-positioning" onclick="setMode('positioning')">Opportunity / obstruction</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1440 580" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Japanese identity and English positioning path model">
<text class="layer-label" x="72" y="38">IDENTITY ORIENTATIONS</text><line class="layer-rule" x1="72" y1="52" x2="400" y2="52"/>
<text class="layer-label" x="520" y="38">LANGUAGE ATTACHMENT</text><line class="layer-rule" x1="520" y1="52" x2="820" y2="52"/>
<text class="layer-label" x="1010" y="38">EFL POSITIONING</text><line class="layer-rule" x1="1010" y1="52" x2="1330" y2="52"/>
<path id="p-cnh-ja" class="path" d="M296 292 C390 240 482 176 552 158"/><path id="p-pat-ja" class="path" d="M296 180 C395 160 478 148 552 142"/><path id="p-int-ja" class="path grey" d="M296 412 C410 330 486 230 552 176"/><path id="p-cnh-en" class="path" d="M296 304 C395 322 478 352 552 382"/><path id="p-int-en" class="path" d="M296 412 C410 412 488 410 552 402"/><path id="p-pat-en" class="path negative" d="M296 180 C410 250 486 330 552 392"/><path id="p-nat-obs" class="path orange" d="M296 92 C565 66 920 104 1030 178"/><path id="p-int-opp" class="path orange" d="M296 412 C565 448 900 406 1030 368"/><path id="p-int-obs" class="path negative" d="M296 424 C585 530 920 338 1030 220"/><path id="p-ja-obs" class="path grey" d="M778 150 C888 150 960 166 1030 188"/><path id="p-en-opp" class="path orange" d="M778 392 C888 392 960 382 1030 368"/><path id="p-loop" class="path light" d="M1206 428 C920 548 430 522 150 470"/>
<circle class="pulse orange" cx="610" cy="382" r="5"/><circle class="pulse" cx="610" cy="158" r="5"/><circle class="pulse orange" cx="888" cy="384" r="5"/><circle class="pulse orange" cx="725" cy="84" r="5"/><circle class="pulse faint" cx="900" cy="166" r="5"/>
<g><rect class="label-bg" x="372" y="218" width="68" height="25"/><text class="coef em" x="382" y="236">.38***</text></g><g><rect class="label-bg" x="376" y="154" width="68" height="25"/><text class="coef em" x="386" y="172">.32***</text></g><g><rect class="label-bg" x="372" y="400" width="58" height="25"/><text class="coef em" x="382" y="418">.23**</text></g><g><rect class="label-bg" x="390" y="306" width="68" height="25"/><text class="coef orange" x="400" y="324">-.23**</text></g><g><rect class="label-bg" x="870" y="370" width="68" height="25"/><text class="coef orange" x="880" y="388">.39***</text></g><g><rect class="label-bg" x="740" y="82" width="68" height="25"/><text class="coef orange" x="750" y="100">.38***</text></g><g><rect class="label-bg" x="780" y="452" width="70" height="25"/><text class="coef orange" x="790" y="470">-.34***</text></g>
<g class="node" id="node-nat" onclick="selectNode('nat')"><ellipse cx="150" cy="92" rx="128" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="150" y="88" text-anchor="middle">NATIONALISM</text><text x="150" y="106" text-anchor="middle">dominance</text></g>
<g class="node" id="node-pat" onclick="selectNode('pat')"><ellipse cx="150" cy="180" rx="128" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="150" y="176" text-anchor="middle">PATRIOTISM</text><text x="150" y="194" text-anchor="middle">love of country</text></g>
<g class="node selected glow" id="node-cnh" onclick="selectNode('cnh')"><ellipse cx="150" cy="304" rx="128" ry="52" fill="#fff" stroke="#d9d2dd"/><text x="150" y="292" text-anchor="middle">NATIONAL</text><text x="150" y="310" text-anchor="middle">HERITAGE</text><text x="150" y="328" text-anchor="middle">culture/tradition</text></g>
<g class="node" id="node-int" onclick="selectNode('int')"><ellipse cx="150" cy="412" rx="128" ry="48" fill="#fff" stroke="#d9d2dd"/><text x="150" y="407" text-anchor="middle">INTERNATIONALISM</text><text x="150" y="425" text-anchor="middle">openness</text></g>
<g class="node" id="node-ja" onclick="selectNode('ja')"><ellipse cx="665" cy="150" rx="118" ry="56" fill="#fff" stroke="#d9d2dd"/><text x="665" y="136" text-anchor="middle">JAPANESE</text><text x="665" y="154" text-anchor="middle">EMOTIONAL</text><text x="665" y="172" text-anchor="middle">ATTACHMENT</text></g>
<g class="node" id="node-en" onclick="selectNode('en')"><ellipse cx="665" cy="392" rx="118" ry="56" fill="#fff" stroke="#d9d2dd"/><text x="665" y="378" text-anchor="middle">ENGLISH</text><text x="665" y="396" text-anchor="middle">EMOTIONAL</text><text x="665" y="414" text-anchor="middle">ATTACHMENT</text></g>
<g class="node glow" id="node-opp" onclick="selectNode('opp')"><ellipse cx="1160" cy="368" rx="128" ry="56" fill="#fff" stroke="#d9d2dd"/><text x="1160" y="359" text-anchor="middle">ENGLISH AS</text><text x="1160" y="377" text-anchor="middle">OPPORTUNITY</text></g>
<g class="node" id="node-obs" onclick="selectNode('obs')"><ellipse cx="1160" cy="190" rx="128" ry="56" fill="#fff" stroke="#d9d2dd"/><text x="1160" y="181" text-anchor="middle">ENGLISH AS</text><text x="1160" y="199" text-anchor="middle">OBSTRUCTION</text></g>
</svg><div class="legend"><span>click nodes</span><span>orange = strongest / negative route</span><span>purple = attachment pathway</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Identity pathways</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Commitment to national heritage</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">EFL Japan</span><span class="tag">national identity</span><span class="tag">path analysis</span></div></div></section>
</main>
<script>
const nodeData={nat:{title:'Nationalism',text:'Nationalism reflects a stronger hierarchy-oriented national identity. In the model it directly predicts positioning English as obstruction.',quote:'English becomes threatening when foreign language learning is interpreted through a defensive national frame.'},pat:{title:'Patriotism',text:'Patriotism reflects love of country. It strengthens emotional attachment to Japanese but weakens emotional attachment to English.',quote:'Love of country is not the same as nationalism, but it can make affective connection with English more difficult.'},cnh:{title:'Commitment to national heritage',text:'Commitment to national heritage concerns culture, symbolism, tradition and customs. It supports emotional attachment to both Japanese and English.',quote:'Heritage attachment is the most flexible identity configuration because it permits positive affect toward the local and foreign language.'},int:{title:'Internationalism',text:'Internationalism reflects openness, cooperation and international sharing. It directly predicts English as opportunity and negatively predicts English as obstruction.',quote:'Internationalism positions English as compatible with outward-facing Japanese identity.'},ja:{title:'Japanese emotional attachment',text:'Japanese emotional attachment captures the perceived beauty, intimacy and identity relevance of the Japanese language.',quote:'Attachment to Japanese is central to national identity, but it does not itself mediate English positioning in the final model.'},en:{title:'English emotional attachment',text:'English emotional attachment is the key mediator linking national identity configurations with the positioning of English as opportunity.',quote:'The affective relationship with English determines whether EFL becomes aspiration or resistance.'},opp:{title:'English as opportunity',text:'English as opportunity frames EFL as useful, positive and globally enabling for Japanese learners and society.',quote:'Opportunity emerges when English can be emotionally integrated without threatening Japanese identity.'},obs:{title:'English as obstruction',text:'English as obstruction frames EFL as resentment, threat, cultural damage or wasted effort.',quote:'Obstruction appears when English is positioned as a challenge to national self-concept.'}};
const modeData={identity:{title:'Identity pathways',text:'This view highlights four dimensions of Japanese national identity and their different consequences for EFL positioning.',metrics:[['Nationalism to obstruction',38],['Internationalism to opportunity',40],['Internationalism obstruction reduction',34],['Heritage flexibility',72]],paths:['p-nat-obs','p-pat-ja','p-pat-en','p-cnh-ja','p-cnh-en','p-int-ja','p-int-en','p-int-opp','p-int-obs']},emotion:{title:'Language emotion',text:'This view foregrounds emotional attachment to Japanese and English as affective bridges between identity and language positioning.',metrics:[['CNH to Japanese attachment',54],['CNH to English attachment',38],['Patriotism to Japanese attachment',32],['English attachment to opportunity',39]],paths:['p-cnh-ja','p-cnh-en','p-pat-ja','p-pat-en','p-int-ja','p-int-en','p-en-opp','p-ja-obs']},positioning:{title:'Opportunity / obstruction',text:'This view emphasizes the final contrast: English can be positioned either as opportunity or obstruction depending on identity and affective language attachment.',metrics:[['Opportunity route',40],['Obstruction route',38],['English attachment route',39],['Negative internationalism route',34]],paths:['p-nat-obs','p-int-opp','p-int-obs','p-en-opp','p-loop']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
function sendHeight(){var wrap=document.getElementById('wrap');if(!wrap||!window.parent){return}var h=Math.ceil(wrap.getBoundingClientRect().height)+2;window.parent.postMessage({type:'resize',source:'rivers-efl-national-identity-system',height:h},'*')}
function queueHeight(){requestAnimationFrame(function(){requestAnimationFrame(sendHeight)})}
setMode('identity');selectNode('cnh');window.addEventListener('load',queueHeight);window.addEventListener('resize',queueHeight);if('ResizeObserver' in window){new ResizeObserver(queueHeight).observe(document.getElementById('wrap'))}queueHeight();
</script>
</body></html>
