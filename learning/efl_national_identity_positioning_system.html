<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EFL National Identity Positioning System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1080px;margin:0 auto;padding:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;justify-content:center}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.canvas{height:470px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}.system{display:block;width:100%;height:470px}.node{cursor:pointer}.node ellipse,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:11.2px;font-weight:700}.path{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linecap:round;stroke-dasharray:7 10;opacity:.50;animation:dash 7s linear infinite}.path.orange{stroke:var(--orange);opacity:.66}.path.grey{stroke:var(--muted);stroke-width:1.4;opacity:.28;stroke-dasharray:4 9}.path.light{stroke-width:1.2;opacity:.16}.negative{stroke:var(--orange);stroke-dasharray:3 8}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.pulse{fill:var(--accent);opacity:.72;animation:pulse 2.8s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.32;animation-delay:1.2s}.glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.86}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.20))}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:12.5px;fill:var(--muted);font-weight:600}.coef{font-family:'DM Mono','Courier New',monospace;font-size:10.8px;fill:var(--muted)}.coef.em{fill:var(--accent);font-weight:700}.coef.orange{fill:var(--orange);font-weight:700}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:11px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:5px 8px;background:var(--orange)}.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;min-height:150px}.card.soft{background:var(--soft)}.small{font-size:11px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:7px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px;line-height:1.25}.card-text{font-size:14px;line-height:1.42;margin:0;color:var(--text)}.quote{font-size:13.5px;line-height:1.5;border-left:2px solid var(--accent);padding-left:11px;margin:8px 0 0;color:var(--text)}.metric{margin:0 0 9px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin:0 0 5px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;background:#fff;font-family:'DM Mono','Courier New',monospace}@media(max-width:860px){.canvas{height:420px}.system{height:420px}.info-grid{grid-template-columns:1fr}.node text{font-size:10px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap">
<div class="controls"><button id="btn-identity" class="active" onclick="setMode('identity')">Identity pathways</button><button id="btn-emotion" onclick="setMode('emotion')">Language emotion</button><button id="btn-positioning" onclick="setMode('positioning')">Opportunity / obstruction</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1080 470" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Japanese national identity and English positioning path model">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#520671"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e05c2a"/></marker><marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9a9890"/></marker></defs>
<text class="side-label" x="58" y="50">Japanese national identity</text><text class="side-label" x="410" y="50">language attachment</text><text class="side-label" x="780" y="50">EFL positioning</text>
<path id="p-cnh-ja" class="path" marker-end="url(#arrow)" d="M224 220 C320 174 390 150 470 132"/>
<path id="p-pat-ja" class="path" marker-end="url(#arrow)" d="M224 166 C320 146 390 132 470 122"/>
<path id="p-int-ja" class="path grey" marker-end="url(#arrowGrey)" d="M224 304 C330 250 402 198 470 150"/>
<path id="p-cnh-en" class="path" marker-end="url(#arrow)" d="M224 232 C320 246 390 270 470 292"/>
<path id="p-int-en" class="path" marker-end="url(#arrow)" d="M224 304 C330 306 402 312 470 312"/>
<path id="p-pat-en" class="path negative" marker-end="url(#arrowOrange)" d="M224 166 C318 210 390 260 470 302"/>
<path id="p-nat-obs" class="path orange" marker-end="url(#arrowOrange)" d="M224 96 C458 70 720 108 804 154"/>
<path id="p-int-opp" class="path orange" marker-end="url(#arrowOrange)" d="M224 304 C458 336 700 318 804 292"/>
<path id="p-int-obs" class="path negative" marker-end="url(#arrowOrange)" d="M224 316 C458 400 720 292 804 188"/>
<path id="p-ja-obs" class="path grey" marker-end="url(#arrowGrey)" d="M610 130 C700 132 748 140 804 158"/>
<path id="p-en-opp" class="path orange" marker-end="url(#arrowOrange)" d="M610 304 C700 304 748 300 804 292"/>
<path id="p-loop" class="path light" d="M900 330 C690 428 310 416 120 350"/>
<circle class="pulse orange" cx="500" cy="292" r="5"/><circle class="pulse" cx="500" cy="132" r="5"/><circle class="pulse orange" cx="678" cy="302" r="5"/><circle class="pulse orange" cx="650" cy="84" r="5"/><circle class="pulse faint" cx="660" cy="150" r="5"/>
<text class="coef em" x="330" y="164">.32***</text><text class="coef em" x="330" y="246">.38***</text><text class="coef em" x="340" y="315">.23**</text><text class="coef orange" x="335" y="270">-.23**</text><text class="coef orange" x="632" y="300">.39***</text><text class="coef orange" x="540" y="86">.38***</text><text class="coef orange" x="610" y="365">-.34***</text>
<g class="node" id="node-nat" onclick="selectNode('nat')"><ellipse cx="120" cy="96" rx="92" ry="36" fill="#fff" stroke="#d9d2dd"/><text x="120" y="92" text-anchor="middle">NATIONALISM</text><text x="120" y="109" text-anchor="middle">dominance</text></g>
<g class="node" id="node-pat" onclick="selectNode('pat')"><ellipse cx="120" cy="166" rx="92" ry="36" fill="#fff" stroke="#d9d2dd"/><text x="120" y="162" text-anchor="middle">PATRIOTISM</text><text x="120" y="179" text-anchor="middle">love of country</text></g>
<g class="node selected glow" id="node-cnh" onclick="selectNode('cnh')"><ellipse cx="120" cy="232" rx="92" ry="40" fill="#fff" stroke="#d9d2dd"/><text x="120" y="222" text-anchor="middle">NATIONAL</text><text x="120" y="239" text-anchor="middle">HERITAGE</text><text x="120" y="256" text-anchor="middle">culture/tradition</text></g>
<g class="node" id="node-int" onclick="selectNode('int')"><ellipse cx="120" cy="314" rx="92" ry="40" fill="#fff" stroke="#d9d2dd"/><text x="120" y="304" text-anchor="middle">INTERNATIONALISM</text><text x="120" y="321" text-anchor="middle">openness</text></g>
<g class="node" id="node-ja" onclick="selectNode('ja')"><ellipse cx="542" cy="132" rx="78" ry="48" fill="#fff" stroke="#d9d2dd"/><text x="542" y="119" text-anchor="middle">JAPANESE</text><text x="542" y="136" text-anchor="middle">EMOTIONAL</text><text x="542" y="153" text-anchor="middle">ATTACHMENT</text></g>
<g class="node" id="node-en" onclick="selectNode('en')"><ellipse cx="542" cy="304" rx="78" ry="48" fill="#fff" stroke="#d9d2dd"/><text x="542" y="291" text-anchor="middle">ENGLISH</text><text x="542" y="308" text-anchor="middle">EMOTIONAL</text><text x="542" y="325" text-anchor="middle">ATTACHMENT</text></g>
<g class="node glow" id="node-opp" onclick="selectNode('opp')"><ellipse cx="890" cy="292" rx="92" ry="46" fill="#fff" stroke="#d9d2dd"/><text x="890" y="283" text-anchor="middle">ENGLISH AS</text><text x="890" y="300" text-anchor="middle">OPPORTUNITY</text></g>
<g class="node" id="node-obs" onclick="selectNode('obs')"><ellipse cx="890" cy="166" rx="92" ry="46" fill="#fff" stroke="#d9d2dd"/><text x="890" y="157" text-anchor="middle">ENGLISH AS</text><text x="890" y="174" text-anchor="middle">OBSTRUCTION</text></g>
</svg><div class="legend"><span>click nodes</span><span>orange = obstruction / strongest route</span><span>purple = attachment pathway</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Identity pathways</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Commitment to national heritage</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">EFL Japan</span><span class="tag">national identity</span><span class="tag">path analysis</span></div></div></section>
</main>
<script>
const nodeData={nat:{title:'Nationalism',text:'Nationalism reflects national superiority and dominance. In the model it directly predicts positioning English as obstruction.',quote:'English becomes threatening when foreign language learning is interpreted through a defensive national frame.'},pat:{title:'Patriotism',text:'Patriotism reflects love of country. It strengthens emotional attachment to Japanese but weakens emotional attachment to English.',quote:'Love of country is not the same as nationalism, but it can make affective connection with English more difficult.'},cnh:{title:'Commitment to national heritage',text:'Commitment to national heritage concerns culture, symbolism, tradition and customs. It supports emotional attachment to both Japanese and English.',quote:'Heritage attachment is the most flexible identity configuration because it permits positive affect toward the local and foreign language.'},int:{title:'Internationalism',text:'Internationalism reflects openness, cooperation and international sharing. It directly predicts English as opportunity and negatively predicts English as obstruction.',quote:'Internationalism positions English as compatible with outward-facing Japanese identity.'},ja:{title:'Japanese emotional attachment',text:'Japanese emotional attachment captures the perceived beauty, intimacy and identity relevance of the Japanese language.',quote:'Attachment to Japanese is central to national identity, but it does not itself mediate English positioning in the final model.'},en:{title:'English emotional attachment',text:'English emotional attachment is the key mediator linking national identity configurations with the positioning of English as opportunity.',quote:'The affective relationship with English determines whether EFL becomes aspiration or resistance.'},opp:{title:'English as opportunity',text:'English as opportunity frames EFL as useful, positive and globally enabling for Japanese learners and society.',quote:'Opportunity emerges when English can be emotionally integrated without threatening Japanese identity.'},obs:{title:'English as obstruction',text:'English as obstruction frames EFL as resentment, threat, cultural damage or wasted effort.',quote:'Obstruction appears when English is positioned as a challenge to national self-concept.'}};
const modeData={identity:{title:'Identity pathways',text:'This view highlights four dimensions of Japanese national identity and their different consequences for EFL positioning.',metrics:[['Nationalism → obstruction',38],['Internationalism → opportunity',40],['Internationalism → obstruction reduction',34],['Heritage flexibility',72]],paths:['p-nat-obs','p-pat-ja','p-pat-en','p-cnh-ja','p-cnh-en','p-int-ja','p-int-en','p-int-opp','p-int-obs']},emotion:{title:'Language emotion',text:'This view foregrounds emotional attachment to Japanese and English as affective bridges between identity and language positioning.',metrics:[['CNH → Japanese attachment',54],['CNH → English attachment',38],['Patriotism → Japanese attachment',32],['English attachment → opportunity',39]],paths:['p-cnh-ja','p-cnh-en','p-pat-ja','p-pat-en','p-int-ja','p-int-en','p-en-opp','p-ja-obs']},positioning:{title:'Opportunity / obstruction',text:'This view emphasizes the final contrast: English can be positioned either as opportunity or obstruction depending on identity and affective language attachment.',metrics:[['Opportunity route',40],['Obstruction route',38],['English attachment route',39],['Negative internationalism route',34]],paths:['p-nat-obs','p-int-opp','p-int-obs','p-en-opp','p-loop']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
setMode('identity');selectNode('cnh');function sendHeight(){window.parent.postMessage({type:'resize',source:'rivers-efl-national-identity-system',height:document.documentElement.scrollHeight},'*')}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);setInterval(sendHeight,1200);
</script>
</body></html>
