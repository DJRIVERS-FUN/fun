<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stress Affordance Mediation System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1080px;margin:0 auto;padding:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;justify-content:center}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.canvas{height:430px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}.system{display:block;width:100%;height:430px}.node{cursor:pointer}.node circle,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover circle,.node.selected circle,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:12px;font-weight:700}.flow{fill:none;stroke:var(--accent);stroke-width:2.3;stroke-linecap:round;stroke-dasharray:7 10;opacity:.45;animation:dash 7s linear infinite}.flow.orange{stroke:var(--orange);opacity:.60}.flow.weak{stroke:var(--muted);stroke-width:1.5;opacity:.30;stroke-dasharray:4 9}.flow.light{stroke-width:1.4;opacity:.20}.pulse{fill:var(--orange);opacity:.88;animation:pulse 2.8s ease-in-out infinite}.pulse.purple{fill:var(--accent);opacity:.75;animation-delay:.6s}.pulse.faint{opacity:.35;animation-delay:1.2s}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.25}50%{r:7;opacity:.9}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:13px;fill:var(--muted);font-weight:600}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:11px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:5px 8px;background:var(--orange)}.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;min-height:150px}.card.soft{background:var(--soft)}.small{font-size:11px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:7px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px;line-height:1.25}.card-text{font-size:14px;line-height:1.42;margin:0;color:var(--text)}.quote{font-size:13.5px;line-height:1.5;border-left:2px solid var(--accent);padding-left:11px;margin:8px 0 0;color:var(--text)}.metric{margin:0 0 9px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin:0 0 5px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;background:#fff;font-family:'DM Mono','Courier New',monospace}@media(max-width:860px){.canvas{height:390px}.system{height:390px}.info-grid{grid-template-columns:1fr}.node text{font-size:11px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap">
<div class="controls"><button id="btn-model" class="active" onclick="setMode('model')">Mediation model</button><button id="btn-stress" onclick="setMode('stress')">Stress appraisal</button><button id="btn-practice" onclick="setMode('practice')">Pedagogy view</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1040 430" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Stress mediation pathway from personality to online learning affordance">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#520671"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e05c2a"/></marker></defs>
<text class="side-label" x="72" y="70">personality</text><text class="side-label" x="322" y="70">generalized stress</text><text class="side-label" x="568" y="70">online learning stress</text><text class="side-label" x="820" y="70">affordance</text><text class="side-label" x="384" y="382">stress appraisal mediates personality and online education affordance</text>
<path class="flow" marker-end="url(#arrow)" d="M190 128 C250 128 292 156 332 190"/>
<path class="flow orange" marker-end="url(#arrowOrange)" d="M190 215 C258 215 284 215 332 215"/>
<path class="flow weak" marker-end="url(#arrow)" d="M190 302 C340 306 498 284 572 248"/>
<path class="flow orange" marker-end="url(#arrowOrange)" d="M462 215 C505 215 528 215 572 215"/>
<path class="flow orange" marker-end="url(#arrowOrange)" d="M704 215 C750 215 777 215 820 215"/>
<path class="flow light" d="M880 263 C720 365 312 365 125 318"/>
<path class="flow light" d="M128 95 C310 30 744 34 880 166"/>
<circle class="pulse purple" cx="255" cy="146" r="5"/><circle class="pulse" cx="510" cy="215" r="5"/><circle class="pulse" cx="760" cy="215" r="5"/><circle class="pulse faint" cx="442" cy="300" r="5"/>
<g class="node selected" id="node-con" onclick="selectNode('con')"><rect x="50" y="96" width="140" height="64" rx="12" fill="#fff" stroke="#d9d2dd"/><text x="120" y="122" text-anchor="middle">CONSCIENT.</text><text x="120" y="139" text-anchor="middle">PROTECTIVE</text></g>
<g class="node" id="node-neu" onclick="selectNode('neu')"><rect x="50" y="183" width="140" height="64" rx="12" fill="#fff" stroke="#d9d2dd"/><text x="120" y="209" text-anchor="middle">NEUROTICISM</text><text x="120" y="226" text-anchor="middle">AMPLIFIER</text></g>
<g class="node" id="node-ext" onclick="selectNode('ext')"><rect x="50" y="270" width="140" height="64" rx="12" fill="#fff" stroke="#d9d2dd"/><text x="120" y="296" text-anchor="middle">EXTROVERSION</text><text x="120" y="313" text-anchor="middle">SOCIAL NEED</text></g>
<g class="node" id="node-gls" onclick="selectNode('gls')"><circle cx="398" cy="215" r="66" fill="#fff" stroke="#d9d2dd"/><text x="398" y="201" text-anchor="middle">GENERALIZED</text><text x="398" y="218" text-anchor="middle">LIFE STRESS</text><text x="398" y="235" text-anchor="middle">GLS</text></g>
<g class="node" id="node-ols" onclick="selectNode('ols')"><circle cx="638" cy="215" r="66" fill="#fff" stroke="#d9d2dd"/><text x="638" y="201" text-anchor="middle">ONLINE</text><text x="638" y="218" text-anchor="middle">LEARNING</text><text x="638" y="235" text-anchor="middle">STRESS</text></g>
<g class="node" id="node-aol" onclick="selectNode('aol')"><rect x="820" y="168" width="166" height="94" rx="14" fill="#fff" stroke="#d9d2dd"/><text x="903" y="201" text-anchor="middle">AFFORDANCE</text><text x="903" y="218" text-anchor="middle">OF ONLINE</text><text x="903" y="235" text-anchor="middle">EDUCATION</text></g>
</svg><div class="legend"><span>click nodes</span><span>toggle interpretation</span><span>stress-mediated pathway</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Mediation model</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Conscientiousness</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">personality</span><span class="tag">stress appraisal</span><span class="tag">online affordance</span></div></div></section>
</main>
<script>
const nodeData={con:{title:'Conscientiousness',text:'Conscientiousness operates as a protective trait. It reduces generalized life stress, which then lowers online learning stress and supports a more positive appraisal of socially distanced online education.',quote:'The positive route is indirect: organized, disciplined behaviour mitigates stress and protects affordance.'},neu:{title:'Neuroticism',text:'Neuroticism amplifies generalized life stress and negatively influences the affordance of online education through stress appraisal. It also showed a distinct negative association with online learning stress in the retrimmed model.',quote:'The pathway shows how a stable trait can shape educational experience through stress appraisal.'},ext:{title:'Extroversion',text:'Extroversion has a direct positive relationship with online learning stress. In a socially distanced online environment, the reduced availability of direct social interaction creates a particular stress condition for extroverted students.',quote:'The absence of face-to-face interaction turns sociability into a source of online learning stress.'},gls:{title:'Generalized life stress',text:'Generalized life stress reflects broader pandemic-related difficulty, frustration, loneliness and lack of control. It functions as the superordinate stress pathway in the model.',quote:'Daily life stress carries into the online learning environment.'},ols:{title:'Online learning stress',text:'Online learning stress is the immediate mediator connecting broader stress appraisal to educational affordance. Higher online learning stress strongly reduces the perceived affordance of socially distanced online education.',quote:'Stress inside the learning environment directly constrains perceived educational possibility.'},aol:{title:'Affordance of online education',text:'Affordance refers to the perceived educational possibilities of socially distanced online learning, including flexibility, participation, communication, responsibility and positive learning experience.',quote:'Affordance is not just a technical property of Moodle or online delivery; it emerges between learner, system and stress context.'}};
const modeData={model:{title:'Mediation model',text:'This view emphasizes the central finding: personality does not directly determine the affordance of socially distanced online education. Its influence is mediated through generalized life stress and online learning stress appraisal.',metrics:[['Criterion variance explained',32],['GLS → OLS pathway',74],['OLS → affordance constraint',56],['Conscientiousness protection',16]]},stress:{title:'Stress appraisal',text:'This view highlights stress as an emergent relationship between person and environment. Generalized pandemic stress flows into online learning stress, shaping how students appraise digital learning conditions.',metrics:[['Generalized stress impact',74],['Online learning stress impact',56],['Neuroticism amplification',49],['Extroversion stress route',15]]},practice:{title:'Pedagogy view',text:'This view points to educational design implications: promote self-regulated, conscientious behaviours while providing social interaction for extroverted learners and low-pressure options for students who benefit from reduced direct contact.',metrics:[['Promote self-regulation',86],['Clarify accountability',72],['Support social contact',64],['Reduce stress load',78]]}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${value}%"></span></div></div>`).join('');sendHeight()}
setMode('model');selectNode('con');function sendHeight(){window.parent.postMessage({type:'resize',source:'rivers-stress-affordance-system',height:document.documentElement.scrollHeight},'*')}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);setInterval(sendHeight,1200);
</script>
</body></html>
