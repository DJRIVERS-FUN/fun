<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stress Affordance Mediation System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden;width:100%}
.wrap{width:100%;max-width:none;margin:0;padding:0}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;justify-content:center}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 11px;border-radius:8px;font-size:12px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}
button.active{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{transform:translateY(-1px);border-color:var(--accent)}
.canvas{height:535px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:8px}
.system{display:block;width:100%;height:535px}
.node{cursor:pointer}
.node ellipse,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.05))}
.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}
.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:13px;font-weight:700;letter-spacing:.01em}
.layer-label,.path-label,.legend{font-family:'DM Mono','Courier New',monospace}
.layer-label{font-size:14px;fill:#d97706;letter-spacing:.055em}
.layer-rule{stroke:#eee9e5;stroke-width:1}
.path{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:8 12;opacity:.50;animation:dash 9s linear infinite}
.path.orange{stroke:var(--orange);opacity:.60}
.path.weak{stroke:#d8d2dc;stroke-width:1.45;opacity:.34;stroke-dasharray:5 10;animation:dash 11s linear infinite}
.path.feedback{stroke:var(--orange);stroke-width:1.8;opacity:.34;stroke-dasharray:4 9;animation:dash 13s linear infinite}
.path-label{font-size:12px;fill:var(--muted);font-weight:600}
.label-bg{fill:#fff;stroke:#eee9e5;stroke-width:1;rx:8;ry:8;opacity:.94}
.pulse{fill:var(--orange);opacity:.82;animation:pulse 3.4s ease-in-out infinite}.pulse.purple{fill:var(--accent);opacity:.72;animation-delay:.5s}.pulse.faint{opacity:.35;animation-delay:1.1s}
@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.25}50%{r:7;opacity:.85}}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:4px 7px;background:var(--orange)}
.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;min-height:auto}.card.soft{background:var(--soft)}.small{font-size:10px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:13px;font-weight:700;color:var(--accent);margin:0 0 5px;line-height:1.2}.card-text{font-size:13px;line-height:1.36;margin:0;color:var(--text)}.quote{font-size:12px;line-height:1.38;border-left:2px solid var(--accent);padding-left:9px;margin:6px 0 0;color:var(--text)}.metric{margin:0 0 6px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;margin:0 0 4px;font-family:'DM Mono','Courier New',monospace}.bar{height:5px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 6px;background:#fff;font-family:'DM Mono','Courier New',monospace}
@media(max-width:860px){.canvas{height:455px}.system{height:455px}.info-grid{grid-template-columns:1fr}.node text{font-size:12px}.controls{justify-content:flex-start}}
@media(max-width:560px){.canvas{height:410px}.system{height:410px}.controls button{font-size:11px;padding:7px 9px}.node text{font-size:11px}}
</style>
</head>
<body>
<main class="wrap" id="wrap">
<div class="controls"><button id="btn-model" class="active" onclick="setMode('model')">Mediation model</button><button id="btn-stress" onclick="setMode('stress')">Stress appraisal</button><button id="btn-practice" onclick="setMode('practice')">Pedagogy view</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1440 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Stress mediation pathway from personality to online learning affordance">
<text class="layer-label" x="80" y="38">PERSONALITY TRAITS</text><line class="layer-rule" x1="80" y1="52" x2="350" y2="52"/>
<text class="layer-label" x="470" y="38">GENERAL STRESS</text><line class="layer-rule" x1="470" y1="52" x2="715" y2="52"/>
<text class="layer-label" x="790" y="38">ONLINE LEARNING STRESS</text><line class="layer-rule" x1="790" y1="52" x2="1080" y2="52"/>
<text class="layer-label" x="1170" y="38">PERCEIVED AFFORDANCE</text><line class="layer-rule" x1="1170" y1="52" x2="1380" y2="52"/>

<path class="path" d="M276 150 C360 154 432 198 492 250"/>
<path class="path orange" d="M276 280 C350 280 410 280 492 280"/>
<path class="path weak" d="M276 410 C420 410 690 382 840 328"/>
<path class="path orange" d="M718 280 C775 280 814 280 872 280"/>
<path class="path orange" d="M1078 280 C1140 280 1190 280 1252 280"/>
<path class="path feedback" d="M1252 342 C1040 510 480 510 276 342"/>

<circle class="pulse purple" cx="388" cy="192" r="5"/><circle class="pulse" cx="760" cy="280" r="5"/><circle class="pulse" cx="1138" cy="280" r="5"/><circle class="pulse faint" cx="650" cy="385" r="5"/>

<g><rect class="label-bg" x="350" y="148" width="116" height="25"/><text class="path-label" x="361" y="166">protective</text></g>
<g><rect class="label-bg" x="352" y="257" width="126" height="25"/><text class="path-label" x="363" y="275">amplification</text></g>
<g><rect class="label-bg" x="748" y="257" width="102" height="25"/><text class="path-label" x="759" y="275">transmission</text></g>
<g><rect class="label-bg" x="1120" y="257" width="86" height="25"/><text class="path-label" x="1131" y="275">constraint</text></g>
<g><rect class="label-bg" x="644" y="458" width="160" height="25"/><text class="path-label" x="655" y="476">stress-mediated route</text></g>

<g class="node selected" id="node-con" onclick="selectNode('con')"><rect x="72" y="118" width="156" height="64" rx="12" fill="#fff" stroke="#d9d2dd"/><text x="150" y="144" text-anchor="middle">CONSCIENT.</text><text x="150" y="162" text-anchor="middle">PROTECTIVE</text></g>
<g class="node" id="node-neu" onclick="selectNode('neu')"><rect x="72" y="248" width="156" height="64" rx="12" fill="#fff" stroke="#d9d2dd"/><text x="150" y="274" text-anchor="middle">NEUROTICISM</text><text x="150" y="292" text-anchor="middle">AMPLIFIER</text></g>
<g class="node" id="node-ext" onclick="selectNode('ext')"><rect x="72" y="378" width="156" height="64" rx="12" fill="#fff" stroke="#d9d2dd"/><text x="150" y="404" text-anchor="middle">EXTROVERSION</text><text x="150" y="422" text-anchor="middle">SOCIAL NEED</text></g>
<g class="node" id="node-gls" onclick="selectNode('gls')"><ellipse cx="605" cy="280" rx="116" ry="60" fill="#fff" stroke="#d9d2dd"/><text x="605" y="266" text-anchor="middle">GENERALIZED</text><text x="605" y="284" text-anchor="middle">LIFE STRESS</text><text x="605" y="302" text-anchor="middle">GLS</text></g>
<g class="node" id="node-ols" onclick="selectNode('ols')"><ellipse cx="980" cy="280" rx="120" ry="62" fill="#fff" stroke="#d9d2dd"/><text x="980" y="266" text-anchor="middle">ONLINE</text><text x="980" y="284" text-anchor="middle">LEARNING</text><text x="980" y="302" text-anchor="middle">STRESS</text></g>
<g class="node" id="node-aol" onclick="selectNode('aol')"><ellipse cx="1320" cy="280" rx="120" ry="62" fill="#fff" stroke="#d9d2dd"/><text x="1320" y="266" text-anchor="middle">AFFORDANCE</text><text x="1320" y="284" text-anchor="middle">OF ONLINE</text><text x="1320" y="302" text-anchor="middle">EDUCATION</text></g>
</svg><div class="legend"><span>click nodes</span><span>toggle interpretation</span><span>stress-mediated pathway</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Mediation model</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Conscientiousness</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">personality</span><span class="tag">stress appraisal</span><span class="tag">online affordance</span></div></div></section>
</main>
<script>
const nodeData={con:{title:'Conscientiousness',text:'Conscientiousness operates as a protective trait. It reduces generalized life stress, which then lowers online learning stress and supports a more positive appraisal of socially distanced online education.',quote:'The positive route is indirect: organized, disciplined behaviour mitigates stress and protects affordance.'},neu:{title:'Neuroticism',text:'Neuroticism amplifies generalized life stress and negatively influences the affordance of online education through stress appraisal. It also showed a distinct negative association with online learning stress in the retrimmed model.',quote:'The pathway shows how a stable trait can shape educational experience through stress appraisal.'},ext:{title:'Extroversion',text:'Extroversion has a direct positive relationship with online learning stress. In a socially distanced online environment, the reduced availability of direct social interaction creates a particular stress condition for extroverted students.',quote:'The absence of face-to-face interaction turns sociability into a source of online learning stress.'},gls:{title:'Generalized life stress',text:'Generalized life stress reflects broader pandemic-related difficulty, frustration, loneliness and lack of control. It functions as the superordinate stress pathway in the model.',quote:'Daily life stress carries into the online learning environment.'},ols:{title:'Online learning stress',text:'Online learning stress is the immediate mediator connecting broader stress appraisal to educational affordance. Higher online learning stress strongly reduces the perceived affordance of socially distanced online education.',quote:'Stress inside the learning environment directly constrains perceived educational possibility.'},aol:{title:'Affordance of online education',text:'Affordance refers to the perceived educational possibilities of socially distanced online learning, including flexibility, participation, communication, responsibility and positive learning experience.',quote:'Affordance is not just a technical property of Moodle or online delivery; it emerges between learner, system and stress context.'}};
const modeData={model:{title:'Mediation model',text:'This view emphasizes the central finding: personality does not directly determine the affordance of socially distanced online education. Its influence is mediated through generalized life stress and online learning stress appraisal.',metrics:[['Criterion variance explained',32],['GLS to OLS pathway',74],['OLS to affordance constraint',56],['Conscientiousness protection',16]]},stress:{title:'Stress appraisal',text:'This view highlights stress as an emergent relationship between person and environment. Generalized pandemic stress flows into online learning stress, shaping how students appraise digital learning conditions.',metrics:[['Generalized stress impact',74],['Online learning stress impact',56],['Neuroticism amplification',49],['Extroversion stress route',15]]},practice:{title:'Pedagogy view',text:'This view points to educational design implications: promote self-regulated, conscientious behaviours while providing social interaction for extroverted learners and low-pressure options for students who benefit from reduced direct contact.',metrics:[['Promote self-regulation',86],['Clarify accountability',72],['Support social contact',64],['Reduce stress load',78]]}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${value}%"></span></div></div>`).join('');sendHeight()}
function sendHeight(){var wrap=document.getElementById('wrap');if(!wrap||!window.parent){return}var h=Math.ceil(wrap.getBoundingClientRect().height)+2;window.parent.postMessage({type:'resize',source:'rivers-stress-affordance-system',height:h},'*')}
function queueHeight(){requestAnimationFrame(function(){requestAnimationFrame(sendHeight)})}
setMode('model');selectNode('con');window.addEventListener('load',queueHeight);window.addEventListener('resize',queueHeight);if('ResizeObserver' in window){new ResizeObserver(queueHeight).observe(document.getElementById('wrap'))}queueHeight();
</script>
</body></html>
