<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moodle Acceptance Self-Efficacy System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden;width:100%}
.wrap{width:100%;max-width:none;margin:0;padding:0}.controls{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;justify-content:center}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 11px;border-radius:8px;font-size:12px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}
button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}
.canvas{height:555px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:8px}.system{display:block;width:100%;height:555px}
.node{cursor:pointer}.node ellipse,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.05))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:13px;font-weight:700;letter-spacing:.01em}
.layer-label,.path-label,.coef,.legend{font-family:'DM Mono','Courier New',monospace}.layer-label{font-size:14px;fill:#d97706;letter-spacing:.055em}.layer-rule{stroke:#eee9e5;stroke-width:1}.path{fill:none;stroke:var(--accent);stroke-width:2.35;stroke-linecap:round;stroke-dasharray:8 12;opacity:.50;animation:dash 9s linear infinite}.path.orange{stroke:var(--orange);opacity:.64}.path.grey{stroke:#9a9890;stroke-width:1.45;opacity:.32;stroke-dasharray:5 10;animation:dash 11s linear infinite}.path.light{stroke:#d8d2dc;stroke-width:1.25;opacity:.18}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.path-label,.coef{font-size:12px;fill:var(--muted);font-weight:600}.coef.em{fill:var(--accent);font-weight:700}.coef.orange{fill:var(--orange);font-weight:700}.label-bg{fill:#fff;stroke:#eee9e5;stroke-width:1;rx:8;ry:8;opacity:.94}.pulse{fill:var(--accent);opacity:.70;animation:pulse 3.2s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.30;animation-delay:1.2s}.glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.84}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.18))}}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:4px 7px;background:var(--orange)}
.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;min-height:auto}.card.soft{background:var(--soft)}.small{font-size:10px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:13px;font-weight:700;color:var(--accent);margin:0 0 5px;line-height:1.2}.card-text{font-size:13px;line-height:1.36;margin:0;color:var(--text)}.quote{font-size:12px;line-height:1.38;border-left:2px solid var(--accent);padding-left:9px;margin:6px 0 0;color:var(--text)}.metric{margin:0 0 6px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;margin:0 0 4px;font-family:'DM Mono','Courier New',monospace}.bar{height:5px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 6px;background:#fff;font-family:'DM Mono','Courier New',monospace}
@media(max-width:860px){.canvas{height:470px}.system{height:470px}.info-grid{grid-template-columns:1fr}.node text{font-size:12px}.controls{justify-content:flex-start}}
@media(max-width:560px){.canvas{height:425px}.system{height:425px}.controls button{font-size:11px;padding:7px 9px}.node text{font-size:11px}}
</style>
</head>
<body>
<main class="wrap" id="wrap">
<div class="controls"><button id="btn-personality" class="active" onclick="setMode('personality')">Personality pathway</button><button id="btn-tam" onclick="setMode('tam')">TAM pathway</button><button id="btn-achievement" onclick="setMode('achievement')">Achievement pathway</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1440 580" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Moodle personality self-efficacy technology acceptance achievement system">
<text class="layer-label" x="75" y="38">PERSONALITY TRAITS</text><line class="layer-rule" x1="75" y1="52" x2="345" y2="52"/>
<text class="layer-label" x="430" y="38">ONLINE SELF-EFFICACY</text><line class="layer-rule" x1="430" y1="52" x2="720" y2="52"/>
<text class="layer-label" x="770" y="38">MOODLE ACCEPTANCE + USE</text><line class="layer-rule" x1="770" y1="52" x2="1115" y2="52"/>
<text class="layer-label" x="1210" y="38">COURSE OUTCOME</text><line class="layer-rule" x1="1210" y1="52" x2="1380" y2="52"/>

<path id="p-cons-oas" class="path orange" d="M278 210 C345 210 395 245 466 280"/>
<path id="p-agre-oas" class="path" d="M278 330 C350 330 405 305 466 290"/>
<path id="p-extr-att" class="path grey" d="M278 100 C565 96 735 190 790 285"/>
<path id="p-extr-ca" class="path grey" d="M278 100 C760 60 1190 112 1240 230"/>
<path id="p-oas-peu" class="path" d="M702 258 C755 194 805 151 872 135"/>
<path id="p-oas-pu" class="path" d="M702 280 C760 280 810 250 872 222"/>
<path id="p-oas-amu" class="path orange" d="M702 304 C820 420 1005 432 1110 365"/>
<path id="p-peu-pu" class="path" d="M1048 135 C1090 158 1102 190 1052 218"/>
<path id="p-pu-att" class="path orange" d="M872 235 C830 255 810 273 790 305"/>
<path id="p-att-amu" class="path grey" d="M966 312 C1015 330 1058 346 1110 360"/>
<path id="p-amu-ca" class="path orange" d="M1230 360 C1280 332 1298 285 1296 248"/>
<path id="p-loop" class="path light" d="M1298 248 C1085 520 510 520 150 405"/>

<circle class="pulse orange" cx="360" cy="230" r="5"/><circle class="pulse" cx="762" cy="246" r="5"/><circle class="pulse orange" cx="832" cy="270" r="5"/><circle class="pulse orange" cx="1262" cy="318" r="5"/><circle class="pulse faint" cx="560" cy="100" r="5"/>

<g><rect class="label-bg" x="342" y="198" width="64" height="25"/><text class="coef orange" x="352" y="216">.31***</text></g>
<g><rect class="label-bg" x="344" y="334" width="54" height="25"/><text class="coef em" x="354" y="352">.18*</text></g>
<g><rect class="label-bg" x="752" y="185" width="60" height="25"/><text class="coef em" x="762" y="203">.22**</text></g>
<g><rect class="label-bg" x="752" y="300" width="60" height="25"/><text class="coef em" x="762" y="318">.21**</text></g>
<g><rect class="label-bg" x="838" y="248" width="68" height="25"/><text class="coef orange" x="848" y="266">.63***</text></g>
<g><rect class="label-bg" x="1236" y="300" width="68" height="25"/><text class="coef orange" x="1246" y="318">.34***</text></g>
<g><rect class="label-bg" x="580" y="82" width="110" height="25"/><text class="coef" x="590" y="100">EXTR to CA -</text></g>

<g class="node" id="node-extr" onclick="selectNode('extr')"><ellipse cx="150" cy="100" rx="118" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="150" y="104" text-anchor="middle">EXTRAVERSION</text></g>
<g class="node selected glow" id="node-cons" onclick="selectNode('cons')"><ellipse cx="150" cy="210" rx="118" ry="46" fill="#fff" stroke="#d9d2dd"/><text x="150" y="206" text-anchor="middle">CONSCIENT.</text><text x="150" y="224" text-anchor="middle">CONS</text></g>
<g class="node" id="node-agre" onclick="selectNode('agre')"><ellipse cx="150" cy="330" rx="118" ry="46" fill="#fff" stroke="#d9d2dd"/><text x="150" y="326" text-anchor="middle">AGREEABLE</text><text x="150" y="344" text-anchor="middle">AGRE</text></g>
<g class="node" id="node-oas" onclick="selectNode('oas')"><ellipse cx="590" cy="285" rx="122" ry="64" fill="#fff" stroke="#d9d2dd"/><text x="590" y="271" text-anchor="middle">ONLINE</text><text x="590" y="289" text-anchor="middle">ACADEMIC</text><text x="590" y="307" text-anchor="middle">SELF-EFFICACY</text></g>
<g class="node" id="node-peu" onclick="selectNode('peu')"><ellipse cx="960" cy="135" rx="96" ry="46" fill="#fff" stroke="#d9d2dd"/><text x="960" y="131" text-anchor="middle">PERCEIVED</text><text x="960" y="149" text-anchor="middle">EASE</text></g>
<g class="node" id="node-pu" onclick="selectNode('pu')"><ellipse cx="960" cy="225" rx="98" ry="46" fill="#fff" stroke="#d9d2dd"/><text x="960" y="221" text-anchor="middle">PERCEIVED</text><text x="960" y="239" text-anchor="middle">USEFULNESS</text></g>
<g class="node" id="node-att" onclick="selectNode('att')"><ellipse cx="900" cy="318" rx="104" ry="46" fill="#fff" stroke="#d9d2dd"/><text x="900" y="314" text-anchor="middle">ATTITUDE</text><text x="900" y="332" text-anchor="middle">TOWARD LMS</text></g>
<g class="node" id="node-amu" onclick="selectNode('amu')"><ellipse cx="1180" cy="365" rx="106" ry="50" fill="#fff" stroke="#d9d2dd"/><text x="1180" y="356" text-anchor="middle">ACTUAL</text><text x="1180" y="374" text-anchor="middle">MOODLE USE</text></g>
<g class="node glow" id="node-ca" onclick="selectNode('ca')"><ellipse cx="1300" cy="225" rx="114" ry="54" fill="#fff" stroke="#d9d2dd"/><text x="1300" y="221" text-anchor="middle">COURSE</text><text x="1300" y="239" text-anchor="middle">ACHIEVEMENT</text></g>
</svg><div class="legend"><span>click nodes</span><span>orange = strongest route</span><span>grey = caution/negative</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Personality pathway</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Conscientiousness</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">Moodle</span><span class="tag">TAM</span><span class="tag">self-efficacy</span></div></div></section>
</main>
<script>
const nodeData={extr:{title:'Extraversion',text:'Extraversion was associated with a more positive attitude toward Moodle but a negative direct effect on course achievement in the respecified model.',quote:'Socially distanced asynchronous learning may disadvantage students whose learning energy depends on immediate social presence.'},cons:{title:'Conscientiousness',text:'Conscientiousness was the dominant personality trait: it predicted online academic self-efficacy, actual Moodle use, and indirect achievement outcomes.',quote:'Disciplined, organized students were best positioned to convert the online course structure into productive action.'},agre:{title:'Agreeableness',text:'Agreeableness positively predicted online academic self-efficacy and indirectly supported Moodle acceptance, actual Moodle use and course achievement.',quote:'A harmonious and compliant response to the online learning environment supported adaptive engagement.'},oas:{title:'Online academic self-efficacy',text:'Online academic self-efficacy was a central bridge from personality to technology acceptance and actual Moodle use.',quote:'Unlike personality traits, self-efficacy beliefs are malleable and therefore open to educational intervention.'},peu:{title:'Perceived ease of use',text:'Perceived ease of use was shaped by online academic self-efficacy and strongly predicted perceived usefulness, but did not directly drive attitudes.',quote:'In a compulsory course, ease may matter most as a route into usefulness.'},pu:{title:'Perceived usefulness',text:'Perceived usefulness was the strongest predictor of attitude toward Moodle in the tested acceptance pathway.',quote:'Students liked Moodle when they perceived it as useful for getting work done.'},att:{title:'Attitude toward Moodle',text:'Attitude accounted for substantial shared variance, but it did not reliably explain actual Moodle use or achievement in this compulsory context.',quote:'Positive attitude does not necessarily become measurable behaviour when platform use is required.'},amu:{title:'Actual Moodle use',text:'Actual Moodle use was measured using objective log data rather than self-reported intention and was a strong predictor of course achievement.',quote:'Observed platform use mattered more than stated intention or general positivity.'},ca:{title:'Course achievement',text:'Course achievement was explained through personality, self-efficacy and actual Moodle use, with 14.6% of variance accounted for in the respecified model.',quote:'Achievement emerged through the interaction of learner profile, self-belief and observed system engagement.'}};
const modeData={personality:{title:'Personality pathway',text:'This view highlights the role of conscientiousness and agreeableness in shaping online academic self-efficacy and downstream Moodle acceptance/use outcomes.',metrics:[['Conscientiousness signal',90],['Agreeableness signal',68],['Extraversion caution',58],['Self-efficacy bridge',82]],paths:['p-cons-oas','p-agre-oas','p-extr-att','p-extr-ca','p-oas-peu','p-oas-pu','p-oas-amu']},tam:{title:'TAM pathway',text:'This view emphasizes the technology acceptance pathway: online self-efficacy supports perceived ease and usefulness, with usefulness strongly shaping attitude.',metrics:[['PEU to PU',88],['PU to attitude',92],['OAS to PEU',72],['OAS to PU',70]],paths:['p-oas-peu','p-oas-pu','p-peu-pu','p-pu-att','p-att-amu']},achievement:{title:'Achievement pathway',text:'This view foregrounds the practical endpoint: actual Moodle use predicted achievement, while personality and online self-efficacy shaped use indirectly and directly.',metrics:[['AMU to achievement',84],['Achievement variance',15],['AMU variance',14],['OAS to AMU',74]],paths:['p-cons-oas','p-agre-oas','p-oas-amu','p-amu-ca','p-loop','p-extr-ca']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
function sendHeight(){var wrap=document.getElementById('wrap');if(!wrap||!window.parent){return}var h=Math.ceil(wrap.getBoundingClientRect().height)+2;window.parent.postMessage({type:'resize',source:'rivers-moodle-self-efficacy-system',height:h},'*')}
function queueHeight(){requestAnimationFrame(function(){requestAnimationFrame(sendHeight)})}
setMode('personality');selectNode('cons');window.addEventListener('load',queueHeight);window.addEventListener('resize',queueHeight);if('ResizeObserver' in window){new ResizeObserver(queueHeight).observe(document.getElementById('wrap'))}queueHeight();
</script>
</body></html>
