<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moodle Acceptance Self-Efficacy System</title>
<style>
:root{--accent:#520671;--orange:#e05c2a;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1080px;margin:0 auto;padding:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;justify-content:center}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{background:var(--accent);border-color:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.canvas{height:450px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}.system{display:block;width:100%;height:450px}.node{cursor:pointer}.node ellipse,.node rect{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover ellipse,.node.selected ellipse,.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:11.5px;font-weight:700}.path{fill:none;stroke:var(--accent);stroke-width:2.35;stroke-linecap:round;stroke-dasharray:7 10;opacity:.50;animation:dash 7s linear infinite}.path.orange{stroke:var(--orange);opacity:.66}.path.grey{stroke:var(--muted);stroke-width:1.4;opacity:.28;stroke-dasharray:4 9}.path.light{stroke-width:1.2;opacity:.16}.mode-dim{opacity:.10}.mode-focus{opacity:.95}.pulse{fill:var(--accent);opacity:.72;animation:pulse 2.8s ease-in-out infinite}.pulse.orange{fill:var(--orange);animation-delay:.35s}.pulse.faint{fill:var(--muted);opacity:.32;animation-delay:1.2s}.glow{animation:glow 3.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{r:4;opacity:.18}50%{r:7;opacity:.86}}@keyframes glow{0%,100%{filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}50%{filter:drop-shadow(0 4px 18px rgba(82,6,113,.20))}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:12.5px;fill:var(--muted);font-weight:600}.coef{font-family:'DM Mono','Courier New',monospace;font-size:11px;fill:var(--muted)}.coef.em{fill:var(--accent);font-weight:700}.coef.orange{fill:var(--orange);font-weight:700}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:11px;color:#fff}.legend span{border:1px solid #d96a3c;border-radius:99px;padding:5px 8px;background:var(--orange)}.info-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;align-items:stretch}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px;min-height:150px}.card.soft{background:var(--soft)}.small{font-size:11px;color:var(--orange);font-family:'DM Mono','Courier New',monospace;margin-bottom:7px;text-transform:uppercase;letter-spacing:.02em}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px;line-height:1.25}.card-text{font-size:14px;line-height:1.42;margin:0;color:var(--text)}.quote{font-size:13.5px;line-height:1.5;border-left:2px solid var(--accent);padding-left:11px;margin:8px 0 0;color:var(--text)}.metric{margin:0 0 9px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin:0 0 5px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;background:#fff;font-family:'DM Mono','Courier New',monospace}@media(max-width:860px){.canvas{height:405px}.system{height:405px}.info-grid{grid-template-columns:1fr}.node text{font-size:10.5px}.controls{justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap">
<div class="controls"><button id="btn-personality" class="active" onclick="setMode('personality')">Personality pathway</button><button id="btn-tam" onclick="setMode('tam')">TAM pathway</button><button id="btn-achievement" onclick="setMode('achievement')">Achievement pathway</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1080 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Moodle personality self-efficacy technology acceptance achievement system">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#520671"/></marker><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e05c2a"/></marker><marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9a9890"/></marker></defs>
<text class="side-label" x="62" y="48">personality traits</text><text class="side-label" x="300" y="48">online self-efficacy</text><text class="side-label" x="540" y="48">Moodle acceptance</text><text class="side-label" x="830" y="48">use + achievement</text>
<path id="p-cons-oas" class="path orange" marker-end="url(#arrowOrange)" d="M184 172 C240 172 268 185 318 205"/>
<path id="p-agre-oas" class="path" marker-end="url(#arrow)" d="M184 252 C240 252 268 238 318 225"/>
<path id="p-extr-att" class="path grey" marker-end="url(#arrowGrey)" d="M184 95 C400 95 560 140 646 198"/>
<path id="p-extr-ca" class="path grey" marker-end="url(#arrowGrey)" d="M184 95 C520 70 850 112 925 180"/>
<path id="p-oas-peu" class="path" marker-end="url(#arrow)" d="M454 210 C500 170 530 142 570 128"/>
<path id="p-oas-pu" class="path" marker-end="url(#arrow)" d="M454 220 C505 220 532 205 570 190"/>
<path id="p-oas-amu" class="path orange" marker-end="url(#arrowOrange)" d="M454 236 C570 312 710 328 822 315"/>
<path id="p-peu-pu" class="path" marker-end="url(#arrow)" d="M650 128 C690 138 704 152 710 172"/>
<path id="p-pu-att" class="path orange" marker-end="url(#arrowOrange)" d="M710 200 C690 215 674 225 650 238"/>
<path id="p-att-amu" class="path grey" marker-end="url(#arrowGrey)" d="M724 252 C760 272 788 292 822 305"/>
<path id="p-amu-ca" class="path orange" marker-end="url(#arrowOrange)" d="M918 314 C948 294 960 260 960 230"/>
<path id="p-loop" class="path light" d="M950 220 C790 402 360 400 120 300"/>
<circle class="pulse orange" cx="245" cy="180" r="5"/><circle class="pulse" cx="505" cy="190" r="5"/><circle class="pulse orange" cx="695" cy="218" r="5"/><circle class="pulse orange" cx="936" cy="280" r="5"/><circle class="pulse faint" cx="300" cy="95" r="5"/>
<text class="coef orange" x="230" y="160">.31***</text><text class="coef em" x="230" y="274">.18*</text><text class="coef em" x="506" y="164">.22**</text><text class="coef em" x="515" y="234">.21**</text><text class="coef orange" x="696" y="218">.63***</text><text class="coef orange" x="918" y="286">.34***</text><text class="coef" x="450" y="90">EXTR → CA -.16*</text>
<g class="node" id="node-extr" onclick="selectNode('extr')"><ellipse cx="110" cy="95" rx="74" ry="34" fill="#fff" stroke="#d9d2dd"/><text x="110" y="99" text-anchor="middle">EXTRAVERSION</text></g>
<g class="node selected glow" id="node-cons" onclick="selectNode('cons')"><ellipse cx="110" cy="172" rx="74" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="110" y="168" text-anchor="middle">CONSCIENT.</text><text x="110" y="185" text-anchor="middle">CONS</text></g>
<g class="node" id="node-agre" onclick="selectNode('agre')"><ellipse cx="110" cy="252" rx="74" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="110" y="248" text-anchor="middle">AGREEABLE</text><text x="110" y="265" text-anchor="middle">AGRE</text></g>
<g class="node" id="node-oas" onclick="selectNode('oas')"><ellipse cx="386" cy="220" rx="76" ry="54" fill="#fff" stroke="#d9d2dd"/><text x="386" y="207" text-anchor="middle">ONLINE</text><text x="386" y="224" text-anchor="middle">ACADEMIC</text><text x="386" y="241" text-anchor="middle">SELF-EFFICACY</text></g>
<g class="node" id="node-peu" onclick="selectNode('peu')"><ellipse cx="632" cy="124" rx="66" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="632" y="120" text-anchor="middle">PERCEIVED</text><text x="632" y="137" text-anchor="middle">EASE</text></g>
<g class="node" id="node-pu" onclick="selectNode('pu')"><ellipse cx="632" cy="194" rx="66" ry="38" fill="#fff" stroke="#d9d2dd"/><text x="632" y="190" text-anchor="middle">PERCEIVED</text><text x="632" y="207" text-anchor="middle">USEFULNESS</text></g>
<g class="node" id="node-att" onclick="selectNode('att')"><ellipse cx="664" cy="262" rx="64" ry="36" fill="#fff" stroke="#d9d2dd"/><text x="664" y="258" text-anchor="middle">ATTITUDE</text><text x="664" y="275" text-anchor="middle">TOWARD LMS</text></g>
<g class="node" id="node-amu" onclick="selectNode('amu')"><ellipse cx="870" cy="312" rx="72" ry="42" fill="#fff" stroke="#d9d2dd"/><text x="870" y="303" text-anchor="middle">ACTUAL</text><text x="870" y="320" text-anchor="middle">MOODLE USE</text></g>
<g class="node glow" id="node-ca" onclick="selectNode('ca')"><ellipse cx="960" cy="204" rx="74" ry="44" fill="#fff" stroke="#d9d2dd"/><text x="960" y="200" text-anchor="middle">COURSE</text><text x="960" y="217" text-anchor="middle">ACHIEVEMENT</text></g>
</svg><div class="legend"><span>click nodes</span><span>orange = strongest route</span><span>grey = caution/negative</span></div>
</section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM STATE</div><div class="card-title" id="stateTitle">Personality pathway</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Conscientiousness</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL EMPHASIS</div><div id="metrics"></div><div class="tag-row"><span class="tag">Moodle</span><span class="tag">TAM</span><span class="tag">self-efficacy</span></div></div></section>
</main>
<script>
const nodeData={extr:{title:'Extraversion',text:'Extraversion was associated with a more positive attitude toward Moodle but a negative direct effect on course achievement in the respecified model.',quote:'Socially distanced asynchronous learning may disadvantage students whose learning energy depends on immediate social presence.'},cons:{title:'Conscientiousness',text:'Conscientiousness was the dominant personality trait: it predicted online academic self-efficacy, actual Moodle use, and indirect achievement outcomes.',quote:'Disciplined, organized students were best positioned to convert the online course structure into productive action.'},agre:{title:'Agreeableness',text:'Agreeableness positively predicted online academic self-efficacy and indirectly supported Moodle acceptance, actual Moodle use and course achievement.',quote:'A harmonious and compliant response to the online learning environment supported adaptive engagement.'},oas:{title:'Online academic self-efficacy',text:'Online academic self-efficacy was a central bridge from personality to technology acceptance and actual Moodle use.',quote:'Unlike personality traits, self-efficacy beliefs are malleable and therefore open to educational intervention.'},peu:{title:'Perceived ease of use',text:'Perceived ease of use was shaped by online academic self-efficacy and strongly predicted perceived usefulness, but did not directly drive attitudes.',quote:'In a compulsory course, ease may matter most as a route into usefulness.'},pu:{title:'Perceived usefulness',text:'Perceived usefulness was the strongest predictor of attitude toward Moodle in the tested acceptance pathway.',quote:'Students liked Moodle when they perceived it as useful for getting work done.'},att:{title:'Attitude toward Moodle',text:'Attitude accounted for substantial shared variance, but it did not reliably explain actual Moodle use or achievement in this compulsory context.',quote:'Positive attitude does not necessarily become measurable behaviour when platform use is required.'},amu:{title:'Actual Moodle use',text:'Actual Moodle use was measured using objective log data rather than self-reported intention and was a strong predictor of course achievement.',quote:'Observed platform use mattered more than stated intention or general positivity.'},ca:{title:'Course achievement',text:'Course achievement was explained through personality, self-efficacy and actual Moodle use, with 14.6% of variance accounted for in the respecified model.',quote:'Achievement emerged through the interaction of learner profile, self-belief and observed system engagement.'}};
const modeData={personality:{title:'Personality pathway',text:'This view highlights the role of conscientiousness and agreeableness in shaping online academic self-efficacy and downstream Moodle acceptance/use outcomes.',metrics:[['Conscientiousness signal',90],['Agreeableness signal',68],['Extraversion caution',58],['Self-efficacy bridge',82]],paths:['p-cons-oas','p-agre-oas','p-extr-att','p-extr-ca','p-oas-peu','p-oas-pu','p-oas-amu']},tam:{title:'TAM pathway',text:'This view emphasizes the technology acceptance pathway: online self-efficacy supports perceived ease and usefulness, with usefulness strongly shaping attitude.',metrics:[['PEU → PU',88],['PU → attitude',92],['OAS → PEU',72],['OAS → PU',70]],paths:['p-oas-peu','p-oas-pu','p-peu-pu','p-pu-att','p-att-amu']},achievement:{title:'Achievement pathway',text:'This view foregrounds the practical endpoint: actual Moodle use predicted achievement, while personality and online self-efficacy shaped use indirectly and directly.',metrics:[['AMU → achievement',84],['Achievement variance',15],['AMU variance',14],['OAS → AMU',74]],paths:['p-cons-oas','p-agre-oas','p-oas-amu','p-amu-ca','p-loop','p-extr-ca']}};
function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));const el=document.getElementById('node-'+key);if(el)el.classList.add('selected');document.getElementById('nodeTitle').textContent=nodeData[key].title;document.getElementById('nodeText').textContent=nodeData[key].text;document.getElementById('nodeQuote').textContent=nodeData[key].quote;sendHeight()}
function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modeData[mode].title;document.getElementById('stateText').textContent=modeData[mode].text;document.querySelectorAll('.path').forEach(p=>{p.classList.remove('mode-focus','mode-dim');p.classList.add(modeData[mode].paths.includes(p.id)?'mode-focus':'mode-dim')});document.getElementById('metrics').innerHTML=modeData[mode].metrics.map(([label,value])=>`<div class="metric"><div class="metric-top"><span>${label}</span><span>${value}%</span></div><div class="bar"><span style="width:${Math.min(value,100)}%"></span></div></div>`).join('');sendHeight()}
setMode('personality');selectNode('cons');function sendHeight(){window.parent.postMessage({type:'resize',source:'rivers-moodle-self-efficacy-system',height:document.documentElement.scrollHeight},'*')}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);setInterval(sendHeight,1200);
</script>
</body></html>
