<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Metacognitive Learning System Diagram</title>
<style>
:root{--accent:#520671;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb;--panel:#fff}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1380px;margin:0 auto;padding:0 0 8px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;line-height:1;cursor:pointer;transition:all .2s ease;font-family:Inter,Arial,sans-serif}button.active{border-color:var(--accent);background:var(--accent);color:#fff}button:hover{transform:translateY(-1px);border-color:var(--accent)}.grid{display:grid;grid-template-columns:1.7fr .7fr;gap:18px;align-items:stretch}.canvas,.panel{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}.canvas{min-height:700px;position:relative}.panel{padding:18px;min-height:700px}svg.system{display:block;width:100%;height:700px}.node{cursor:pointer}.node circle{transition:all .2s ease;filter:drop-shadow(0 2px 8px rgba(82,6,113,.04))}.node:hover circle,.node.selected circle{stroke:var(--accent);stroke-width:2.8;filter:drop-shadow(0 4px 16px rgba(82,6,113,.18))}.node text{pointer-events:none;font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:13px;font-weight:700}.flow{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:7 10;opacity:.45;animation:dash 7s linear infinite}.flow.light{stroke-width:1.4;opacity:.22}@keyframes dash{to{stroke-dashoffset:-180}}.side-label{font-family:'DM Mono','Courier New',monospace;font-size:12px;fill:var(--muted)}.small{font-size:12px;color:var(--muted);font-family:'DM Mono','Courier New',monospace;margin-bottom:8px}.panel-title{font-family:'DM Mono','Courier New',monospace;font-size:15px;font-weight:700;color:var(--accent);margin:0 0 10px}.panel-text{font-size:15px;line-height:1.45;margin:0 0 16px}.quote{font-size:14px;line-height:1.55;border-left:2px solid var(--accent);padding-left:12px;margin:0 0 18px}.rule{height:1px;background:var(--line);margin:16px 0}.metric{margin:0 0 11px}.metric-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin:0 0 5px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}.method{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:9px;background:var(--soft)}.method-title{font-family:'DM Mono','Courier New',monospace;font-size:13px;font-weight:700;color:var(--accent);margin:0 0 8px}.method p{font-size:13.5px;line-height:1.45;margin:0}.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;background:#fff;font-family:'DM Mono','Courier New',monospace}.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-family:'DM Mono','Courier New',monospace;font-size:11px;color:var(--muted)}.legend span{border:1px solid var(--line);border-radius:99px;padding:5px 8px;background:rgba(255,255,255,.92)}@media(max-width:860px){.grid{grid-template-columns:1fr}.canvas,.panel{min-height:auto}svg.system{height:570px}}
</style>
</head>
<body>
Same body/script as previous version
</body>
</html>
