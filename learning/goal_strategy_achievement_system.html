<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goal Strategy Achievement System</title>
<style>
:root{--accent:#520671;--text:#6e6c66;--muted:#9a9890;--line:#e6e2de;--soft:#faf8fb}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--text);font-family:Inter,Arial,sans-serif;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:0}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;justify-content:center}
button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;font-size:13px;cursor:pointer}button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.canvas{height:560px;position:relative;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:14px}
.system{display:block;width:100%;height:560px}
.node circle{transition:.2s;filter:drop-shadow(0 2px 8px rgba(82,6,113,.05))}.node:hover circle,.node.selected circle{stroke:var(--accent);stroke-width:3}
.node text{font-family:'DM Mono','Courier New',monospace;fill:var(--accent);font-size:12px;font-weight:700}
.layer-label,.beta,.legend{font-family:'DM Mono','Courier New',monospace}.layer-label{
  font-size:14px;
  color:#d97706;
  letter-spacing:.04em;
}
.path{fill:none;stroke:#d8d2dc;stroke-width:1.6;opacity:.52}.path.strong{stroke:var(--accent);stroke-width:3;opacity:.78;stroke-dasharray:8 10}.path.med{stroke:var(--accent);stroke-width:2.1;opacity:.45;stroke-dasharray:5 8}.path.weak{stroke:#ddd8d4;stroke-width:1.2;opacity:.25}
.beta{font-size:11px;fill:var(--muted)}.beta.strong{fill:var(--accent);font-weight:700}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.legend span{border:1px solid var(--line);border-radius:99px;padding:5px 8px;background:rgba(255,255,255,.92)}
.info-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:14px}.card.soft{background:var(--soft)}
.small{
  font-size:11px;
  color:#d97706;
  font-family:'DM Mono','Courier New',monospace;
  margin-bottom:7px;
  letter-spacing:.03em;
}.card-title{font-family:'DM Mono','Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px}.card-text{font-size:14px;line-height:1.42}.quote{font-size:13px;line-height:1.5;border-left:2px solid var(--accent);padding-left:11px;margin-top:8px}.metric{margin-bottom:9px}.metric-top{display:flex;justify-content:space-between;font-size:11px;font-family:'DM Mono','Courier New',monospace}.bar{height:6px;border-radius:99px;background:#eee9e5;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 7px;font-family:'DM Mono','Courier New',monospace}
@media(max-width:860px){.canvas{height:460px}.system{height:460px}.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<div class="controls"><button id="btn-master" class="active" onclick="setMode('master')">Mastery pathway</button><button id="btn-performance" onclick="setMode('performance')">Performance pathway</button><button id="btn-model" onclick="setMode('model')">Full model</button></div>
<section class="canvas">
<svg class="system" viewBox="0 0 1180 560" preserveAspectRatio="xMidYMid meet">
<text class="layer-label" x="90" y="42">GOAL ORIENTATIONS</text><text class="layer-label" x="500" y="42">LEARNING STRATEGIES</text><text class="layer-label" x="930" y="42">ACHIEVEMENT OUTCOME</text>
<path id="p-pa-ach" class="path strong" d="M210 190 C480 80 790 90 940 250"/><path id="p-pa-str" class="path med" d="M210 190 C340 255 390 285 520 285"/><path id="p-m-str" class="path strong" d="M210 275 C340 285 390 285 520 285"/><path id="p-m-deep" class="path med" d="M210 275 C340 135 390 135 520 135"/><path id="p-deep-str" class="path strong" d="M650 135 C715 180 715 235 650 285"/><path id="p-str-ach" class="path strong" d="M650 285 C780 285 860 270 940 250"/><path id="p-pa-surface" class="path med" d="M210 190 C360 430 410 440 520 440"/><path id="p-surface-ach" class="path weak" d="M650 440 C790 410 870 350 940 270"/><path id="p-avoid" class="path weak" d="M210 360 C390 360 470 380 520 440"/>
<text class="beta strong" x="690" y="268">β=.327**</text><text class="beta strong" x="355" y="270">β=.326**</text><text class="beta strong" x="735" y="145">β=.429**</text><text class="beta strong" x="635" y="205">β=.321*</text><text class="beta" x="330" y="430">β=-.394**</text><text class="beta" x="955" y="305">R²=.285</text><text class="beta" x="545" y="325">R²=.312</text>
<g class="node selected" id="node-performance" onclick="selectNode('performance')"><circle cx="140" cy="190" r="62" fill="#fff" stroke="#d9d2dd"/><text x="140" y="184" text-anchor="middle">PERFORMANCE</text><text x="140" y="201" text-anchor="middle">APPROACH</text></g>
<g class="node" id="node-mastery" onclick="selectNode('mastery')"><circle cx="140" cy="275" r="58" fill="#fff" stroke="#d9d2dd"/><text x="140" y="270" text-anchor="middle">MASTERY</text><text x="140" y="287" text-anchor="middle">ORIENTATION</text></g>
<g class="node" id="node-avoidance" onclick="selectNode('avoidance')"><circle cx="140" cy="360" r="62" fill="#fff" stroke="#d9d2dd"/><text x="140" y="354" text-anchor="middle">PERFORMANCE</text><text x="140" y="371" text-anchor="middle">AVOIDANCE</text></g>
<g class="node" id="node-deep" onclick="selectNode('deep')"><circle cx="585" cy="135" r="58" fill="#fff" stroke="#d9d2dd"/><text x="585" y="131" text-anchor="middle">DEEP</text><text x="585" y="148" text-anchor="middle">APPROACH</text></g>
<g class="node" id="node-strategic" onclick="selectNode('strategic')"><circle cx="585" cy="285" r="66" fill="#fff" stroke="#d9d2dd"/><text x="585" y="281" text-anchor="middle">STRATEGIC</text><text x="585" y="298" text-anchor="middle">APPROACH</text></g>
<g class="node" id="node-surface" onclick="selectNode('surface')"><circle cx="585" cy="440" r="58" fill="#fff" stroke="#d9d2dd"/><text x="585" y="436" text-anchor="middle">SURFACE</text><text x="585" y="453" text-anchor="middle">APPROACH</text></g>
<g class="node" id="node-achievement" onclick="selectNode('achievement')"><circle cx="1020" cy="255" r="70" fill="#fff" stroke="#d9d2dd"/><text x="1020" y="249" text-anchor="middle">ACHIEVEMENT</text><text x="1020" y="266" text-anchor="middle">OUTCOMES</text></g>
</svg><div class="legend"><span>click nodes</span><span>toggle pathways</span><span>β = standardized effect</span><span>R² = explained variance</span></div></section>
<section class="info-grid"><div class="card soft"><div class="small">SYSTEM PROFILE</div><div class="card-title" id="stateTitle">Mastery pathway</div><p class="card-text" id="stateText"></p></div><div class="card"><div class="small">SELECTED COMPONENT</div><div class="card-title" id="nodeTitle">Performance approach</div><p class="card-text" id="nodeText"></p><p class="quote" id="nodeQuote"></p></div><div class="card"><div class="small">MODEL SIGNALS</div><div id="metrics"></div><div class="tag-row"><span class="tag">serial mediation</span><span class="tag">CALL</span><span class="tag">achievement</span></div></div></section></main>
<script>const nodes={performance:{title:'Performance-approach orientation',text:'A performance-approach orientation reflects externally referenced motivation organized around doing better than other learners and gaining positive comparative evaluation.',quote:'In the tested model, performance-approach had a direct positive effect on achievement.'},mastery:{title:'Mastery orientation',text:'A mastery orientation reflects interest, enjoyment and self-referenced competence development. Its effect on achievement was not direct, but mediated through strategic learning.',quote:'Mastery becomes productive when translated into strategic behaviour.'},avoidance:{title:'Performance-avoidance orientation',text:'Performance-avoidance reflects motivation to avoid embarrassment, negative judgement or exposure of lower competence.',quote:'Avoidance remained comparatively weak within the tested achievement system.'},deep:{title:'Deep approach',text:'A deep approach involves seeking meaning, relating ideas and understanding how ideas fit together.',quote:'Deep learning becomes achievement-relevant when connected to strategic regulation.'},strategic:{title:'Strategic approach',text:'Strategic learning includes organized studying, time management and steady work through the term.',quote:'Strategic regulation was the strongest actionable pathway to achievement.'},surface:{title:'Surface approach',text:'A surface approach involves remembering rather than understanding.',quote:'Surface learning did not directly support achievement in the tested model.'},achievement:{title:'Achievement outcomes',text:'Achievement was represented by composite assessment grades.',quote:'The full model accounted for 28.5% of the achievement variance.'}};const modes={master:{title:'Mastery pathway',text:'Mastery motivation becomes achievement-relevant when converted into strategic regulation.',metrics:[['Mastery → Strategic',33],['Deep → Strategic',32],['Strategic → Achievement',33],['Achievement variance',29]]},performance:{title:'Performance pathway',text:'Performance-approach motivation directly predicts achievement.',metrics:[['Performance → Achievement',43],['Performance → Strategic',26],['Strategic → Achievement',33],['Achievement variance',29]]},model:{title:'Full mediation model',text:'Achievement emerges from motivational architecture expressed through learning strategies.',metrics:[['Strategic variance',31],['Achievement variance',29],['Deep variance',15],['Surface variance',18]]}};function selectNode(key){document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));document.getElementById('node-'+key).classList.add('selected');document.getElementById('nodeTitle').textContent=nodes[key].title;document.getElementById('nodeText').textContent=nodes[key].text;document.getElementById('nodeQuote').textContent=nodes[key].quote;sendHeight()}function setMode(mode){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+mode).classList.add('active');document.getElementById('stateTitle').textContent=modes[mode].title;document.getElementById('stateText').textContent=modes[mode].text;document.getElementById('metrics').innerHTML=modes[mode].metrics.map(([l,v])=>`<div class='metric'><div class='metric-top'><span>${l}</span><span>${v}%</span></div><div class='bar'><span style='width:${v}%'></span></div></div>`).join('');sendHeight()}setMode('master');selectNode('performance');function sendHeight(){window.parent.postMessage({type:'resize',source:'rivers-goal-strategy-system',height:document.documentElement.scrollHeight},'*')}window.addEventListener('load',sendHeight);window.addEventListener('resize',sendHeight);</script>
</body></html>
