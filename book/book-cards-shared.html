<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../academic-cards/academic-cards.css">
<script src="../academic-cards/academic-renderer.js"></script>
<style>
html,body{width:100%;margin:0;padding:0;background:#ffffff;overflow:hidden}
#app.rivers-academic-wrap{width:100%;max-width:none;margin:0;padding:0}
#app .rivers-academic-ref{max-width:none}
#app .rivers-academic-card{border-radius:10px}
</style>
</head>
<body>
<div id="app" class="rivers-academic-wrap"></div>
<script>
fetch('../data/books.json')
  .then(r=>r.json())
  .then(data=>renderAcademic('app',data,{
    source:'rivers-books',
    itemLabel:'book',
    itemLabelPlural:'books',
    searchLabel:'books',
    stripAuthorPrefix:false,
    bookLayout:true
  }));
</script>
</body>
</html>
